<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alandeboer.computer</title>
    <meta name="description" content="A tiny 3D universe where Alan is always at his desk — eleven worlds to wander, from a neon room to a storm lighthouse to a Mars colony pod. One beagle named Clark.">
    <meta name="theme-color" content="#0a0e1e">
    <meta property="og:title" content="alandeboer.computer">
    <meta property="og:description" content="A tiny 3D universe where Alan is always at his desk — eleven worlds to wander, one beagle named Clark.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alandeboer.computer/">
    <meta property="og:image" content="https://alandeboer.computer/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://alandeboer.computer/og.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
        }
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            user-select: none;
            font-family: 'Quicksand', sans-serif;
        }
        #site-name {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(80, 110, 220, 0.45);
            font-weight: 300;
            font-size: 12px;
            letter-spacing: 7px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        #hint {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(80, 110, 220, 0.2);
            font-weight: 300;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        /* Cinematic vignette */
        #ui::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(0,0,0,0.42) 100%);
            pointer-events: none;
        }

        /* ── Lighting panel: frosted glass, one quiet instrument ── */
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: all;
            padding: 14px 18px 16px;
            background: rgba(7, 9, 20, 0.82);
            border: 1px solid rgba(125, 150, 255, 0.22);
            border-radius: 12px;
            backdrop-filter: blur(14px) saturate(1.25);
            -webkit-backdrop-filter: blur(14px) saturate(1.25);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }
        .panel-title {
            color: rgba(150, 175, 255, 0.42);
            font-weight: 300;
            font-size: 9px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            margin-bottom: 1px;
            cursor: default;
        }
        .ctrl-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ctrl-row label {
            color: rgba(155, 180, 255, 0.72);
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            width: 76px;
            text-align: left;
            flex-shrink: 0;
            cursor: default;
        }
        .ctrl-row input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 116px;
            height: 3px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .ctrl-row input[type="range"]:focus-visible {
            outline: 1px solid rgba(160, 185, 255, 0.7);
            outline-offset: 5px;
        }
        #brightness-slider {
            background: linear-gradient(to right, rgba(80,110,220,0.08), rgba(80,110,220,0.5));
        }
        #color-slider {
            background: linear-gradient(to right, #0e1e55, #1a3aaa, #aac0ff, #ee8833);
        }
        #lamp-slider {
            background: linear-gradient(to right, rgba(180,90,20,0.1), rgba(255,150,50,0.6));
        }
        #lamp-color-slider {
            background: linear-gradient(to right, #2a0e00, #cc5500, #ffeedd, #aabbff);
        }
        #time-slider {
            background: linear-gradient(to right, #0a1230, #28406e, #d08a4a, #aee0ff);
        }
        #season-slider {
            background: linear-gradient(to right, #f0a8c8, #4a8a3a, #c88a2a, #e8eef2);
        }
        .ctrl-row.hidden { display: none; }

        /* ── World picker: one chip per world, lit in that world's color ── */
        #worlds {
            position: absolute;
            top: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 648px;
            gap: 3px;
            pointer-events: all;
            padding: 5px;
            background: rgba(7, 9, 20, 0.82);
            border: 1px solid rgba(125, 150, 255, 0.22);
            border-radius: 12px;
            backdrop-filter: blur(14px) saturate(1.25);
            -webkit-backdrop-filter: blur(14px) saturate(1.25);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }
        .world {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: rgba(150, 170, 230, 0.5);
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.2s, background 0.2s, border-color 0.2s;
        }
        .world .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--wc);
            box-shadow: 0 0 6px var(--wc);
            opacity: 0.45;
            transition: opacity 0.2s, box-shadow 0.2s;
        }
        .world:hover {
            color: rgba(205, 220, 255, 0.92);
            background: rgba(95, 120, 210, 0.10);
        }
        .world:focus-visible {
            outline: 1px solid rgba(160, 185, 255, 0.7);
            outline-offset: 2px;
        }
        .world.active {
            color: rgba(228, 236, 255, 0.95);
            background: color-mix(in srgb, var(--wc) 11%, transparent);
            border-color: color-mix(in srgb, var(--wc) 40%, transparent);
        }
        .world.active .dot {
            opacity: 1;
            box-shadow: 0 0 10px var(--wc), 0 0 2px rgba(255, 255, 255, 0.9);
        }
        .world[data-world="room"]      { --wc: #7d9bff; }
        .world[data-world="forest"]    { --wc: #6fd07a; }
        .world[data-world="northPole"] { --wc: #7ce8ff; }
        .world[data-world="spaceship"] { --wc: #ff8d5c; }
        .world[data-world="river"]     { --wc: #5fc0d8; }
        .world[data-world="lighthouse"] { --wc: #ffd27a; }
        .world[data-world="apiary"]    { --wc: #f0b428; }
        .world[data-world="tavern"]    { --wc: #d85c28; }
        .world[data-world="video"]     { --wc: #ffec3d; }
        .world[data-world="tillson"]   { --wc: #ff7418; }
        .world[data-world="recall"]    { --wc: #ff5a3c; }

        .ctrl-sep {
            height: 1px;
            background: rgba(110, 140, 255, 0.12);
            margin: 2px 0;
        }

        /* ── Sound toggle: appears only at the river ── */
        #sound-btn {
            position: absolute;
            top: 136px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 7px;
            pointer-events: all;
            padding: 8px 13px;
            background: rgba(7, 9, 20, 0.82);
            border: 1px solid rgba(125, 150, 255, 0.22);
            border-radius: 10px;
            backdrop-filter: blur(14px) saturate(1.25);
            -webkit-backdrop-filter: blur(14px) saturate(1.25);
            color: rgba(150, 170, 230, 0.5);
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        #sound-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #5fc0d8;
            box-shadow: 0 0 6px #5fc0d8;
            opacity: 0.35;
            transition: opacity 0.2s;
        }
        #sound-btn:hover { color: rgba(205, 220, 255, 0.92); }
        #sound-btn:focus-visible {
            outline: 1px solid rgba(160, 185, 255, 0.7);
            outline-offset: 2px;
        }
        #sound-btn.on {
            color: rgba(228, 236, 255, 0.95);
            border-color: rgba(95, 192, 216, 0.4);
        }
        #sound-btn.on .dot { opacity: 1; }
        #sound-btn.hidden { display: none; }

        /* ── Mobile keyboard bar: the terminal/laptop app need typed input,
           but touch devices have no physical keyboard to trigger it ── */
        #mobile-bar {
            position: absolute;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: all;
            box-sizing: border-box;
            padding: 10px 12px;
            background: rgba(7, 9, 20, 0.92);
            border: 1px solid rgba(125, 150, 255, 0.28);
            border-radius: 12px;
            backdrop-filter: blur(14px) saturate(1.25);
            -webkit-backdrop-filter: blur(14px) saturate(1.25);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
            z-index: 20;
            width: min(92vw, 420px);
        }
        #mobile-bar.hidden { display: none; }
        #mobile-input {
            flex: 1;
            min-width: 0;
            background: rgba(150, 170, 230, 0.08);
            border: 1px solid rgba(125, 150, 255, 0.22);
            border-radius: 8px;
            padding: 9px 11px;
            color: rgba(230, 237, 255, 0.95);
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            outline: none;
        }
        #mobile-input::placeholder { color: rgba(150, 170, 230, 0.4); }
        #mobile-bar button {
            flex-shrink: 0;
            padding: 9px 13px;
            background: rgba(125, 150, 255, 0.14);
            border: 1px solid rgba(125, 150, 255, 0.3);
            border-radius: 8px;
            color: rgba(210, 222, 255, 0.9);
            font-family: 'Quicksand', sans-serif;
            font-size: 13px;
            cursor: pointer;
        }
        #mobile-bar button:active { background: rgba(125, 150, 255, 0.28); }

        /* narrow desktops: the picker grid would overlap the centered
           site name, so the name joins the hint at the bottom */
        @media (max-width: 1500px) and (min-width: 861px) {
            #site-name {
                top: auto;
                bottom: 46px;
                font-size: 10px;
                letter-spacing: 5px;
            }
        }
        @media (max-width: 860px) {
            #worlds {
                left: 12px;
                right: 12px;
                top: 12px;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
                gap: 3px;
            }
            .world { padding: 7px 6px; font-size: 9px; letter-spacing: 1px; gap: 5px; justify-content: center; }
            #controls {
                top: auto;
                bottom: 16px;
                left: 12px;
                padding: 11px 14px 13px;
                gap: 10px;
            }
            .ctrl-row input[type="range"] { width: 90px; }
            #site-name {
                top: auto;
                bottom: 20px;
                left: auto;
                right: 14px;
                transform: none;
                font-size: 9px;
                letter-spacing: 3px;
            }
            #sound-btn {
                top: auto;
                bottom: 48px;
                right: 12px;
            }
            #hint { display: none; }
            #mobile-bar {
                left: 12px;
                right: 12px;
                bottom: 16px;
                transform: none;
                width: auto;
                padding: 8px 8px 8px 10px;
                gap: 6px;
            }
            #mobile-input { font-size: 13px; padding: 8px 9px; }
            #mobile-bar button { padding: 8px 10px; font-size: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            #ui * { transition: none !important; }
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(205, 220, 255, 0.92);
            box-shadow: 0 0 7px rgba(140, 170, 255, 0.75), 0 0 0 3px rgba(140, 170, 255, 0.14);
            cursor: pointer;
            transition: box-shadow 0.15s, background 0.15s;
        }
        input[type="range"]:hover::-webkit-slider-thumb {
            background: #ffffff;
            box-shadow: 0 0 10px rgba(160, 190, 255, 0.95), 0 0 0 4px rgba(140, 170, 255, 0.22);
        }
        input[type="range"]::-moz-range-thumb {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(205, 220, 255, 0.92);
            box-shadow: 0 0 7px rgba(140, 170, 255, 0.75), 0 0 0 3px rgba(140, 170, 255, 0.14);
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="site-name">alandeboer.computer</div>
        <div id="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; pet clark &nbsp;·&nbsp; click the monitor</div>
        <div id="controls">
            <div class="panel-title">lighting</div>
            <div class="ctrl-row">
                <label for="brightness-slider">brightness</label>
                <input type="range" id="brightness-slider" min="0.1" max="2.2" step="0.01" value="1.0">
            </div>
            <div class="ctrl-row" id="color-row">
                <label for="color-slider">color</label>
                <input type="range" id="color-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="ctrl-row hidden" id="time-row">
                <label for="time-slider" id="time-label">time</label>
                <input type="range" id="time-slider" min="0" max="1" step="0.01" value="1.0">
            </div>
            <div class="ctrl-row hidden" id="season-row">
                <label for="season-slider">season</label>
                <input type="range" id="season-slider" min="0" max="1" step="0.01" value="0.33">
            </div>
            <div class="ctrl-sep"></div>
            <div class="ctrl-row" id="lamp-row">
                <label for="lamp-slider" id="lamp-label">lamp</label>
                <input type="range" id="lamp-slider" min="0" max="2.5" step="0.01" value="1.0">
            </div>
            <div class="ctrl-row" id="lamp-tint-row">
                <label for="lamp-color-slider">lamp tint</label>
                <input type="range" id="lamp-color-slider" min="0" max="1" step="0.01" value="0.0">
            </div>
        </div>
        <nav id="worlds" aria-label="Choose a world">
            <button class="world active" data-world="room"><span class="dot"></span>the room</button>
            <button class="world" data-world="forest"><span class="dot"></span>the woods</button>
            <button class="world" data-world="northPole"><span class="dot"></span>north pole</button>
            <button class="world" data-world="spaceship"><span class="dot"></span>spaceship</button>
            <button class="world" data-world="river"><span class="dot"></span>the river</button>
            <button class="world" data-world="lighthouse"><span class="dot"></span>lighthouse</button>
            <button class="world" data-world="apiary"><span class="dot"></span>the apiary</button>
            <button class="world" data-world="tavern"><span class="dot"></span>the tavern</button>
            <button class="world" data-world="video"><span class="dot"></span>video store</button>
            <button class="world" data-world="tillson"><span class="dot"></span>tillson st</button>
            <button class="world" data-world="recall"><span class="dot"></span>total recall</button>
        </nav>
        <button id="sound-btn" class="hidden"><span class="dot"></span>sound</button>
        <div id="mobile-bar" class="hidden">
            <input id="mobile-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="type a command…">
            <button id="mobile-send" type="button" aria-label="Send">⏎</button>
            <button id="mobile-close" type="button" aria-label="Close">✕</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ── Renderer ──
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        document.body.appendChild(renderer.domElement);
        const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

        // ── Bloom pipeline: bright/emissive surfaces radiate ──
        // Bloom runs on linear HDR values; OutputPass applies tone mapping after.
        const composer = new EffectComposer(renderer);
        composer.setPixelRatio(renderer.getPixelRatio());

        // ── Scene ──
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030306);
        scene.fog = new THREE.FogExp2(0x030306, 0.07);

        // ── Theme groups: scenery is split so the button can swap worlds.
        //    Desk, person and dog live directly in the scene (shared).
        let theme = 'room';
        const roomGroup = new THREE.Group();
        const forestGroup = new THREE.Group();
        forestGroup.visible = false;
        const northPoleGroup = new THREE.Group();
        northPoleGroup.visible = false;
        const spaceshipGroup = new THREE.Group();
        spaceshipGroup.visible = false;
        const riverGroup = new THREE.Group();
        riverGroup.visible = false;
        const lighthouseGroup = new THREE.Group();
        lighthouseGroup.visible = false;
        scene.add(lighthouseGroup);
        const apiaryGroup = new THREE.Group();
        apiaryGroup.visible = false;
        scene.add(apiaryGroup);
        const tavernGroup = new THREE.Group();
        tavernGroup.visible = false;
        scene.add(tavernGroup);
        const videoGroup = new THREE.Group();
        videoGroup.visible = false;
        scene.add(videoGroup);
        const tillsonGroup = new THREE.Group();
        tillsonGroup.visible = false;
        scene.add(tillsonGroup);
        const recallGroup = new THREE.Group();
        recallGroup.visible = false;
        scene.add(recallGroup);
        scene.add(roomGroup);
        scene.add(forestGroup);
        scene.add(northPoleGroup);
        scene.add(spaceshipGroup);
        scene.add(riverGroup);
        let addTarget = scene; // construction target; switched per section below

        // ── Camera ──
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 30);
        camera.position.set(3.5, 2.6, 5.0);

        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 0.45, 0.6, 1.0);
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        // ── Performance watchdog: steps render resolution down when frames
        //    drop, back up when there's headroom. Hysteresis + cooldowns
        //    keep it from oscillating on the boundary.
        const BASE_PR = Math.min(window.devicePixelRatio, 2);
        const PR_STEPS = [1, 0.85, 0.7, 0.55];
        let prIdx = 0, perfEma = 1 / 60, perfCooldown = 3;
        const applyPR = () => {
            const pr = BASE_PR * PR_STEPS[prIdx];
            renderer.setPixelRatio(pr);
            composer.setPixelRatio(pr);
            composer.setSize(window.innerWidth, window.innerHeight);
        };
        const perfWatch = dt => {
            if (dt > 0.25) return;   // tab switch / hitch — not signal
            perfEma += (dt - perfEma) * 0.05;
            perfCooldown -= dt;
            if (perfCooldown > 0) return;
            if (perfEma > 1 / 42 && prIdx < PR_STEPS.length - 1) {
                prIdx++;
                applyPR();
                perfCooldown = 2.5;
            } else if (perfEma < 1 / 56 && prIdx > 0) {
                prIdx--;
                applyPR();
                perfCooldown = 5;
            }
        };

        // ── Orbit controls ──
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.05, 0.2);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.4;
        controls.maxDistance = 22;
        controls.zoomSpeed = 3.0;
        controls.maxPolarAngle = Math.PI * 0.8;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.28;
        controls.update();

        let resumeTimer;
        controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimer); });
        controls.addEventListener('end',  () => { resumeTimer = setTimeout(() => (controls.autoRotate = true), 3500); });

        // ── Helpers ──
        // Physically-based default: diffuse-heavy but reacts to light direction
        // with proper specular falloff, so surfaces read as real materials.
        const lm = (hex, emHex = 0, ei = 0, rough = 0.88, metal = 0.0) => {
            const m = new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal });
            if (emHex) { m.emissive.setHex(emHex); m.emissiveIntensity = ei; }
            return m;
        };
        const box = (w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) => {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            addTarget.add(mesh);
            return mesh;
        };

        // ── Procedural surface textures ──
        const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
        const asTex = (cv, rx = 1, ry = 1, srgb = true) => {
            const t = new THREE.CanvasTexture(cv);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(rx, ry);
            t.anisotropy = MAX_ANISO;
            if (srgb) t.colorSpace = THREE.SRGBColorSpace;
            return t;
        };
        const speckle = (g, w, h, n, aMax, light, dark) => {
            for (let i = 0; i < n; i++) {
                g.globalAlpha = Math.random() * aMax;
                g.fillStyle = Math.random() < 0.5 ? light : dark;
                g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 1.6, 1 + Math.random() * 1.6);
            }

        };

        // Wood grain: wavering streaks, knots, pore noise → { map, bump }
        const woodTex = (base, streak, dark, knots = 3) => {
            const cv = mkCanvas(512, 512), g = cv.getContext('2d');
            const bcv = mkCanvas(512, 512), bg = bcv.getContext('2d');
            g.fillStyle = base; g.fillRect(0, 0, 512, 512);
            bg.fillStyle = '#808080'; bg.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 110; i++) {
                const y0 = Math.random() * 512, amp = 2 + Math.random() * 7, per = 90 + Math.random() * 220;
                const lw = 0.5 + Math.random() * 1.8, a = 0.05 + Math.random() * 0.15, ph = Math.random() * 7;
                g.strokeStyle = Math.random() < 0.6 ? streak : dark;
                g.globalAlpha = a; g.lineWidth = lw;
                bg.strokeStyle = Math.random() < 0.5 ? '#6a6a6a' : '#959595';
                bg.globalAlpha = Math.min(1, a * 1.7); bg.lineWidth = lw;
                g.beginPath(); bg.beginPath();
                for (let x = 0; x <= 512; x += 8) {
                    const y = y0 + Math.sin((x / per) * Math.PI * 2 + ph) * amp;
                    if (x === 0) { g.moveTo(x, y); bg.moveTo(x, y); }
                    else { g.lineTo(x, y); bg.lineTo(x, y); }
                }
                g.stroke(); bg.stroke();
            }
            g.globalAlpha = 1; bg.globalAlpha = 1;
            for (let i = 0; i < knots; i++) {
                const kx = 60 + Math.random() * 392, ky = 60 + Math.random() * 392;
                for (let r = 16; r > 1.5; r -= 2.2) {
                    g.strokeStyle = dark; g.globalAlpha = 0.15; g.lineWidth = 1.4;
                    g.beginPath(); g.ellipse(kx, ky, r * 2.1, r, 0.15, 0, Math.PI * 2); g.stroke();
                    bg.strokeStyle = '#606060'; bg.globalAlpha = 0.2; bg.lineWidth = 1.4;
                    bg.beginPath(); bg.ellipse(kx, ky, r * 2.1, r, 0.15, 0, Math.PI * 2); bg.stroke();
                }
                g.globalAlpha = 1; bg.globalAlpha = 1;
            }
            speckle(g, 512, 512, 2600, 0.10, streak, dark);
            speckle(bg, 512, 512, 2600, 0.14, '#9a9a9a', '#666666');
            return { map: cv, bump: bcv };
        };

        // Hardwood planks: staggered boards, per-board tint, seams → { map, bump, rough }
        const plankTex = () => {
            const cv = mkCanvas(1024, 1024), g = cv.getContext('2d');
            const bcv = mkCanvas(1024, 1024), bg = bcv.getContext('2d');
            const rcv = mkCanvas(1024, 1024), rg = rcv.getContext('2d');
            const ROWS = 8, PH = 1024 / ROWS;
            for (let r = 0; r < ROWS; r++) {
                let x = -Math.random() * 300;
                while (x < 1024) {
                    const pw = 260 + Math.random() * 260;
                    const tint = 0.82 + Math.random() * 0.36;
                    const br = (68 * tint) | 0, bgr = (51 * tint) | 0, bb = (34 * tint) | 0;
                    g.fillStyle = `rgb(${br},${bgr},${bb})`;
                    g.fillRect(x, r * PH, pw, PH);
                    // grain streaks inside the board
                    for (let i = 0; i < 26; i++) {
                        const gy = r * PH + Math.random() * PH;
                        const ga = 0.05 + Math.random() * 0.14;
                        g.strokeStyle = Math.random() < 0.55 ? 'rgb(46,34,20)' : 'rgb(12,8,5)';
                        g.globalAlpha = ga; g.lineWidth = 0.6 + Math.random() * 1.6;
                        g.beginPath();
                        const amp = 1 + Math.random() * 3, per = 80 + Math.random() * 160, ph2 = Math.random() * 7;
                        for (let gx = x; gx <= Math.min(x + pw, 1024); gx += 10) {
                            const yy = gy + Math.sin((gx / per) * Math.PI * 2 + ph2) * amp;
                            gx === x ? g.moveTo(gx, yy) : g.lineTo(gx, yy);
                        }
                        g.stroke();
                    }
                    g.globalAlpha = 1;
                    // sheen variation per board (rougher = lighter in roughness map)
                    rg.fillStyle = `rgb(${150 + Math.random() * 60 | 0},0,0)`;
                    rg.fillRect(x, r * PH, pw, PH);
                    // board field on bump
                    bg.fillStyle = `rgb(${118 + Math.random() * 22 | 0},0,0)`;
                    bg.fillRect(x, r * PH, pw, PH);
                    // vertical end-seam
                    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(x + pw - 2, r * PH, 3, PH);
                    bg.fillStyle = 'rgb(30,0,0)'; bg.fillRect(x + pw - 2, r * PH, 3, PH);
                    x += pw;
                }
                // horizontal seam between rows
                g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, r * PH - 1.5, 1024, 3);
                bg.fillStyle = 'rgb(26,0,0)'; bg.fillRect(0, r * PH - 1.5, 1024, 3);
            }
            speckle(g, 1024, 1024, 5200, 0.08, 'rgb(52,40,26)', 'rgb(8,6,4)');
            // bump/rough are sampled on the red channel; keep them single-channel style
            return { map: cv, bump: bcv, rough: rcv };
        };

        // Painted plaster: mottled blotches + fine tooth → { map, bump }
        const plasterTex = (base = '#14141a', blotch = '#191922', deep = '#0e0e13') => {
            const cv = mkCanvas(512, 512), g = cv.getContext('2d');
            const bcv = mkCanvas(512, 512), bg = bcv.getContext('2d');
            g.fillStyle = base; g.fillRect(0, 0, 512, 512);
            bg.fillStyle = '#808080'; bg.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 42; i++) {
                const bx = Math.random() * 512, by = Math.random() * 512, br2 = 30 + Math.random() * 90;
                const gr = g.createRadialGradient(bx, by, 2, bx, by, br2);
                const col = Math.random() < 0.5 ? blotch : deep;
                gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
                g.globalAlpha = 0.16; g.fillStyle = gr;
                g.fillRect(bx - br2, by - br2, br2 * 2, br2 * 2);

            speckle(g, 512, 512, 3800, 0.09, '#23232c', '#0a0a0f');

            p.position.set(px, py + s * 0.75, pz);
            p.castShadow = true;
            addTarget.add(p);
            const st = new THREE.Mesh(new THREE.BoxGeometry(0.02, s * 0.5, 0.02), tlM.stem);
            st.position.set(px, py + s * 1.5, pz);
            st.rotation.z = 0.22;
            addTarget.add(st);
            if (carved) {
                const fm = lm(0x3a1400, 0xffb838, 1.8);
                tlFlames.push({ m: fm, ph: Math.random() * 9, base: 1.7, mesh: p });
                const fz = s * 0.88;
                [[-0.36, 0.16], [0.36, 0.16]].forEach(([ex, ey]) => {
                    const eye = new THREE.Mesh(new THREE.ConeGeometry(s * 0.18, s * 0.3, 3), fm);
                    eye.position.set(px + ex * s, py + s * (0.75 + ey), pz + fz);
                    addTarget.add(eye);
                });
                const mo = new THREE.Mesh(new THREE.BoxGeometry(s * 0.78, s * 0.14, 0.012), fm);
                mo.position.set(px, py + s * 0.5, pz + fz);
                addTarget.add(mo);
                [[-0.26, 1], [0.02, -1], [0.28, 1]].forEach(([tx, dr]) => {
                    const th = new THREE.Mesh(new THREE.BoxGeometry(s * 0.12, s * 0.12, 0.012), fm);
                    th.position.set(px + tx * s, py + s * (0.5 + dr * 0.11), pz + fz);
                    addTarget.add(th);
                });
            }
            return p;
        };
        const tlGrave = (gx, gz, ry) => {
            const lean = (Math.random() - 0.5) * 0.22;
            const round = Math.random() < 0.5;
            const slab = round
                ? new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.07, 10, 1, false, 0, Math.PI), tlM.stone)
                : new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.5, 0.07), tlM.stone);
            if (round) { slab.rotation.z = Math.PI / 2; slab.rotation.y = Math.PI / 2; }
            slab.position.set(gx, round ? 0.42 : 0.3, gz);
            slab.rotation.x = lean;
            slab.castShadow = slab.receiveShadow = true;
            addTarget.add(slab);
            if (round) box(0.38, 0.34, 0.07, tlM.stone, gx, 0.19, gz, lean, 0, 0);
            box(0.46, 0.06, 0.16, tlM.stone, gx, 0.03, gz);          // base
            box(0.2, 0.03, 0.012, lm(0x5c5c58, 0, 0, 0.95), gx, 0.36, gz + 0.04, lean, 0, 0);  // "RIP"
            box(0.13, 0.03, 0.012, lm(0x5c5c58, 0, 0, 0.95), gx, 0.29, gz + 0.04, lean, 0, 0);
        };
        const tlSkeleton = (sx, sz, ry, pose) => {
            const g = new THREE.Group();
            g.position.set(sx, 0, sz);
            g.rotation.y = ry;
            addTarget.add(g);
            const sb = (w, h, d, x, y, z, rz = 0) => {
                const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), tlM.bone);
                m.position.set(x, y, z);
                m.rotation.z = rz;
                m.castShadow = true;
                g.add(m);
                return m;
            };
            const lift = pose === 'wave' ? 1 : 0;
            sb(0.24, 0.34, 0.14, 0, 1.06, 0);                   // ribcage
            for (let i = 0; i < 4; i++) {                        // rib shadow lines
                const rib = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.018, 0.005), tlM.dark);
                rib.position.set(0, 1.18 - i * 0.08, -0.072);
                g.add(rib);
            }
            sb(0.1, 0.16, 0.1, 0, 0.84, 0);                     // pelvis
            sb(0.07, 0.4, 0.07, -0.06, 0.6, 0);                 // legs
            sb(0.07, 0.4, 0.07, 0.06, 0.6, 0);
            sb(0.09, 0.06, 0.16, -0.06, 0.37, 0.03);            // feet
            sb(0.09, 0.06, 0.16, 0.06, 0.37, 0.03);
            sb(0.06, 0.34, 0.06, -0.17, 1.02, 0, lift ? -0.9 : -0.12);   // arms
            sb(0.06, 0.34, 0.06, 0.17, 1.02, 0, 0.12);
            const skull = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.2, 0.18), tlM.bone);
            skull.position.set(0, 1.36, 0);
            skull.castShadow = true;
            g.add(skull);
            [-0.045, 0.045].forEach(ex => {
                const socket = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.05, 0.02), tlM.dark);
                socket.position.set(ex, 1.38, -0.09);
                g.add(socket);
            });
            const jaw2 = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.03, 0.02), tlM.dark);
            jaw2.position.set(0, 1.28, -0.09);
            g.add(jaw2);
            return g;
        };
        const tlWeb = (wx, wy, wz, s, ry) => {
            const g = new THREE.Group();
            g.position.set(wx, wy, wz);
            g.rotation.y = ry;
            addTarget.add(g);
            for (let i = 0; i < 7; i++) {
                const a = (i / 7) * Math.PI * 0.5 + Math.PI;
                const sp = new THREE.Mesh(new THREE.BoxGeometry(s, 0.012, 0.012), tlM.web);
                sp.position.set(Math.cos(a) * s / 2, Math.sin(a) * s / 2, 0);
                sp.rotation.z = a;
                g.add(sp);
            }
            for (let r = 1; r <= 4; r++) {
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(s * 0.12 * r, 0.008, 4, 14, Math.PI * 0.5), tlM.web);
                ring.rotation.z = Math.PI;
                g.add(ring);
            }
            return g;
        };
        const tlSpider = (sx, sy, sz, s) => {
            const g = new THREE.Group();
            g.position.set(sx, sy, sz);
            addTarget.add(g);
            const body = new THREE.Mesh(new THREE.SphereGeometry(s, 9, 7), tlM.dark);
            body.scale.set(1, 0.8, 1.3);
            body.castShadow = true;
            g.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(s * 0.55, 8, 6), tlM.dark);
            head.position.z = -s * 1.3;
            g.add(head);
            [[-1, 0.5], [-1, 0], [-1, -0.5], [-1, -1], [1, 0.5], [1, 0], [1, -0.5], [1, -1]].forEach(([sd2, off]) => {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(s * 1.7, 0.035, 0.035), tlM.dark);
                leg.position.set(sd2 * s * 0.9, s * 0.1, off * s * 0.7);
                leg.rotation.z = sd2 * -0.5;
                leg.rotation.y = off * 0.35;
                g.add(leg);
            });
            [[-0.22], [0.22]].forEach(([ex]) => {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(s * 0.16, 6, 5), lm(0xd82020, 0xd82020, 1.6));
                eye.position.set(ex * s, s * 0.3, -s * 1.6);
                g.add(eye);
            });
            return g;
        };
        const tlGhost = (gx, gy, gz, s) => {
            const g = new THREE.Group();
            g.position.set(gx, gy, gz);
            addTarget.add(g);
            const hood = new THREE.Mesh(new THREE.SphereGeometry(s, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.6), tlM.sheet);
            hood.castShadow = true;
            g.add(hood);
            const drape = new THREE.Mesh(new THREE.ConeGeometry(s * 1.05, s * 2.1, 10, 1, true), tlM.sheet);
            drape.position.y = -s * 0.95;
            drape.rotation.x = Math.PI;
            drape.castShadow = true;
            g.add(drape);
            [[-0.35], [0.35]].forEach(([ex]) => {
                const eye = new THREE.Mesh(new THREE.BoxGeometry(s * 0.22, s * 0.3, 0.02), tlM.dark);
                eye.position.set(ex * s, -s * 0.1, -s * 0.85);
                g.add(eye);
            });
            return g;
        };
        const tlHayBale = (hx, hz, ry) => {
            const b = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.42, 10), tlM.hay);
            b.rotation.z = Math.PI / 2;
            b.rotation.y = ry;
            b.position.set(hx, 0.26, hz);
            b.castShadow = b.receiveShadow = true;
            addTarget.add(b);
            [-0.1, 0.1].forEach(o => box(0.44, 0.5, 0.03, lm(0x8a6a2a, 0, 0, 0.95), hx, 0.26, hz + o, 0, ry, 0));
        };
        const tlCornStalk = (cx, cz) => {
            const h = 1.1 + Math.random() * 0.4;
            box(0.05, h, 0.05, lm(0xa89050, 0, 0, 0.98), cx, h / 2, cz, 0, 0, (Math.random() - 0.5) * 0.12);
            for (let i = 0; i < 5; i++) {
                const lf = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.02, 0.09), lm(0x9a8a48, 0, 0, 0.98));
                lf.position.set(cx + (i % 2 ? 0.18 : -0.18), h * (0.35 + i * 0.13), cz);
                lf.rotation.z = (i % 2 ? -1 : 1) * 0.5;
                lf.rotation.y = i * 1.1;
                addTarget.add(lf);
            }
        };

        // ── The houses ──
        const tlHouse = (side, z, cfg) => {
            const x = side * TL.houseX;
            const g = new THREE.Group();
            g.position.set(x, 0, z);
            g.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;   // face the street
            addTarget.add(g);
            const W = cfg.w, D = 4.2, H = cfg.stories * 1.5;
            const sideMat = new THREE.MeshStandardMaterial({ map: sidingTex, color: cfg.siding, roughness: 0.9 });
            const hb = (w, h, d, m, px, py, pz, rx = 0, ry = 0, rz = 0) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
                mesh.position.set(px, py, pz);
                mesh.rotation.set(rx, ry, rz);
                mesh.castShadow = mesh.receiveShadow = true;
                g.add(mesh);
                return mesh;
            };
            // body + foundation
            hb(W, H, D, sideMat, 0, H / 2, 0);
            hb(W + 0.12, 0.34, D + 0.12, tlM.stone, 0, 0.17, 0);
            // gabled roof (two slabs + end triangles)
            const rp = Math.atan2(cfg.roofH, W / 2);
            const slope = Math.hypot(W / 2, cfg.roofH);
            [-1, 1].forEach(sd2 => {
                hb(slope, 0.11, D + 0.5, tlM.roof, sd2 * W / 4, H + cfg.roofH / 2, 0, 0, 0, -sd2 * rp);
            });
            [-1, 1].forEach(sd2 => {
                const tri = new THREE.Shape();
                tri.moveTo(-W / 2, 0); tri.lineTo(W / 2, 0); tri.lineTo(0, cfg.roofH);
                const gable = new THREE.Mesh(new THREE.ShapeGeometry(tri), sideMat);
                gable.position.set(0, H, sd2 * D / 2);
                if (sd2 < 0) gable.rotation.y = Math.PI;
                g.add(gable);
            });
            // porch: deck, posts, rail, shed roof
            const pD = 1.5;
            hb(W - 0.3, 0.14, pD, tlM.porch, 0, 0.4, D / 2 + pD / 2);
            for (let i = 0; i < 4; i++) {
                const px2 = -W / 2 + 0.3 + i * ((W - 0.6) / 3);
                hb(0.11, 1.85, 0.11, tlM.trim, px2, 1.4, D / 2 + pD - 0.12);
            }
            hb(W - 0.3, 0.1, pD + 0.24, tlM.roof, 0, 2.36, D / 2 + pD / 2, -0.12, 0, 0);
            hb(W - 0.5, 0.07, 0.06, tlM.trim, 0, 0.86, D / 2 + pD - 0.12);
            for (let i = 0; i < 9; i++)
                hb(0.035, 0.42, 0.035, tlM.trim, -W / 2 + 0.4 + i * ((W - 0.8) / 8), 0.65, D / 2 + pD - 0.12);
            [0, 1, 2].forEach(i => hb(1.0, 0.08, 0.3, tlM.stone, 0, 0.32 - i * 0.12, D / 2 + pD + 0.16 + i * 0.28));
            // door + porch light
            hb(0.72, 1.24, 0.09, lm(cfg.door, 0, 0, 0.7), 0, 1.09, D / 2 + 0.02);
            hb(0.08, 0.08, 0.05, lm(0xd8c088, 0, 0, 0.5), 0.24, 1.05, D / 2 + 0.07);
            const pl = lm(0x443320, 0xffc070, 1.6);
            hb(0.12, 0.16, 0.12, pl, 0.62, 1.7, D / 2 + 0.06);
            tlFlames.push({ m: pl, ph: Math.random() * 9, base: 1.5 });
            // windows, lit warm on both floors
            const winMat = () => {
                const m = lm(0x2a2418, 0xffcf7a, 1.35);
                tlWindows.push({ m, ph: Math.random() * 9, base: 1.25 + Math.random() * 0.4 });
                return m;
            };
            const winAt = (wx, wy, front) => {
                const m = winMat();
                hb(0.62, 0.86, 0.06, tlM.trim, wx, wy, front ? D / 2 + 0.01 : -D / 2 - 0.01);
                hb(0.5, 0.74, 0.05, m, wx, wy, front ? D / 2 + 0.04 : -D / 2 - 0.04);
                hb(0.05, 0.74, 0.06, tlM.trim, wx, wy, front ? D / 2 + 0.06 : -D / 2 - 0.06);
                hb(0.5, 0.05, 0.06, tlM.trim, wx, wy, front ? D / 2 + 0.06 : -D / 2 - 0.06);
            };
            winAt(-W / 2 + 0.75, 1.15, true);
            winAt(W / 2 - 0.75, 1.15, true);
            for (let i = 0; i < 3; i++) winAt(-W / 2 + 0.8 + i * ((W - 1.6) / 2), H - 0.7, true);
            // side windows
            [-1, 1].forEach(sd2 => {
                const m = winMat();
                hb(0.05, 0.74, 0.5, m, sd2 * (W / 2 + 0.03), 1.2, -0.8);
                hb(0.06, 0.86, 0.62, tlM.trim, sd2 * (W / 2 + 0.01), 1.2, -0.8);
            });
            // chimney + optional dormer
            hb(0.5, cfg.roofH + 1.1, 0.5, tlM.brick, W / 2 - 0.7, H + (cfg.roofH + 1.1) / 2 - 0.2, -0.9);
            if (cfg.dormer) {
                hb(0.9, 0.7, 0.9, sideMat, 0, H + cfg.roofH * 0.42, D / 2 - 0.75);
                hb(1.05, 0.09, 1.0, tlM.roof, 0, H + cfg.roofH * 0.42 + 0.38, D / 2 - 0.75);
                const dm = winMat();
                hb(0.42, 0.42, 0.05, dm, 0, H + cfg.roofH * 0.42, D / 2 - 0.31);
            }
            // orange string lights along the porch roof edge
            for (let i = 0; i < 11; i++) {
                const om = lm(0x3a1a00, 0xff7418, 1.6);
                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 5), om);
                bulb.position.set(-W / 2 + 0.25 + i * ((W - 0.5) / 10),
                    2.3 - Math.sin((i / 10) * Math.PI) * 0.12, D / 2 + pD + 0.1);
                g.add(bulb);
                tlOrange.push({ m: om, ph: i * 0.6 });
            }
            return { g, W, D, pD };
        };

        // ── Ten houses, five a side ──
        const tlPalette = [
            { siding: 0xb8ada0, door: 0x7a2418, roofH: 1.5, w: 5.0, stories: 2, dormer: true },
            { siding: 0x8fa4a8, door: 0x2a3a5a, roofH: 1.3, w: 4.4, stories: 2, dormer: false },
            { siding: 0xc9bda6, door: 0x3a5a3a, roofH: 1.6, w: 5.4, stories: 2, dormer: true },
            { siding: 0x9a8f9c, door: 0x5a2a4a, roofH: 1.35, w: 4.6, stories: 2, dormer: false },
            { siding: 0xa8b09a, door: 0x6a4418, roofH: 1.45, w: 4.8, stories: 2, dormer: true },
        ];
        const tlStyles = ['graveyard', 'spiders', 'witch', 'classic', 'inflatable'];
        const tlSway = [];      // inflatables that breathe
        const tlHang = [];      // ghosts hanging from trees
        const tlCauldrons = [];

        [-1, 1].forEach((side, si) => {
            for (let i = 0; i < 5; i++) {
                const z = -TL.span * 2 + i * TL.span;
                const cfg = tlPalette[(i + si * 2) % 5];
                const h = tlHouse(side, z, cfg);
                const style = tlStyles[(i + si * 3) % 5];
                // yard coordinate helpers (world space)
                const yx = (t2) => side * (TL.lawn - t2);        // t2: distance in from lawn edge
                const front = side * (TL.houseX - (4.2 / 2 + 1.5));  // porch front edge

                for (let k = 0; k < 6; k++) {

                if (i !== 2) {
                    const tx2 = yx(3.4), tz2 = z + (i % 2 ? 2.1 : -2.2);
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 3.0, 7), tlM.bark);
                    trunk.position.set(tx2, 1.5, tz2);
                    trunk.castShadow = trunk.receiveShadow = true;
                    addTarget.add(trunk);
                    for (let b2 = 0; b2 < 5; b2++) {
                        const a2 = (b2 / 5) * Math.PI * 2;
                        const br = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 1.5, 5), tlM.bark);
                        br.position.set(tx2 + Math.sin(a2) * 0.5, 2.9 + (b2 % 2) * 0.35, tz2 + Math.cos(a2) * 0.5);

                    }
                }
                // mailbox + a pumpkin or two on the steps
                box(0.07, 0.9, 0.07, tlM.bark, side * (TL.curb + 0.55), 0.45, z - 1.5);
                box(0.16, 0.2, 0.34, tlM.dark, side * (TL.curb + 0.55), 1.0, z - 1.5);
                tlPumpkin(front + side * 0.3, 0.42, z - 0.55, 0.17, true);
                tlPumpkin(front + side * 0.3, 0.42, z + 0.55, 0.14, Math.random() < 0.6);

                // ── per-house decoration style ──
                if (style === 'graveyard') {
                    for (let k = 0; k < 7; k++) {
                        tlGrave(yx(0.6 + Math.random() * 3.0), z - 2.2 + Math.random() * 4.4, Math.random());
                    }
                    tlSkeleton(yx(1.6), z - 1.4, side > 0 ? -1.4 : 1.4, 'wave');
                    tlSkeleton(yx(2.8), z + 1.6, side > 0 ? -1.9 : 1.9, 'stand');
                    for (let k = 0; k < 9; k++) {   // wrought-iron fence
                        box(0.05, 0.62, 0.05, tlM.dark, yx(3.6), 0.31, z - 2.6 + k * 0.65);
                    }
                    box(0.05, 0.05, 5.4, tlM.dark, yx(3.6), 0.58, z);
                } else if (style === 'spiders') {
                    tlWeb(front + side * 0.05, 2.05, z - 1.7, 1.5, side > 0 ? -Math.PI / 2 : Math.PI / 2);

                    const sp2 = tlSpider(yx(2.4), 1.5, z, 0.42);
                    tlSway.push({ g: sp2, y0: 1.5, ph: Math.random() * 9, amp: 0.18 });
                    for (let k = 0; k < 5; k++) {
                        const sm = tlSpider(yx(0.9 + Math.random() * 2.7), 0.14, z - 2 + Math.random() * 4, 0.12);
                        sm.rotation.y = Math.random() * 3;
                    }
                } else if (style === 'witch') {
                    const cx9 = yx(2.2), cz9 = z + 0.4;
                    const pot = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 9), tlM.dark);
                    pot.scale.y = 0.8;
                    pot.position.set(cx9, 0.4, cz9);
                    pot.castShadow = true;
                    addTarget.add(pot);
                    const brew2 = new THREE.Mesh(new THREE.CircleGeometry(0.29, 16), lm(0x2a4a14, 0x52c832, 1.0));
                    brew2.rotation.x = -Math.PI / 2;
                    brew2.position.set(cx9, 0.63, cz9);
                    addTarget.add(brew2);
                    const cl2 = new THREE.PointLight(0x52c832, 1.6, 5);
                    cl2.position.set(cx9, 1.0, cz9);
                    addTarget.add(cl2);
                    tlCauldrons.push({ l: cl2, m: brew2.material, ph: Math.random() * 9, pot });
                    for (let k = 0; k < 3; k++) {   // logs under the pot
                        box(0.5, 0.07, 0.07, tlM.bark, cx9, 0.06, cz9, 0, k * 1.0, 0);
                    }
                    // the witch herself
                    const wg = new THREE.Group();
                    wg.position.set(yx(3.3), 0, z - 1.2);
                    wg.rotation.y = side > 0 ? -1.7 : 1.7;
                    addTarget.add(wg);
                    const robe = new THREE.Mesh(new THREE.ConeGeometry(0.34, 1.25, 9), lm(0x1e1826, 0, 0, 0.95));
                    robe.position.y = 0.62;
                    robe.castShadow = true;
                    wg.add(robe);
                    const wh = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), lm(0x8ab04a, 0, 0, 0.9));
                    wh.position.y = 1.36;
                    wg.add(wh);
                    const hat = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.55, 9), lm(0x1e1826, 0, 0, 0.95));
                    hat.position.y = 1.72;
                    hat.castShadow = true;
                    wg.add(hat);
                    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.03, 10), lm(0x1e1826, 0, 0, 0.95));
                    brim.position.y = 1.46;
                    wg.add(brim);
                    for (let k = 0; k < 4; k++) tlGrave(yx(1.0 + k * 0.9), z + 2.4, 0);
                } else if (style === 'classic') {
                    for (let k = 0; k < 8; k++)
                        tlPumpkin(yx(0.7 + Math.random() * 2.9), 0, z - 2.4 + Math.random() * 4.8,
                            0.14 + Math.random() * 0.13, Math.random() < 0.5);

                const u = Math.hypot(x - cx, z - cz) / cr;
                if (u < 2.2) {
                    if (u < 1) h -= cd * (1 - u * u) * 0.9;                  // bowl
                    h += cd * 0.5 * Math.exp(-Math.pow((u - 1) * 2.6, 2));   // raised rim

        const interactRecords = [];

        const addInteract = (objOrArray, opts) => {
            const roots = Array.isArray(objOrArray) ? objOrArray : [objOrArray];
            const meshes = [];
            roots.forEach(o => o.traverse(c => { if (c.isMesh) meshes.push(c); }));
            const box3 = new THREE.Box3();
            meshes.forEach(m => box3.expandByObject(m));
            const sphere = box3.isEmpty() ? { radius: 0.14 } : box3.getBoundingSphere(new THREE.Sphere());
            const rec = {
                meshes, theme: opts.theme || 'global', onClick: opts.onClick,
                radius: Math.max(0.14, sphere.radius),
                followObj: opts.followObj || roots[0],
            };
            interactRecords.push(rec);
            meshes.forEach(m => interactMeshMap.set(m, rec));
            return rec;
        };
        const activeEffects = [];
        const addEffect = fn => activeEffects.push(fn);

        let downX = 0, downY = 0;
        let hoverRec = null;
        const pickInteract = (clientX, clientY) => {
            pointerV.set((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(pointerV, camera);
            const candidates = [];
            for (const rec of interactRecords) {
                if (rec.theme === 'global' || rec.theme === theme) candidates.push(...rec.meshes);
            }
            const hits = raycaster.intersectObjects(candidates, false);
            return hits.length ? { rec: interactMeshMap.get(hits[0].object), point: hits[0].point } : null;
        };
        renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
        renderer.domElement.addEventListener('pointermove', e => {
            if (monZoom || lapZoom || e.buttons !== 0) return;
            const hit = pickInteract(e.clientX, e.clientY);
            const rec = hit ? hit.rec : null;
            if (rec !== hoverRec) {
                hoverRec = rec;
                renderer.domElement.style.cursor = rec ? 'pointer' : '';
            }
        });
        renderer.domElement.addEventListener('pointerup', e => {

            } else if (ds.mode === 'inBed') {
                moveTarget = null;

                    ds.mode = 'walking';
                    ds.modeStart = t;
                    ds.wpIndex = 0;

            } else if (ds.mode === 'sniffing') {

            } else if (ds.mode === 'howling') {

                    ds.mode = 'walking';
                    ds.modeStart = t;

            } else if (ds.mode === 'zoomies') {
                moveTarget = null;
                if (t > ds.zoomUntil) {
                    ds.mode = 'walking';
                    ds.modeStart = t;
                } else {
                    const zr = 0.8, zSpeed = 2.4;
                    ds.zoomAngle += ds.zoomDir * dt * (zSpeed / zr);

                    const nz = ds.zoomCenter[1] + Math.cos(ds.zoomAngle) * zr;

                    hearts[i].position.set(
                        dogGroup.position.x + Math.sin(i * 2.4 + pe) * 0.13,
                        dogGroup.position.y + 0.34 + hp * 0.45,
                        dogGroup.position.z + Math.cos(i * 1.7) * 0.10);
                    hearts[i].material.opacity = (1 - hp) * 0.9;
                }
            } else if (hearts[0].visible) {
                hearts.forEach(h => h.visible = false);
            }

            // Name tag hovers over Clark for 15s after a click, then fades
            if (t < labelUntil) {
                clarkTag.visible = true;
                clarkTag.position.set(dogGroup.position.x, dogGroup.position.y + 0.52, dogGroup.position.z);

                clarkTag.material.opacity = Math.min(1, remain / 2.5);

                clarkTag.visible = false;
            }

            // Zero-g: dog floats and gently tumbles in spaceship
            if (theme === 'spaceship') {
                dogGroup.position.y += 0.14 + Math.sin(t * 0.28) * 0.04;
                dogGroup.rotation.z = Math.sin(t * 0.16) * 0.13;
                dogGroup.rotation.x = Math.sin(t * 0.11) * 0.06;
            } else {
                if (ds.mode !== 'roll' && ds.mode !== 'shake') dogGroup.rotation.z = 0;   // roll/shake own this axis while active
                dogGroup.rotation.x = 0;   // otherwise only zero-g ever touches this axis, and it must not linger
            }

            tintColor.copy(coolMon).lerp(warmMon, c);

            if (theme === 'room') {
                scene.background.setHex(0x030306);
                scene.fog.color.setHex(0x030306);
                scene.fog.density = 0.07;

                hemiLight.intensity = BASE.hemi * b;
                hemiLight.color.copy(coolSky).lerp(warmSky, c);
                hemiLight.groundColor.copy(coolGround).lerp(warmGround, c);

                // Directional fill — broad even illumination, color-shifted
                fillLight.intensity = BASE.fill * b;
                fillLight.color.copy(coolFill).lerp(warmFill, c);

                if (soundOn && audioCtx && t > rmNextSiren) {

            } else if (theme === 'forest') {
                // ── Forest day/night cycle (time slider: 0 night → 1 noon) ──
                const td = params.time;
                if (td < 0.5) skyCol.copy(skyNight).lerp(skyDusk, td * 2);
                else skyCol.copy(skyDusk).lerp(skyDay, (td - 0.5) * 2);
                scene.background.copy(skyCol);
                scene.fog.color.copy(skyCol).multiplyScalar(0.92);
                scene.fog.density = 0.028 + (1 - td) * 0.018;

                hemiLight.color.copy(skyCol);
                hemiLight.groundColor.copy(grNight).lerp(grDay, td);
                fillLight.intensity = 0.4 * b;
                fillLight.color.copy(skyCol);

                // Sun climbs from the horizon to overhead

                const sy = Math.sin(el), sc = Math.cos(el);

                forestSun.intensity = Math.max(0, td - 0.07) * 5.5 * b;
                forestSun.color.copy(sunWarm).lerp(sunNoon, Math.min(1, td * 1.4));
                sunDisc.position.set(-sc * 10.5, sy * 11 + 0.3, -5.2);

                moonDisc.material.opacity = THREE.MathUtils.clamp((0.5 - td) * 3.2, 0, 1);
                moonDisc.lookAt(camera.position);
                forestMoonLight.intensity = Math.max(0, 0.5 - td) * 3.6 * b;
                starMat.opacity = THREE.MathUtils.clamp((0.45 - td) * 2.6, 0, 1);

                // Fireflies wander once the light fades
                ffMat.opacity = THREE.MathUtils.clamp((0.4 - td) * 3, 0, 1) * (0.7 + Math.sin(t * 3.1) * 0.3);
                if (ffMat.opacity > 0.01) {
                    const fp = fireflies.geometry.attributes.position.array;
                    for (let i = 0; i < FF_N; i++) {
                        const s = ffSeed[i*4+3];
                        fp[i*3]   = ffSeed[i*4]   + Math.sin(t * 0.35 + s) * 0.5;
                        fp[i*3+1] = ffSeed[i*4+1] + Math.sin(t * 0.8 + s * 2) * 0.18;
                        fp[i*3+2] = ffSeed[i*4+2] + Math.cos(t * 0.3 + s) * 0.5;

                }

                // Campfire — flicker scaled by the campfire slider
                const fb = params.lampBrightness;
                const fFlick = Math.sin(t * 11) * 0.18 + Math.sin(t * 23.7) * 0.12 + Math.sin(t * 5.3) * 0.10;
                fireLight.intensity = Math.max(0, (1.6 + fFlick) * fb * 2.2);
                for (let i = 0; i < flames.length; i++) {
                    const f = flames[i];
                    const sFl = fb < 0.05 ? 0.001 : 0.75 + Math.sin(t * 9 + i * 2.4) * 0.18 + fb * 0.25;
                    f.scale.set(sFl, sFl * (1 + Math.sin(t * 13 + i) * 0.12), sFl);
                    f.position.y = f.userData.baseY * f.scale.y;
                    f.rotation.y = t * (1.2 + i * 0.5);

                ember.material.color.setHSL(0.03, 1.0, 0.10 + 0.14 * Math.min(fb, 1.5) + Math.sin(t * 7) * 0.03);

                // ── Seasons (season slider: spring 0 → summer .33 → autumn .66 → winter 1) ──
                const sv = params.season;
                const seasonW = center => Math.max(0, 1 - Math.abs(sv - center) / (1 / 3));
                const wSpring = seasonW(0), wSummer = seasonW(1 / 3), wAutumn = seasonW(2 / 3), wWinter = seasonW(1);
                const { spring: gSp, summer: gSu, autumn: gAu, winter: gWi } = seasonGroundCols;
                forestGround.material.color.setRGB(
                    gSp.r * wSpring + gSu.r * wSummer + gAu.r * wAutumn + gWi.r * wWinter,
                    gSp.g * wSpring + gSu.g * wSummer + gAu.g * wAutumn + gWi.g * wWinter,
                    gSp.b * wSpring + gSu.b * wSummer + gAu.b * wAutumn + gWi.b * wWinter,
                );
                for (const bl of seasonBlossoms) {
                    bl.visible = wSpring > 0.02;
                    bl.scale.setScalar(wSpring);
                }
                for (const cap2 of seasonSnowCaps) {
                    cap2.visible = wWinter > 0.02;
                    cap2.scale.setScalar(wWinter);
                }
                for (const leaf of leafLitter) {
                    leaf.visible = wAutumn > 0.02;
                    leaf.scale.setScalar(wAutumn);
                }
                // Falling leaves in autumn, snow in winter — one shared system
                fallMat.opacity = Math.max(wAutumn, wWinter) * 0.7;
                fallMat.color.copy(leafFallCol).lerp(snowFallCol, wWinter / Math.max(0.001, wAutumn + wWinter));
                const fallSpeed = 0.35 + wWinter * 0.15;
                const driftAmt = 0.35 * wAutumn + 0.06 * wWinter;
                const fp3 = fallGeo.attributes.position.array;
                for (let i = 0; i < FALL_N; i++) {
                    const seed = fallSeed[i*4+3];
                    fp3[i*3]   = fallSeed[i*4]   + Math.sin(t * 0.6 + seed * 9) * driftAmt;
                    fp3[i*3+1] = ((fallSeed[i*4+1] - t * fallSpeed) % 3.6 + 3.6) % 3.6;
                    fp3[i*3+2] = fallSeed[i*4+2] + Math.cos(t * 0.5 + seed * 7) * driftAmt;
                }
                fallGeo.attributes.position.needsUpdate = true;

                // Songbirds by day, an owl once the sky goes dark
                if (soundOn && audioCtx) {
                    if (td > 0.4 && t > fsNextChirp) {
                        fsNextChirp = t + 3 + Math.random() * 6;
                        chirp();
                    }
                    if (td < 0.35 && t > fsNextOwl) {
                        fsNextOwl = t + 12 + Math.random() * 14;
                        owl();
                    }
                }
            } else if (theme === 'northPole') {
                // ── North Pole: deep polar night with aurora borealis ──
                const auroraStr = params.time;
                npSkyColor.copy(npSkyDeep).lerp(npSkyGlow, auroraStr * 0.45);
                scene.background.copy(npSkyColor);
                scene.fog.color.copy(npSkyColor);
                scene.fog.density = 0.018;

                // Cold arctic ambient — snow bounce gives a brighter ground fill
                hemiLight.intensity = 2.2 * b;
                hemiLight.color.setHex(0x334488);
                hemiLight.groundColor.setHex(0x8899bb);
                fillLight.intensity = 1.3 * b;
                fillLight.color.setHex(0x4466aa);

                // Aurora curtains — scroll downward, breathe, gently sway
                for (let ri = 0; ri < auroraRibbons.length; ri++) {
                    const rb = auroraRibbons[ri];
                    const wave  = Math.sin(t * 0.55 + rb.userData.phase) * 0.5 + 0.5;
                    const waveB = Math.sin(t * 0.28 + rb.userData.phase * 1.3) * 0.5 + 0.5;
                    rb.material.opacity = auroraStr * (0.55 + wave * 0.45);
                    // Scroll texture downward — gives the illusion of curtain falling/shimmering
                    rb.userData.uvOff = (rb.userData.uvOff + dt * (0.022 + waveB * 0.028)) % 1;
                    rb.material.map.offset.y = -rb.userData.uvOff;
                    // Slow vertical breathing + gentle yaw sway
                    rb.position.y = rb.userData.baseY + Math.sin(t * 0.18 + rb.userData.phase) * 0.45;

                // Aurora sky lights pulse with the curtains — illuminate dome from above
                const aPhA = Math.sin(t * 0.40) * 0.5 + 0.5;

                const aPhC = Math.sin(t * 0.50 + 2.5) * 0.5 + 0.5;
                npAuroraLightA.intensity = auroraStr * (0.9 + aPhA * 1.6) * b;
                npAuroraLightB.intensity = auroraStr * (0.6 + aPhB * 1.2) * b;
                npAuroraLightC.intensity = auroraStr * (0.5 + aPhC * 0.9) * b;
                npAuroraLightA.color.setHSL(0.37 + aPhA * 0.10, 1.0, 0.5);
                npAuroraLightB.color.setHSL(0.50 + aPhB * 0.28, 1.0, 0.5);
                npAuroraLightC.color.setHSL(0.78 + Math.sin(t * 0.22) * 0.08, 1.0, 0.5);

                // Glass dome picks up the aurora color in its emissive tint
                const domeHue = 0.37 + Math.sin(t * 0.35) * 0.10;

                npDomeInner.material.emissive.setHSL(domeHue, 0.85, domeEmStr * 0.6);

                npMoonDisc.lookAt(camera.position);
                npMoonLight.intensity = 1.8 * b;

                // Lantern — gentle slow flicker
                const nplb = params.lampBrightness;
                const nlFlick = Math.sin(t * 8.7) * 0.09 + Math.sin(t * 19.1) * 0.055;
                npLanternLight.intensity = Math.max(0, (0.85 + nlFlick) * nplb * 2.6);
                npLanternGlowMesh.material.color.setHSL(0.13, 0.90, 0.54 + nlFlick * 0.12);

                const sfp = snowfallPoints.geometry.attributes.position.array;
                for (let i = 0; i < SNOW_N; i++) {
                    const ph = (snowfallPhase[i] + t * 0.042) % 1;
                    sfp[i*3]   = snowfallBase[i*2]   + Math.sin(t * 0.11 + i * 1.05) * 0.28;
                    sfp[i*3+1] = 5.8 * (1.0 - ph);
                    sfp[i*3+2] = snowfallBase[i*2+1] + Math.cos(t * 0.09 + i * 0.73) * 0.22;
                }
                snowfallPoints.geometry.attributes.position.needsUpdate = true;

                // Sleigh bells jingle faintly somewhere near the workshop
                if (soundOn && audioCtx && t > npNextBells) {
                    npNextBells = t + 16 + Math.random() * 18;
                    bells();
                }
            } else if (theme === 'spaceship') {
                // ── Spaceship: orbital module, clean white cabin light ──
                scene.background.setHex(0x000208);
                scene.fog.color.setHex(0x05070c);
                scene.fog.density = 0.030;

                // Even white LED cabin lighting with a soft cool bounce
                hemiLight.intensity = 3.4 * b;
                hemiLight.color.setHex(0xe8ecf4);
                hemiLight.groundColor.setHex(0x6e7278);
                fillLight.intensity = 1.7 * b;
                fillLight.color.setHex(0xf4f6fa);
                spCockpitLight.intensity = 2.4 * b;

                // Engine thruster glow (lamp slider = "thrusters")
                const thrStr = params.lampBrightness;
                const thrFlick = Math.sin(t*11.3)*0.10 + Math.sin(t*23.7)*0.06 + Math.sin(t*7.1)*0.08;
                spEngineLight.intensity  = Math.max(0, (1.4 + thrFlick) * thrStr * 1.8) * b;
                spEngineLight2.intensity = Math.max(0, (1.1 + thrFlick*0.8) * thrStr * 1.2) * b;
                // Pulse thruster mesh color
                const thrBright = 0.4 + thrStr * 0.6 + thrFlick * 0.2;
                spThrusterMesh.material.color.setHSL(0.06, 1.0, Math.min(0.65, thrBright));
                spThrusterMesh2.material.color.setHSL(0.62, 1.0, Math.min(0.60, thrBright*0.9));

                // Emergency strips slow pulse
                const pulse = Math.sin(t * 1.5) * 0.5 + 0.5;
                spAlertMat.emissiveIntensity = 0.15 + pulse * 0.60;

                // Status LEDs blink at individual rates
                for (const led of spStatusLEDs) {
                    led.material.emissiveIntensity = (Math.sin(t * led.userData.blinkRate) > 0) ? 1.4 : 0.12;
                }

                // Zero-g floating objects bob and slowly tumble
                for (const grp of spFloatItems) {
                    const ph = grp.userData.floatPhase;
                    grp.position.y = grp.userData.floatBase + Math.sin(t*0.32 + ph)*0.055;
                    grp.rotation.x = Math.sin(t*0.18 + ph*1.3)*0.14;
                    grp.rotation.z = Math.sin(t*0.24 + ph*0.8)*0.10;
                }

                // A soft electronic blip from the console now and then
                if (soundOn && audioCtx && t > spNextBeep) {
                    spNextBeep = t + 4 + Math.random() * 8;
                    beep();
                }
            } else if (theme === 'river') {
                // ── River day cycle (time slider: 0 misty dawn → 1 clear noon) ──
                const td = params.time;
                rSkyCol.copy(rSkyDawn).lerp(rSkyNoon, td);
                scene.background.copy(rSkyCol);
                scene.fog.color.copy(rSkyCol).multiplyScalar(0.96);
                scene.fog.density = 0.012 + (1 - td) * 0.024;

                hemiLight.intensity = (1.6 + td * 2.1) * b;
                hemiLight.color.copy(rSkyCol);
                hemiLight.groundColor.copy(rGrDawn).lerp(rGrNoon, td);
                fillLight.intensity = 0.7 * b;
                fillLight.color.copy(rSkyCol);

                // Sun climbs over the far bank behind the dam
                const el = 0.13 + td * 1.22;
                const sy = Math.sin(el), sc = Math.cos(el);
                riverSun.position.set(-sc * 8.5, sy * 10 + 0.4, -6.5);
                riverSun.intensity = (0.65 + td * 3.0) * b;
                riverSun.color.copy(rSunDawn).lerp(rSunNoon, Math.min(1, td * 1.35));
                riverSunDisc.position.set(-sc * 10.5, sy * 11.5 + 0.5, -8.5);
                riverSunDisc.material.opacity = 0.6 + (1 - td) * 0.35;
                riverSunDisc.lookAt(camera.position);

                // Current slides downstream; spillway churns
                rivTex.offset.y -= dt * 0.055;
                rapidsTex.offset.y -= dt * 0.55;
                rapids2Tex.offset.y -= dt * 0.3;
                resTex.offset.x += dt * 0.006;
                for (let i = 0; i < spillSheets.length; i++) {
                    spillSheets[i].material.map.offset.y -= dt * (1.0 + i * 0.09);
                    spillSheets[i].material.opacity = 0.8 + Math.sin(t * 7 + i * 2.1) * 0.08;
                }

                // Spray mist rises off the stilling basin, thicker at dawn
                const mp = mistPoints.geometry.attributes.position.array;
                for (let i = 0; i < MIST_N; i++) {
                    const ph = (mistBase[i * 3 + 2] + t * 0.16) % 1;
                    mp[i * 3]     = mistBase[i * 3] + Math.sin(t * 0.7 + i) * 0.12;
                    mp[i * 3 + 1] = 0.05 + ph * 1.5;
                    mp[i * 3 + 2] = mistBase[i * 3 + 1] + ph * 0.8 + Math.cos(t * 0.5 + i) * 0.08;

                mistMat.opacity = 0.16 + (1 - td) * 0.22;

                // Anglers: rods bob with the drift, an occasional recast flick,

                for (let i = 0; i < anglers.length; i++) {
                    const a = anglers[i];
                    const hk = (t + a.phase * 4.1) % 27;
                    if (hk < 2.6) {
                        a.rodGrp.rotation.x = a.baseRX + 0.5 + Math.sin(t * 16) * 0.07;
                    } else {
                        const bob = Math.sin(t * 1.25 + a.phase) * 0.045;
                        const cp = (t + a.phase * 2.3) % 12;
                        const flick = cp < 0.85 ? Math.sin((cp / 0.85) * Math.PI) * 0.55 : 0;
                        a.rodGrp.rotation.x = a.baseRX + bob + flick;
                    }
                    const rp = ((t * 0.6 + a.phase) % 1.9) / 1.9;
                    a.ring.scale.setScalar(0.4 + rp * 2.6);
                    a.ring.material.opacity = (1 - rp) * 0.45;

                // Salmon leap at the dam, wriggle, and splash back in
                const LEAP = 1.0;
                for (let i = 0; i < salmon.length; i++) {
                    const s = salmon[i];
                    const cyc = (t + s.phase) % s.period;
                    const cycleIdx = Math.floor((t + s.phase) / s.period);
                    const h1 = Math.abs(Math.sin(cycleIdx * 12.9898 + i * 78.233));
                    const lx = RIV.x0 + 0.7 + h1 * (RIV.x1 - RIV.x0 - 1.4);
                    const lz = RIV.damZ + 2.7 + Math.abs(Math.sin(cycleIdx * 3.7 + i)) * 1.7;
                    if (cyc < LEAP) {
                        const p = cyc / LEAP;
                        s.f.visible = true;
                        s.f.position.set(lx, RIV.water - 0.16 + Math.sin(p * Math.PI) * 1.05, lz - p * 0.55);
                        s.f.rotation.x = 0.95 - p * 2.0;      // nose-up out of the water, over, nose-down in
                        s.f.rotation.z = Math.sin(p * 17) * 0.14;   // mid-air wriggle
                    } else {

                        s.splash.position.set(lx, RIV.water + 0.018, lz - 0.55);
                        s.splash.scale.setScalar(0.4 + spT * 3.0);

                if (spook) {

                        if (st2 < 1) {

            } else if (theme === 'lighthouse') {

                for (let i = 0; i < sp3.count; i++) {

                seaTex.offset.x += dt * (0.02 + storm * 0.03);
                buoyGrp.position.y = SEA.level + swellH(-12.5, 3.5, t, storm);

                for (let i = 0; i < breakers.length; i++) {

                // Rain drives sideways in the gusts
                const rp3 = rainPoints.geometry.attributes.position.array;
                for (let i = 0; i < RAIN_N; i++) {
                    rp3[i * 3]     += dt * (2.2 + storm * 2.6);
                    rp3[i * 3 + 1] -= dt * (6.5 + storm * 4);

                        gl.cz + Math.sin(a) * gl.r * 0.7);
                    gl.g.rotation.y = -(a + Math.PI / 2 * gl.dir);
                    gl.g.rotation.z = gl.dir * 0.16 + Math.sin(t * 2 + gl.ph) * (0.08 + storm * 0.12);

                // The freighter plods across the horizon, riding the swell
                shipGrp.position.z = ((t * 0.10 + 10) % 34) - 17;

                // Foghorn sounds through the murk on a long interval
                if (soundOn && audioCtx && t > lhNextHorn) {

            } else if (theme === 'apiary') {
                // ── Apiary: golden morning → clear afternoon ──
                const td = params.time;
                apSkyCol.copy(apSkyMorn).lerp(apSkyNoon, td);
                scene.background.copy(apSkyCol);
                scene.fog.color.copy(apSkyCol).multiplyScalar(0.97);
                scene.fog.density = 0.008 + (1 - td) * 0.012;

                hemiLight.intensity = (1.9 + td * 1.7) * b;
                hemiLight.color.copy(apSkyCol);
                hemiLight.groundColor.copy(apGrMorn).lerp(apGrNoon, td);

                apSun.position.set(Math.cos(el) * 8, Math.sin(el) * 10 + 0.5, -3.5);

                apSun.color.setHex(td < 0.4 ? 0xffdca0 : 0xfff2d8);

                // Ambient bees loop between their flower and their hive door
                const bp2 = beePoints.geometry.attributes.position.array;
                for (let i = 0; i < BEE_N; i++) {
                    const bs = beeSeed[i];
                    const k = Math.sin(t * bs.sp + bs.ph) * 0.5 + 0.5;   // 0 flower ↔ 1 entrance
                    const wig = 0.10 + (1 - Math.abs(k - 0.5) * 2) * 0.5; // wander widest mid-flight
                    bp2[i * 3]     = bs.fl[0] + (bs.ent.x - bs.fl[0]) * k + Math.sin(t * 2.2 + bs.ph * 3) * wig;
                    bp2[i * 3 + 1] = bs.fl[1] + (bs.ent.y - bs.fl[1]) * k + 0.25 + Math.sin(t * 3.1 + bs.ph * 2) * wig * 0.5;
                    bp2[i * 3 + 2] = bs.fl[2] + (bs.ent.z - bs.fl[2]) * k + Math.cos(t * 1.9 + bs.ph) * wig;
                }
                beePoints.geometry.attributes.position.needsUpdate = true;

                // Hero bees: fly to a flower, LAND and sit, fly home, hover at

                const ss2 = (a2, b2, x2) => {

                    return u2 * u2 * (3 - 2 * u2);
                };
                for (let i = 0; i < heroBees.length; i++) {
                    const hb = heroBees[i];
                    const cyc2 = ((t * hb.sp * 3 + hb.ph) % 1 + 1) % 1;
                    let k, perched = false;
                    if (cyc2 < 0.30)      k = 1 - ss2(0, 0.30, cyc2);          // hive → flower
                    else if (cyc2 < 0.52) { k = 0; perched = true; }           // sitting on the bloom
                    else if (cyc2 < 0.82) k = ss2(0.52, 0.82, cyc2);           // flower → hive
                    else                  k = 1;                                // hovering at the door
                    const wig = perched ? 0 : (1 - Math.abs(k - 0.5) * 2) * 0.3;
                    const nx = hb.fl[0] + (hb.ent.x - hb.fl[0]) * k + Math.sin(t * 1.1 + hb.ph) * wig;
                    const ny = perched ? hb.fl[1] + 0.02
                        : hb.fl[1] + (hb.ent.y + 0.15 - hb.fl[1]) * k + 0.25 * (1 - Math.abs(k - 0.5) * 2) + (k === 1 ? Math.sin(t * 5 + hb.ph) * 0.04 : 0);
                    const nz = hb.fl[2] + (hb.ent.z - hb.fl[2]) * k + Math.cos(t * 0.9 + hb.ph) * wig;
                    if (!perched) hb.g.rotation.y = Math.atan2(nx - hb.g.position.x, nz - hb.g.position.z) + Math.PI;
                    hb.g.position.set(nx, ny, nz);
                    const flap = perched ? 0 : Math.sin(t * 46 + hb.ph) * 0.9;
                    hb.wL.rotation.z = perched ? 0.15 : 0.3 + flap;
                    hb.wR.rotation.z = perched ? -0.15 : -0.3 - flap;
                }

                // The bear shifts its weight and sniffs toward the hives
                bear.rotation.z = Math.sin(t * 0.4) * 0.02;
                bearHead.rotation.y = Math.sin(t * 0.27) * 0.35;
                bearHead.rotation.x = -0.1 + Math.max(0, Math.sin(t * 0.9)) * 0.12;   // nose lifts, scenting

                // Clark clocks any bee buzzing too close — tracks it, then snaps
                if (dogState.mode !== 'inBed') {
                    let nearBee = null, nearD = 0.9;
                    for (const hb of heroBees) {
                        const d2 = Math.hypot(hb.g.position.x - dogGroup.position.x, hb.g.position.z - dogGroup.position.z);
                        if (d2 < nearD) { nearD = d2; nearBee = hb; }
                    }
                    if (nearBee) {
                        const ldx = nearBee.g.position.x - dogGroup.position.x;
                        const ldz = nearBee.g.position.z - dogGroup.position.z;
                        let yaw2 = Math.atan2(ldx, ldz) - dogState.facing;
                        while (yaw2 > Math.PI) yaw2 -= 2 * Math.PI;
                        while (yaw2 < -Math.PI) yaw2 += 2 * Math.PI;

                            -Math.atan2(nearBee.g.position.y - 0.30, Math.max(0.1, nearD)), -0.7, 0.6);
                        const snapC = (t * 1.4 + nearBee.ph) % 2.6;
                        if (snapC < 0.18) {   // the snap: quick lunge of the head

                            dogGroup.position.y += Math.sin((snapC / 0.18) * Math.PI) * 0.03;

                        tail.rotation.y = Math.sin(t * 14) * 0.4;   // very interested

                // Smoker puffs drift from the spout (smoker slider)
                smoker.getWorldPosition(smokerWorld);
                const smk = params.lampBrightness;
                const smp = smokePoints.geometry.attributes.position.array;
                for (let i = 0; i < SMOKE_N; i++) {

                    smp[i * 3 + 1] = smokerWorld.y + 0.08 + ph * (0.7 + smk * 0.5);

                }

            } else if (theme === 'tavern') {
                // ── Tavern: firelit dark, everything breathes with the hearth ──
