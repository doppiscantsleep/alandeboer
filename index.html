<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alandeboer.computer</title>
    <meta name="description" content="A tiny 3D world where Alan is always at his desk — visit the room, the woods, the north pole, a spaceship, or the river below the dam.">
    <meta name="theme-color" content="#0a0e1e">
    <meta property="og:title" content="alandeboer.computer">
    <meta property="og:description" content="A tiny 3D world where Alan is always at his desk — five worlds to wander, one beagle.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alandeboer.computer/">
    <meta property="og:image" content="https://alandeboer.computer/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://alandeboer.computer/og.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
        }
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            user-select: none;
            font-family: 'Quicksand', sans-serif;
        }
        #site-name {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(80, 110, 220, 0.45);
            font-weight: 300;
            font-size: 12px;
            letter-spacing: 7px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        #hint {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(80, 110, 220, 0.2);
            font-weight: 300;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        /* Cinematic vignette */
        #ui::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(0,0,0,0.42) 100%);
            pointer-events: none;
        }

        /* ── Lighting panel: frosted glass, one quiet instrument ── */
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: all;
            padding: 14px 18px 16px;
            background: rgba(9, 12, 26, 0.42);
            border: 1px solid rgba(125, 150, 255, 0.14);
            border-radius: 12px;
            backdrop-filter: blur(14px) saturate(1.25);
            -webkit-backdrop-filter: blur(14px) saturate(1.25);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }
        .panel-title {
            color: rgba(150, 175, 255, 0.42);
            font-weight: 300;
            font-size: 9px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            margin-bottom: 1px;
            cursor: default;
        }
        .ctrl-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ctrl-row label {
            color: rgba(155, 180, 255, 0.72);
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            width: 76px;
            text-align: left;
            flex-shrink: 0;
            cursor: default;
        }
        .ctrl-row input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 116px;
            height: 3px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .ctrl-row input[type="range"]:focus-visible {
            outline: 1px solid rgba(160, 185, 255, 0.7);
            outline-offset: 5px;
        }
        #brightness-slider {
            background: linear-gradient(to right, rgba(80,110,220,0.08), rgba(80,110,220,0.5));
        }
        #color-slider {
            background: linear-gradient(to right, #0e1e55, #1a3aaa, #aac0ff, #ee8833);
        }
        #lamp-slider {
            background: linear-gradient(to right, rgba(180,90,20,0.1), rgba(255,150,50,0.6));
        }
        #lamp-color-slider {
            background: linear-gradient(to right, #2a0e00, #cc5500, #ffeedd, #aabbff);
        }
        #time-slider {
            background: linear-gradient(to right, #0a1230, #28406e, #d08a4a, #aee0ff);
        }
        .ctrl-row.hidden { display: none; }

        /* ── World picker: one chip per world, lit in that world's color ── */
        #worlds {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 4px;
            pointer-events: all;
            padding: 5px;
            background: rgba(9, 12, 26, 0.42);
            border: 1px solid rgba(125, 150, 255, 0.14);
            border-radius: 12px;
            backdrop-filter: blur(14px) saturate(1.25);
            -webkit-backdrop-filter: blur(14px) saturate(1.25);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }
        .world {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: rgba(150, 170, 230, 0.5);
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.2s, background 0.2s, border-color 0.2s;
        }
        .world .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--wc);
            box-shadow: 0 0 6px var(--wc);
            opacity: 0.45;
            transition: opacity 0.2s, box-shadow 0.2s;
        }
        .world:hover {
            color: rgba(205, 220, 255, 0.92);
            background: rgba(95, 120, 210, 0.10);
        }
        .world:focus-visible {
            outline: 1px solid rgba(160, 185, 255, 0.7);
            outline-offset: 2px;
        }
        .world.active {
            color: rgba(228, 236, 255, 0.95);
            background: color-mix(in srgb, var(--wc) 11%, transparent);
            border-color: color-mix(in srgb, var(--wc) 40%, transparent);
        }
        .world.active .dot {
            opacity: 1;
            box-shadow: 0 0 10px var(--wc), 0 0 2px rgba(255, 255, 255, 0.9);
        }
        .world[data-world="room"]      { --wc: #7d9bff; }
        .world[data-world="forest"]    { --wc: #6fd07a; }
        .world[data-world="northPole"] { --wc: #7ce8ff; }
        .world[data-world="spaceship"] { --wc: #ff8d5c; }
        .world[data-world="river"]     { --wc: #5fc0d8; }
        .world[data-world="lighthouse"] { --wc: #ffd27a; }

        .ctrl-sep {
            height: 1px;
            background: rgba(110, 140, 255, 0.12);
            margin: 2px 0;
        }

        /* ── Sound toggle: appears only at the river ── */
        #sound-btn {
            position: absolute;
            top: 74px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 7px;
            pointer-events: all;
            padding: 8px 13px;
            background: rgba(9, 12, 26, 0.42);
            border: 1px solid rgba(125, 150, 255, 0.14);
            border-radius: 10px;
            backdrop-filter: blur(14px) saturate(1.25);
            -webkit-backdrop-filter: blur(14px) saturate(1.25);
            color: rgba(150, 170, 230, 0.5);
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        #sound-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #5fc0d8;
            box-shadow: 0 0 6px #5fc0d8;
            opacity: 0.35;
            transition: opacity 0.2s;
        }
        #sound-btn:hover { color: rgba(205, 220, 255, 0.92); }
        #sound-btn:focus-visible {
            outline: 1px solid rgba(160, 185, 255, 0.7);
            outline-offset: 2px;
        }
        #sound-btn.on {
            color: rgba(228, 236, 255, 0.95);
            border-color: rgba(95, 192, 216, 0.4);
        }
        #sound-btn.on .dot { opacity: 1; }
        #sound-btn.hidden { display: none; }

        /* mid-width desktops: the six-chip bar would overlap the centered
           site name, so the name joins the hint at the bottom */
        @media (max-width: 1560px) and (min-width: 861px) {
            #site-name {
                top: auto;
                bottom: 46px;
                font-size: 10px;
                letter-spacing: 5px;
            }
        }
        @media (max-width: 860px) {
            #worlds {
                left: 12px;
                right: 12px;
                top: 12px;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
                gap: 3px;
            }
            .world { padding: 7px 6px; font-size: 9px; letter-spacing: 1px; gap: 5px; justify-content: center; }
            #controls {
                top: auto;
                bottom: 16px;
                left: 12px;
                padding: 11px 14px 13px;
                gap: 10px;
            }
            .ctrl-row input[type="range"] { width: 90px; }
            #site-name {
                top: auto;
                bottom: 20px;
                left: auto;
                right: 14px;
                transform: none;
                font-size: 9px;
                letter-spacing: 3px;
            }
            #sound-btn {
                top: auto;
                bottom: 48px;
                right: 12px;
            }
            #hint { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            #ui * { transition: none !important; }
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(205, 220, 255, 0.92);
            box-shadow: 0 0 7px rgba(140, 170, 255, 0.75), 0 0 0 3px rgba(140, 170, 255, 0.14);
            cursor: pointer;
            transition: box-shadow 0.15s, background 0.15s;
        }
        input[type="range"]:hover::-webkit-slider-thumb {
            background: #ffffff;
            box-shadow: 0 0 10px rgba(160, 190, 255, 0.95), 0 0 0 4px rgba(140, 170, 255, 0.22);
        }
        input[type="range"]::-moz-range-thumb {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(205, 220, 255, 0.92);
            box-shadow: 0 0 7px rgba(140, 170, 255, 0.75), 0 0 0 3px rgba(140, 170, 255, 0.14);
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="site-name">alandeboer.computer</div>
        <div id="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; pet clark &nbsp;·&nbsp; click the monitor</div>
        <div id="controls">
            <div class="panel-title">lighting</div>
            <div class="ctrl-row">
                <label for="brightness-slider">brightness</label>
                <input type="range" id="brightness-slider" min="0.1" max="2.2" step="0.01" value="1.0">
            </div>
            <div class="ctrl-row" id="color-row">
                <label for="color-slider">color</label>
                <input type="range" id="color-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="ctrl-row hidden" id="time-row">
                <label for="time-slider" id="time-label">time</label>
                <input type="range" id="time-slider" min="0" max="1" step="0.01" value="1.0">
            </div>
            <div class="ctrl-sep"></div>
            <div class="ctrl-row" id="lamp-row">
                <label for="lamp-slider" id="lamp-label">lamp</label>
                <input type="range" id="lamp-slider" min="0" max="2.5" step="0.01" value="1.0">
            </div>
            <div class="ctrl-row" id="lamp-tint-row">
                <label for="lamp-color-slider">lamp tint</label>
                <input type="range" id="lamp-color-slider" min="0" max="1" step="0.01" value="0.0">
            </div>
        </div>
        <nav id="worlds" aria-label="Choose a world">
            <button class="world active" data-world="room"><span class="dot"></span>the room</button>
            <button class="world" data-world="forest"><span class="dot"></span>the woods</button>
            <button class="world" data-world="northPole"><span class="dot"></span>north pole</button>
            <button class="world" data-world="spaceship"><span class="dot"></span>spaceship</button>
            <button class="world" data-world="river"><span class="dot"></span>the river</button>
            <button class="world" data-world="lighthouse"><span class="dot"></span>lighthouse</button>
        </nav>
        <button id="sound-btn" class="hidden"><span class="dot"></span>sound</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ── Renderer ──
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        document.body.appendChild(renderer.domElement);
        const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

        // ── Bloom pipeline: bright/emissive surfaces radiate ──
        // Bloom runs on linear HDR values; OutputPass applies tone mapping after.
        const composer = new EffectComposer(renderer);
        composer.setPixelRatio(renderer.getPixelRatio());

        // ── Scene ──
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030306);
        scene.fog = new THREE.FogExp2(0x030306, 0.07);

        // ── Theme groups: scenery is split so the button can swap worlds.
        //    Desk, person and dog live directly in the scene (shared).
        let theme = 'room';
        const roomGroup = new THREE.Group();
        const forestGroup = new THREE.Group();
        forestGroup.visible = false;
        const northPoleGroup = new THREE.Group();
        northPoleGroup.visible = false;
        const spaceshipGroup = new THREE.Group();
        spaceshipGroup.visible = false;
        const riverGroup = new THREE.Group();
        riverGroup.visible = false;
        const lighthouseGroup = new THREE.Group();
        lighthouseGroup.visible = false;
        scene.add(lighthouseGroup);
        scene.add(roomGroup);
        scene.add(forestGroup);
        scene.add(northPoleGroup);
        scene.add(spaceshipGroup);
        scene.add(riverGroup);
        let addTarget = scene; // construction target; switched per section below

        // ── Camera ──
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 30);
        camera.position.set(3.5, 2.6, 5.0);

        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 0.45, 0.6, 1.0);
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        // ── Orbit controls ──
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.05, 0.2);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.4;
        controls.maxDistance = 22;
        controls.zoomSpeed = 3.0;
        controls.maxPolarAngle = Math.PI * 0.8;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.28;
        controls.update();

        let resumeTimer;
        controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimer); });
        controls.addEventListener('end',  () => { resumeTimer = setTimeout(() => (controls.autoRotate = true), 3500); });

        // ── Helpers ──
        // Physically-based default: diffuse-heavy but reacts to light direction
        // with proper specular falloff, so surfaces read as real materials.
        const lm = (hex, emHex = 0, ei = 0, rough = 0.88, metal = 0.0) => {
            const m = new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal });
            if (emHex) { m.emissive.setHex(emHex); m.emissiveIntensity = ei; }
            return m;
        };
        const box = (w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) => {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            addTarget.add(mesh);
            return mesh;
        };

        // ── Procedural surface textures ──
        const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
        const asTex = (cv, rx = 1, ry = 1, srgb = true) => {
            const t = new THREE.CanvasTexture(cv);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(rx, ry);
            t.anisotropy = MAX_ANISO;
            if (srgb) t.colorSpace = THREE.SRGBColorSpace;
            return t;
        };
        const speckle = (g, w, h, n, aMax, light, dark) => {
            for (let i = 0; i < n; i++) {
                g.globalAlpha = Math.random() * aMax;
                g.fillStyle = Math.random() < 0.5 ? light : dark;
                g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 1.6, 1 + Math.random() * 1.6);
            }
            g.globalAlpha = 1;
        };

        // Wood grain: wavering streaks, knots, pore noise → { map, bump }
        const woodTex = (base, streak, dark, knots = 3) => {
            const cv = mkCanvas(512, 512), g = cv.getContext('2d');
            const bcv = mkCanvas(512, 512), bg = bcv.getContext('2d');
            g.fillStyle = base; g.fillRect(0, 0, 512, 512);
            bg.fillStyle = '#808080'; bg.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 110; i++) {
                const y0 = Math.random() * 512, amp = 2 + Math.random() * 7, per = 90 + Math.random() * 220;
                const lw = 0.5 + Math.random() * 1.8, a = 0.05 + Math.random() * 0.15, ph = Math.random() * 7;
                g.strokeStyle = Math.random() < 0.6 ? streak : dark;
                g.globalAlpha = a; g.lineWidth = lw;
                bg.strokeStyle = Math.random() < 0.5 ? '#6a6a6a' : '#959595';
                bg.globalAlpha = Math.min(1, a * 1.7); bg.lineWidth = lw;
                g.beginPath(); bg.beginPath();
                for (let x = 0; x <= 512; x += 8) {
                    const y = y0 + Math.sin((x / per) * Math.PI * 2 + ph) * amp;
                    if (x === 0) { g.moveTo(x, y); bg.moveTo(x, y); }
                    else { g.lineTo(x, y); bg.lineTo(x, y); }
                }
                g.stroke(); bg.stroke();
            }
            g.globalAlpha = 1; bg.globalAlpha = 1;
            for (let i = 0; i < knots; i++) {
                const kx = 60 + Math.random() * 392, ky = 60 + Math.random() * 392;
                for (let r = 16; r > 1.5; r -= 2.2) {
                    g.strokeStyle = dark; g.globalAlpha = 0.15; g.lineWidth = 1.4;
                    g.beginPath(); g.ellipse(kx, ky, r * 2.1, r, 0.15, 0, Math.PI * 2); g.stroke();
                    bg.strokeStyle = '#606060'; bg.globalAlpha = 0.2; bg.lineWidth = 1.4;
                    bg.beginPath(); bg.ellipse(kx, ky, r * 2.1, r, 0.15, 0, Math.PI * 2); bg.stroke();
                }
                g.globalAlpha = 1; bg.globalAlpha = 1;
            }
            speckle(g, 512, 512, 2600, 0.10, streak, dark);
            speckle(bg, 512, 512, 2600, 0.14, '#9a9a9a', '#666666');
            return { map: cv, bump: bcv };
        };

        // Hardwood planks: staggered boards, per-board tint, seams → { map, bump, rough }
        const plankTex = () => {
            const cv = mkCanvas(1024, 1024), g = cv.getContext('2d');
            const bcv = mkCanvas(1024, 1024), bg = bcv.getContext('2d');
            const rcv = mkCanvas(1024, 1024), rg = rcv.getContext('2d');
            const ROWS = 8, PH = 1024 / ROWS;
            for (let r = 0; r < ROWS; r++) {
                let x = -Math.random() * 300;
                while (x < 1024) {
                    const pw = 260 + Math.random() * 260;
                    const tint = 0.82 + Math.random() * 0.36;
                    const br = (68 * tint) | 0, bgr = (51 * tint) | 0, bb = (34 * tint) | 0;
                    g.fillStyle = `rgb(${br},${bgr},${bb})`;
                    g.fillRect(x, r * PH, pw, PH);
                    // grain streaks inside the board
                    for (let i = 0; i < 26; i++) {
                        const gy = r * PH + Math.random() * PH;
                        const ga = 0.05 + Math.random() * 0.14;
                        g.strokeStyle = Math.random() < 0.55 ? 'rgb(46,34,20)' : 'rgb(12,8,5)';
                        g.globalAlpha = ga; g.lineWidth = 0.6 + Math.random() * 1.6;
                        g.beginPath();
                        const amp = 1 + Math.random() * 3, per = 80 + Math.random() * 160, ph2 = Math.random() * 7;
                        for (let gx = x; gx <= Math.min(x + pw, 1024); gx += 10) {
                            const yy = gy + Math.sin((gx / per) * Math.PI * 2 + ph2) * amp;
                            gx === x ? g.moveTo(gx, yy) : g.lineTo(gx, yy);
                        }
                        g.stroke();
                    }
                    g.globalAlpha = 1;
                    // sheen variation per board (rougher = lighter in roughness map)
                    rg.fillStyle = `rgb(${150 + Math.random() * 60 | 0},0,0)`;
                    rg.fillRect(x, r * PH, pw, PH);
                    // board field on bump
                    bg.fillStyle = `rgb(${118 + Math.random() * 22 | 0},0,0)`;
                    bg.fillRect(x, r * PH, pw, PH);
                    // vertical end-seam
                    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(x + pw - 2, r * PH, 3, PH);
                    bg.fillStyle = 'rgb(30,0,0)'; bg.fillRect(x + pw - 2, r * PH, 3, PH);
                    x += pw;
                }
                // horizontal seam between rows
                g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, r * PH - 1.5, 1024, 3);

        // ── River soundscape: synthesized, no audio files ──
        // Brown noise through a lowpass = the constant spillway rush;
        // short descending oscillator sweeps = songbirds on the banks.
        let audioCtx = null, rushGain = null, windGain = null, noiseBuf = null, soundOn = false;
        const buildAudio = () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const len = audioCtx.sampleRate * 2;
            noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const d = noiseBuf.getChannelData(0);
            let last = 0;
            for (let i = 0; i < len; i++) {
                const w = Math.random() * 2 - 1;
                last = (last + 0.02 * w) / 1.02;
                d[i] = last * 3.5;
            }
            // spillway rush: brown noise, low and heavy
            const src = audioCtx.createBufferSource();
            src.buffer = noiseBuf;
            src.loop = true;
            const lp = audioCtx.createBiquadFilter();
            lp.type = 'lowpass';
            lp.frequency.value = 650;
            lp.Q.value = 0.4;
            rushGain = audioCtx.createGain();
            rushGain.gain.value = 0;
            src.connect(lp).connect(rushGain).connect(audioCtx.destination);
            src.start();
            // storm wind: the same noise pushed up into a hiss
            const wsrc = audioCtx.createBufferSource();
            wsrc.buffer = noiseBuf;
            wsrc.loop = true;
            wsrc.playbackRate.value = 1.7;
            const bp = audioCtx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = 800;
            bp.Q.value = 0.5;
            windGain = audioCtx.createGain();
            windGain.gain.value = 0;
            wsrc.connect(bp).connect(windGain).connect(audioCtx.destination);
            wsrc.start();
        };
        // thunder: a delayed low rumble that decays slowly
        const thunder = delay => {
            if (!audioCtx || !noiseBuf) return;
            const st = audioCtx.currentTime + delay;
            const tsrc = audioCtx.createBufferSource();
            tsrc.buffer = noiseBuf;
            tsrc.loop = true;
            tsrc.playbackRate.value = 0.4;
            const tlp = audioCtx.createBiquadFilter();
            tlp.type = 'lowpass';
            tlp.frequency.value = 140;
            const tg = audioCtx.createGain();
            tg.gain.setValueAtTime(0, st);
            tg.gain.linearRampToValueAtTime(0.9, st + 0.08);
            tg.gain.exponentialRampToValueAtTime(0.001, st + 2.4 + Math.random() * 1.5);
            tsrc.connect(tlp).connect(tg).connect(audioCtx.destination);
            tsrc.start(st);
            tsrc.stop(st + 4.5);
        };
        const chirp = () => {
            if (!audioCtx) return;
            const t0 = audioCtx.currentTime;
            const notes = 2 + (Math.random() * 3 | 0);
            for (let i = 0; i < notes; i++) {
                const st = t0 + i * (0.16 + Math.random() * 0.1);
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                const f0 = 2400 + Math.random() * 1400;
                o.frequency.setValueAtTime(f0, st);
                o.frequency.exponentialRampToValueAtTime(f0 * (0.6 + Math.random() * 0.25), st + 0.12);
                g.gain.setValueAtTime(0, st);
                g.gain.linearRampToValueAtTime(0.045, st + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, st + 0.15);
                o.connect(g).connect(audioCtx.destination);
                o.start(st);
                o.stop(st + 0.17);
            }
        };
        // foghorn: two slow detuned saws — deep, mournful, far away
        const foghorn = () => {
            if (!audioCtx) return;
            const st = audioCtx.currentTime + 0.05;
            [86, 90.5].forEach(f => {
                const o = audioCtx.createOscillator();
                o.type = 'sawtooth';
                o.frequency.value = f;
                const flp = audioCtx.createBiquadFilter();
                flp.type = 'lowpass';
                flp.frequency.value = 250;
                flp.Q.value = 0.7;
                const fg = audioCtx.createGain();
                fg.gain.setValueAtTime(0, st);
                fg.gain.linearRampToValueAtTime(0.16, st + 0.4);
                fg.gain.setValueAtTime(0.16, st + 1.9);
                fg.gain.exponentialRampToValueAtTime(0.001, st + 2.8);
                o.connect(flp).connect(fg).connect(audioCtx.destination);
                o.start(st);
                o.stop(st + 3);
            });
        };
        // Clark's howl: a swooping sine with vibrato — the classic beagle aroo
        const aroo = () => {
            if (!audioCtx) return;
            const st = audioCtx.currentTime + 0.02;
            const o = audioCtx.createOscillator();
            o.type = 'sine';
            o.frequency.setValueAtTime(340, st);
            o.frequency.exponentialRampToValueAtTime(640, st + 0.35);
            o.frequency.setValueAtTime(640, st + 0.9);
            o.frequency.exponentialRampToValueAtTime(430, st + 1.5);
            const vib = audioCtx.createOscillator();
            vib.frequency.value = 6.5;
            const vibG = audioCtx.createGain();
            vibG.gain.value = 14;
            vib.connect(vibG).connect(o.frequency);
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(0, st);
            g.gain.linearRampToValueAtTime(0.055, st + 0.15);
            g.gain.setValueAtTime(0.055, st + 1.1);
            g.gain.exponentialRampToValueAtTime(0.001, st + 1.65);
            o.connect(g).connect(audioCtx.destination);
            o.start(st); vib.start(st);
            o.stop(st + 1.8); vib.stop(st + 1.8);
        };
        const soundBtn = document.getElementById('sound-btn');

            };

        // Clicks only — a drag that orbits the camera never triggers anything
        const raycaster = new THREE.Raycaster();
        const pointerV = new THREE.Vector2();
        let downX = 0, downY = 0;
        renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
        renderer.domElement.addEventListener('pointerup', e => {

            if (raycaster.intersectObject(monHit).length) {

        // ?clean hides the UI chrome — for screenshots and embeds
        if (new URLSearchParams(location.search).has('clean'))

        // Deep-link a world via URL hash, e.g. #forest or #spaceship
        const hashTheme = { forest: 'forest', northpole: 'northPole', spaceship: 'spaceship', river: 'river', lighthouse: 'lighthouse', room: 'room' }[location.hash.slice(1).toLowerCase()];
        if (hashTheme && hashTheme !== 'room') setTheme(hashTheme);

        document.getElementById('brightness-slider').addEventListener('input', e => {
            params.brightness = parseFloat(e.target.value);

        document.getElementById('color-slider').addEventListener('input', e => {

        // Base intensities (before multipliers)
        const BASE = { hemi: 7.5, fill: 5.2, mon: 10.5, mb: 4.2, rim: 4.5, lamp: 9.0, lampSpot: 16.0, kb: 2.2, moon: 3.6 };

        // Scene color endpoints: cool blue → warm amber
        const coolSky    = new THREE.Color(0x2233aa);
        const warmSky    = new THREE.Color(0xaa6622);
        const coolGround = new THREE.Color(0x111122);
        const warmGround = new THREE.Color(0x221a0a);
        const coolFill   = new THREE.Color(0x3344bb);
        const warmFill   = new THREE.Color(0xbb8833);
        const coolMon    = new THREE.Color(0x1133cc);
        const warmMon    = new THREE.Color(0xdd7711);
        const tintColor  = new THREE.Color();

        // Lamp color endpoints: warm incandescent → cool daylight
        const lampWarm  = new THREE.Color(0xff8833);
        const lampCool  = new THREE.Color(0xbbccff);
        const lampTint  = new THREE.Color();

        // ═══════════════════════════════
        //  EVENTS & LOOP
        // ═══════════════════════════════

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        let _lastT = 0;
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            const dt = Math.min(t - _lastT, 0.1);
            _lastT = t;
            const b = params.brightness;
            const c = params.color;

            // ── Dog AI/animation ──
            const ds = dogState;
            let moveTarget = null;
            const speed = 0.55;
            if (ds.mode === 'walking') {
                moveTarget = ds.waypoints[ds.wpIndex];
                if (t > ds.walkUntil) {
                    ds.mode = 'goingToBed';
                    ds.modeStart = t;
                }
            } else if (ds.mode === 'goingToBed') {
                moveTarget = [BEDX, BEDZ];
                const dx = moveTarget[0] - ds.pos[0], dz = moveTarget[1] - ds.pos[1];
                if (Math.hypot(dx, dz) < 0.04) {
                    ds.mode = 'inBed';
                    ds.modeStart = t;
                    ds.bedUntil = t + 28 + Math.random() * 18;
                    ds.pos[0] = BEDX; ds.pos[1] = BEDZ;
                    ds.facing = Math.PI * 0.6;
                    moveTarget = null;
                }
            } else if (ds.mode === 'inBed') {
                moveTarget = null;
                if (t > ds.bedUntil) {
                    ds.mode = 'walking';
                    ds.modeStart = t;
                    ds.wpIndex = 0;
                    ds.walkUntil = t + 25 + Math.random() * 20;
                }
            } else if (ds.mode === 'sniffing') {
                moveTarget = null;
                if (t > ds.sniffUntil) {
                    // sometimes whatever he smelled deserves a full aroo
                    if (Math.random() < 0.25) {
                        ds.mode = 'howling';
                        ds.howlUntil = t + 2.4;
                        if (soundOn && audioCtx) aroo();
                    } else {
                        ds.mode = 'walking';
                    }
                    ds.modeStart = t;
                }
            } else if (ds.mode === 'howling') {
                moveTarget = null;
                if (t > ds.howlUntil) {
                    ds.mode = 'walking';
                    ds.modeStart = t;
                }
            }
            if (moveTarget) {
                const dx = moveTarget[0] - ds.pos[0], dz = moveTarget[1] - ds.pos[1];
                const dist = Math.hypot(dx, dz);
                if (dist < 0.08 && ds.mode === 'walking') {
                    ds.wpIndex = (ds.wpIndex + 1) % ds.waypoints.length;
                    // Something smells interesting here…
                    if (Math.random() < 0.45) {
                        ds.mode = 'sniffing';
                        ds.sniffUntil = t + 1.4 + Math.random() * 2.4;
                    }
                } else if (dist > 0.01) {
                    ds.pos[0] += (dx / dist) * speed * dt;
                    ds.pos[1] += (dz / dist) * speed * dt;
                    const targetFacing = Math.atan2(dx, dz);
                    let df = targetFacing - ds.facing;
                    while (df > Math.PI) df -= 2 * Math.PI;
                    while (df < -Math.PI) df += 2 * Math.PI;
                    ds.facing += df * Math.min(1, dt * 6);
                }
            }
            dogGroup.position.x = ds.pos[0];
            dogGroup.position.z = ds.pos[1];
            dogGroup.rotation.y = ds.facing;

            const isMoving = (ds.mode === 'walking' || ds.mode === 'goingToBed');
            const lerpK = Math.min(1, dt * 5);
            let headPitch = 0, headYaw = 0;
            if (isMoving) {
                const sw = Math.sin(t * 9) * 0.55;
                legFL.rotation.x = sw;
                legBR.rotation.x = sw;
                legFR.rotation.x = -sw;
                legBL.rotation.x = -sw;
                dogGroup.position.y = Math.abs(Math.sin(t * 9)) * 0.012;
                tail.rotation.y = Math.sin(t * 12) * 0.4;
                // Ears flop with the trot, slight head bob
                earL.rotation.x = Math.sin(t * 9) * 0.16;
                earR.rotation.x = Math.sin(t * 9 + 0.6) * 0.16;
                headPitch = Math.sin(t * 9 * 2) * 0.04;
            } else if (ds.mode === 'sniffing') {
                // Nose to the ground, sweeping side to side
                const tuckK = Math.min(1, dt * 4);
                [legFL, legFR, legBL, legBR].forEach(l => l.rotation.x += (0 - l.rotation.x) * tuckK);
                dogGroup.position.y += (0 - dogGroup.position.y) * lerpK;
                headPitch = 0.85 + Math.sin(t * 5.2) * 0.07;
                headYaw = Math.sin(t * 2.3) * 0.30;
                tail.rotation.y = Math.sin(t * 8) * 0.32;        // excited wag
                earL.rotation.x = Math.sin(t * 5.2) * 0.10;
                earR.rotation.x = Math.sin(t * 5.2 + 0.5) * 0.10;
            } else if (ds.mode === 'howling') {
                // Nose to the sky, steady on all fours, a slight tremble
                const setK = Math.min(1, dt * 5);
                [legFL, legFR, legBL, legBR].forEach(l => l.rotation.x += (0 - l.rotation.x) * setK);
                dogGroup.position.y += (0 - dogGroup.position.y) * lerpK;
                headPitch = -0.66 + Math.sin(t * 9) * 0.02;
                tail.rotation.y = Math.sin(t * 2.2) * 0.12;
                earL.rotation.x += (-0.28 - earL.rotation.x) * setK;   // ears swept back
                earR.rotation.x += (-0.28 - earR.rotation.x) * setK;
            } else if (ds.mode === 'inBed') {
                // Curl up: legs tuck forward, body settles into the cushion
                const tuckK = Math.min(1, dt * 3);
                [legFL, legFR, legBL, legBR].forEach(l => l.rotation.x += (1.45 - l.rotation.x) * tuckK);
                dogGroup.position.y += (-0.040 - dogGroup.position.y) * tuckK;
                headPitch = 0.32 + Math.sin(t * 1.9) * 0.015;    // resting, gentle breathing
                tail.rotation.y = Math.sin(t * 1.5) * 0.15;
                earL.rotation.x += (0 - earL.rotation.x) * tuckK;
                earR.rotation.x += (0 - earR.rotation.x) * tuckK;
                dogBody.scale.y = 1 + Math.sin(t * 2.1) * 0.035;
            } else {
                [legFL, legFR, legBL, legBR].forEach(l => l.rotation.x += (0 - l.rotation.x) * lerpK);
                dogGroup.position.y += (0 - dogGroup.position.y) * lerpK;
                tail.rotation.y = 0;
            }
            if (ds.mode !== 'inBed') dogBody.scale.y += (1 - dogBody.scale.y) * lerpK;
            dogHeadGrp.rotation.x += (headPitch - dogHeadGrp.rotation.x) * lerpK;
            dogHeadGrp.rotation.y += (headYaw - dogHeadGrp.rotation.y) * lerpK;

            // A good dog, petted: happy hops, blur-speed tail, hearts rising
            if (t < petUntil) {
                const pe = t - petStart;
                dogGroup.position.y += Math.abs(Math.sin(pe * 9)) * 0.05;
                tail.rotation.y = Math.sin(t * 24) * 0.5;
                earL.rotation.x = Math.sin(t * 12) * 0.2;
                earR.rotation.x = Math.sin(t * 12 + 0.4) * 0.2;
                for (let i = 0; i < hearts.length; i++) {
                    const hp = ((pe + i * 0.5) % 1.6) / 1.6;
                    hearts[i].visible = true;
                    hearts[i].position.set(
                        dogGroup.position.x + Math.sin(i * 2.4 + pe) * 0.13,
                        dogGroup.position.y + 0.34 + hp * 0.45,
                        dogGroup.position.z + Math.cos(i * 1.7) * 0.10);
                    hearts[i].material.opacity = (1 - hp) * 0.9;
                }
            } else if (hearts[0].visible) {
                hearts.forEach(h => h.visible = false);
            }

            // Zero-g: dog floats and gently tumbles in spaceship
            if (theme === 'spaceship') {
                dogGroup.position.y += 0.14 + Math.sin(t * 0.28) * 0.04;
                dogGroup.rotation.z = Math.sin(t * 0.16) * 0.13;
                dogGroup.rotation.x += Math.sin(t * 0.11) * 0.06;
            } else {
                dogGroup.rotation.z = 0;
            }

            tintColor.copy(coolMon).lerp(warmMon, c);

            if (theme === 'room') {
                scene.background.setHex(0x030306);
                scene.fog.color.setHex(0x030306);
                scene.fog.density = 0.07;

                // Hemisphere — whole-scene ambient fill, color-shifted
                hemiLight.intensity = BASE.hemi * b;
                hemiLight.color.copy(coolSky).lerp(warmSky, c);
                hemiLight.groundColor.copy(coolGround).lerp(warmGround, c);

                // Directional fill — broad even illumination, color-shifted
                fillLight.intensity = BASE.fill * b;
                fillLight.color.copy(coolFill).lerp(warmFill, c);
            } else if (theme === 'forest') {
                // ── Forest day/night cycle (time slider: 0 night → 1 noon) ──
                const td = params.time;
                if (td < 0.5) skyCol.copy(skyNight).lerp(skyDusk, td * 2);
                else skyCol.copy(skyDusk).lerp(skyDay, (td - 0.5) * 2);
                scene.background.copy(skyCol);
                scene.fog.color.copy(skyCol).multiplyScalar(0.92);
                scene.fog.density = 0.028 + (1 - td) * 0.018;

                hemiLight.intensity = (0.9 + td * 3.6) * b;
                hemiLight.color.copy(skyCol);
                hemiLight.groundColor.copy(grNight).lerp(grDay, td);
                fillLight.intensity = 0.4 * b;
                fillLight.color.copy(skyCol);

                // Sun climbs from the horizon to overhead
                const el = -0.10 + td * 1.35;
                const sy = Math.sin(el), sc = Math.cos(el);
                forestSun.position.set(-sc * 9, sy * 10 + 0.3, -4.5);
                forestSun.intensity = Math.max(0, td - 0.07) * 5.5 * b;
                forestSun.color.copy(sunWarm).lerp(sunNoon, Math.min(1, td * 1.4));
                sunDisc.position.set(-sc * 10.5, sy * 11 + 0.3, -5.2);
                sunDisc.material.opacity = THREE.MathUtils.clamp((td - 0.08) * 4, 0, 1);
                sunDisc.lookAt(camera.position);

                // Moon + stars take over after dark
                moonDisc.material.opacity = THREE.MathUtils.clamp((0.5 - td) * 3.2, 0, 1);
                moonDisc.lookAt(camera.position);
                forestMoonLight.intensity = Math.max(0, 0.5 - td) * 3.6 * b;
                starMat.opacity = THREE.MathUtils.clamp((0.45 - td) * 2.6, 0, 1);

                // Fireflies wander once the light fades
                ffMat.opacity = THREE.MathUtils.clamp((0.4 - td) * 3, 0, 1) * (0.7 + Math.sin(t * 3.1) * 0.3);
                if (ffMat.opacity > 0.01) {
                    const fp = fireflies.geometry.attributes.position.array;
                    for (let i = 0; i < FF_N; i++) {
                        const s = ffSeed[i*4+3];
                        fp[i*3]   = ffSeed[i*4]   + Math.sin(t * 0.35 + s) * 0.5;
                        fp[i*3+1] = ffSeed[i*4+1] + Math.sin(t * 0.8 + s * 2) * 0.18;
                        fp[i*3+2] = ffSeed[i*4+2] + Math.cos(t * 0.3 + s) * 0.5;
                    }
                    fireflies.geometry.attributes.position.needsUpdate = true;
                }

                // Campfire — flicker scaled by the campfire slider
                const fb = params.lampBrightness;
                const fFlick = Math.sin(t * 11) * 0.18 + Math.sin(t * 23.7) * 0.12 + Math.sin(t * 5.3) * 0.10;
                fireLight.intensity = Math.max(0, (1.6 + fFlick) * fb * 2.2);
                for (let i = 0; i < flames.length; i++) {
                    const f = flames[i];
                    const sFl = fb < 0.05 ? 0.001 : 0.75 + Math.sin(t * 9 + i * 2.4) * 0.18 + fb * 0.25;
                    f.scale.set(sFl, sFl * (1 + Math.sin(t * 13 + i) * 0.12), sFl);
                    f.position.y = f.userData.baseY * f.scale.y;
                    f.rotation.y = t * (1.2 + i * 0.5);
                }
                ember.material.color.setHSL(0.03, 1.0, 0.10 + 0.14 * Math.min(fb, 1.5) + Math.sin(t * 7) * 0.03);
            } else if (theme === 'northPole') {
                // ── North Pole: deep polar night with aurora borealis ──
                const auroraStr = params.time;
                npSkyColor.copy(npSkyDeep).lerp(npSkyGlow, auroraStr * 0.45);
                scene.background.copy(npSkyColor);
                scene.fog.color.copy(npSkyColor);
                scene.fog.density = 0.018;

                // Cold arctic ambient — snow bounce gives a brighter ground fill
                hemiLight.intensity = 2.2 * b;
                hemiLight.color.setHex(0x334488);
                hemiLight.groundColor.setHex(0x8899bb);
                fillLight.intensity = 1.3 * b;
                fillLight.color.setHex(0x4466aa);

                // Aurora curtains — scroll downward, breathe, gently sway
                for (let ri = 0; ri < auroraRibbons.length; ri++) {
                    const rb = auroraRibbons[ri];
                    const wave  = Math.sin(t * 0.55 + rb.userData.phase) * 0.5 + 0.5;
                    const waveB = Math.sin(t * 0.28 + rb.userData.phase * 1.3) * 0.5 + 0.5;
                    rb.material.opacity = auroraStr * (0.55 + wave * 0.45);
                    // Scroll texture downward — gives the illusion of curtain falling/shimmering
                    rb.userData.uvOff = (rb.userData.uvOff + dt * (0.022 + waveB * 0.028)) % 1;
                    rb.material.map.offset.y = -rb.userData.uvOff;
                    // Slow vertical breathing + gentle yaw sway
                    rb.position.y = rb.userData.baseY + Math.sin(t * 0.18 + rb.userData.phase) * 0.45;
                    rb.rotation.y = -rb.userData.angle + Math.sin(t * 0.08 + rb.userData.phase * 0.6) * 0.09;
                }

                // Aurora sky lights pulse with the curtains — illuminate dome from above
                const aPhA = Math.sin(t * 0.40) * 0.5 + 0.5;
                const aPhB = Math.sin(t * 0.30 + 1.2) * 0.5 + 0.5;
                const aPhC = Math.sin(t * 0.50 + 2.5) * 0.5 + 0.5;
                npAuroraLightA.intensity = auroraStr * (0.9 + aPhA * 1.6) * b;
                npAuroraLightB.intensity = auroraStr * (0.6 + aPhB * 1.2) * b;
                npAuroraLightC.intensity = auroraStr * (0.5 + aPhC * 0.9) * b;
                npAuroraLightA.color.setHSL(0.37 + aPhA * 0.10, 1.0, 0.5);
                npAuroraLightB.color.setHSL(0.50 + aPhB * 0.28, 1.0, 0.5);
                npAuroraLightC.color.setHSL(0.78 + Math.sin(t * 0.22) * 0.08, 1.0, 0.5);

                // Glass dome picks up the aurora color in its emissive tint
                const domeHue = 0.37 + Math.sin(t * 0.35) * 0.10;
                const domeEmStr = 0.10 * auroraStr * (0.6 + aPhA * 0.4);
                npDome.material.emissive.setHSL(domeHue, 0.85, domeEmStr);
                npDomeInner.material.emissive.setHSL(domeHue, 0.85, domeEmStr * 0.6);

                // Moon always faces camera
                npMoonDisc.lookAt(camera.position);
                npMoonLight.intensity = 1.8 * b;

                // Lantern — gentle slow flicker
                const nplb = params.lampBrightness;
                const nlFlick = Math.sin(t * 8.7) * 0.09 + Math.sin(t * 19.1) * 0.055;
                npLanternLight.intensity = Math.max(0, (0.85 + nlFlick) * nplb * 2.6);
                npLanternGlowMesh.material.color.setHSL(0.13, 0.90, 0.54 + nlFlick * 0.12);

                // Snowfall — flakes drift down with gentle lateral sway
                const sfp = snowfallPoints.geometry.attributes.position.array;
                for (let i = 0; i < SNOW_N; i++) {
                    const ph = (snowfallPhase[i] + t * 0.042) % 1;
                    sfp[i*3]   = snowfallBase[i*2]   + Math.sin(t * 0.11 + i * 1.05) * 0.28;
                    sfp[i*3+1] = 5.8 * (1.0 - ph);
                    sfp[i*3+2] = snowfallBase[i*2+1] + Math.cos(t * 0.09 + i * 0.73) * 0.22;
                }
                snowfallPoints.geometry.attributes.position.needsUpdate = true;
            } else if (theme === 'spaceship') {
                // ── Spaceship: orbital module, clean white cabin light ──
                scene.background.setHex(0x000208);
                scene.fog.color.setHex(0x05070c);
                scene.fog.density = 0.030;

                // Even white LED cabin lighting with a soft cool bounce
                hemiLight.intensity = 3.4 * b;
                hemiLight.color.setHex(0xe8ecf4);
                hemiLight.groundColor.setHex(0x6e7278);
                fillLight.intensity = 1.7 * b;
                fillLight.color.setHex(0xf4f6fa);
                spCockpitLight.intensity = 2.4 * b;

                // Engine thruster glow (lamp slider = "thrusters")
                const thrStr = params.lampBrightness;
                const thrFlick = Math.sin(t*11.3)*0.10 + Math.sin(t*23.7)*0.06 + Math.sin(t*7.1)*0.08;
                spEngineLight.intensity  = Math.max(0, (1.4 + thrFlick) * thrStr * 1.8) * b;
                spEngineLight2.intensity = Math.max(0, (1.1 + thrFlick*0.8) * thrStr * 1.2) * b;
                // Pulse thruster mesh color
                const thrBright = 0.4 + thrStr * 0.6 + thrFlick * 0.2;
                spThrusterMesh.material.color.setHSL(0.06, 1.0, Math.min(0.65, thrBright));
                spThrusterMesh2.material.color.setHSL(0.62, 1.0, Math.min(0.60, thrBright*0.9));

                // Emergency strips slow pulse
                const pulse = Math.sin(t * 1.5) * 0.5 + 0.5;
                spAlertMat.emissiveIntensity = 0.15 + pulse * 0.60;

                // Status LEDs blink at individual rates
                for (const led of spStatusLEDs) {
                    led.material.emissiveIntensity = (Math.sin(t * led.userData.blinkRate) > 0) ? 1.4 : 0.12;
                }

                // Zero-g floating objects bob and slowly tumble
                for (const grp of spFloatItems) {
                    const ph = grp.userData.floatPhase;
                    grp.position.y = grp.userData.floatBase + Math.sin(t*0.32 + ph)*0.055;
                    grp.rotation.x = Math.sin(t*0.18 + ph*1.3)*0.14;
                    grp.rotation.z = Math.sin(t*0.24 + ph*0.8)*0.10;
                }
            } else if (theme === 'river') {
                // ── River day cycle (time slider: 0 misty dawn → 1 clear noon) ──
                const td = params.time;
                rSkyCol.copy(rSkyDawn).lerp(rSkyNoon, td);
                scene.background.copy(rSkyCol);
                scene.fog.color.copy(rSkyCol).multiplyScalar(0.96);
                scene.fog.density = 0.012 + (1 - td) * 0.024;

                hemiLight.intensity = (1.6 + td * 2.1) * b;
                hemiLight.color.copy(rSkyCol);
                hemiLight.groundColor.copy(rGrDawn).lerp(rGrNoon, td);
                fillLight.intensity = 0.7 * b;
                fillLight.color.copy(rSkyCol);

                // Sun climbs over the far bank behind the dam
                const el = 0.13 + td * 1.22;
                const sy = Math.sin(el), sc = Math.cos(el);
                riverSun.position.set(-sc * 8.5, sy * 10 + 0.4, -6.5);
                riverSun.intensity = (0.65 + td * 3.0) * b;
                riverSun.color.copy(rSunDawn).lerp(rSunNoon, Math.min(1, td * 1.35));
                riverSunDisc.position.set(-sc * 10.5, sy * 11.5 + 0.5, -8.5);
                riverSunDisc.material.opacity = 0.6 + (1 - td) * 0.35;
                riverSunDisc.lookAt(camera.position);

                // Current slides downstream; spillway churns
                rivTex.offset.y -= dt * 0.055;
                rapidsTex.offset.y -= dt * 0.55;
                rapids2Tex.offset.y -= dt * 0.3;
                resTex.offset.x += dt * 0.006;
                for (let i = 0; i < spillSheets.length; i++) {
                    spillSheets[i].material.map.offset.y -= dt * (1.0 + i * 0.09);
                    spillSheets[i].material.opacity = 0.8 + Math.sin(t * 7 + i * 2.1) * 0.08;
                }

                // Spray mist rises off the stilling basin, thicker at dawn
                const mp = mistPoints.geometry.attributes.position.array;
                for (let i = 0; i < MIST_N; i++) {
                    const ph = (mistBase[i * 3 + 2] + t * 0.16) % 1;
                    mp[i * 3]     = mistBase[i * 3] + Math.sin(t * 0.7 + i) * 0.12;
                    mp[i * 3 + 1] = 0.05 + ph * 1.5;
                    mp[i * 3 + 2] = mistBase[i * 3 + 1] + ph * 0.8 + Math.cos(t * 0.5 + i) * 0.08;
                }
                mistPoints.geometry.attributes.position.needsUpdate = true;
                mistMat.opacity = 0.16 + (1 - td) * 0.22;

                // Anglers: rods bob with the drift, an occasional recast flick,
                // and every so often a fish on — rod slams down and shakes
                for (let i = 0; i < anglers.length; i++) {
                    const a = anglers[i];
                    const hk = (t + a.phase * 4.1) % 27;
                    if (hk < 2.6) {
                        a.rodGrp.rotation.x = a.baseRX + 0.5 + Math.sin(t * 16) * 0.07;
                    } else {
                        const bob = Math.sin(t * 1.25 + a.phase) * 0.045;
                        const cp = (t + a.phase * 2.3) % 12;
                        const flick = cp < 0.85 ? Math.sin((cp / 0.85) * Math.PI) * 0.55 : 0;
                        a.rodGrp.rotation.x = a.baseRX + bob + flick;
                    }
                    const rp = ((t * 0.6 + a.phase) % 1.9) / 1.9;
                    a.ring.scale.setScalar(0.4 + rp * 2.6);
                    a.ring.material.opacity = (1 - rp) * 0.45;
                }

                // Salmon leap at the dam, wriggle, and splash back in
                const LEAP = 1.0;
                for (let i = 0; i < salmon.length; i++) {
                    const s = salmon[i];
                    const cyc = (t + s.phase) % s.period;
                    const cycleIdx = Math.floor((t + s.phase) / s.period);
                    const h1 = Math.abs(Math.sin(cycleIdx * 12.9898 + i * 78.233));
                    const lx = RIV.x0 + 0.7 + h1 * (RIV.x1 - RIV.x0 - 1.4);
                    const lz = RIV.damZ + 2.7 + Math.abs(Math.sin(cycleIdx * 3.7 + i)) * 1.7;
                    if (cyc < LEAP) {
                        const p = cyc / LEAP;
                        s.f.visible = true;
                        s.f.position.set(lx, RIV.water - 0.16 + Math.sin(p * Math.PI) * 1.05, lz - p * 0.55);
                        s.f.rotation.x = 0.95 - p * 2.0;      // nose-up out of the water, over, nose-down in
                        s.f.rotation.z = Math.sin(p * 17) * 0.14;   // mid-air wriggle
                    } else {
                        s.f.visible = false;
                    }
                    const spT = (cyc - LEAP) / 0.7;
                    if (spT >= 0 && spT < 1) {
                        s.splash.visible = true;
                        s.splash.position.set(lx, RIV.water + 0.018, lz - 0.55);
                        s.splash.scale.setScalar(0.4 + spT * 3.0);
                        s.splash.material.opacity = (1 - spT) * 0.65;
                    } else {
                        s.splash.visible = false;
                    }
                }

                // A tapped spot on the water spooks a fish into the air
                if (spook) {
                    if (spook.t0 === null) spook.t0 = t;
                    const el2 = t - spook.t0;
                    if (el2 < 0.9) {
                        const p2 = el2 / 0.9;
                        spookSalmon.f.visible = true;
                        spookSalmon.f.position.set(spook.x, RIV.water - 0.16 + Math.sin(p2 * Math.PI) * 0.85, spook.z - p2 * 0.4);
                        spookSalmon.f.rotation.x = 0.95 - p2 * 2.0;
                        spookSalmon.f.rotation.z = Math.sin(p2 * 17) * 0.14;
                    } else {
                        spookSalmon.f.visible = false;
                        const st2 = (el2 - 0.9) / 0.7;
                        if (st2 < 1) {
                            spookSalmon.splash.visible = true;
                            spookSalmon.splash.position.set(spook.x, RIV.water + 0.018, spook.z - 0.4);
                            spookSalmon.splash.scale.setScalar(0.4 + st2 * 3.0);
                            spookSalmon.splash.material.opacity = (1 - st2) * 0.65;
                        } else {
                            spookSalmon.splash.visible = false;
                            spook = null;
                        }
                    }
                }

                // Dawn chorus — sparse songbird phrases, thickest in the mist
                if (soundOn && audioCtx && Math.random() < dt * (0.08 + (1 - td) * 0.3)) chirp();
            } else if (theme === 'lighthouse') {
                // ── Storm cycle (slider: 0 brooding dusk → 1 full gale) ──
                const storm = params.time;

                // Lightning: schedule strikes, flash the world, roll thunder after
                if (t > lhNextStrike) {
                    lhFlashT = t;
                    lhNextStrike = t + 4 + Math.random() * (18 - storm * 13);
                    bolt.position.set(-10 - Math.random() * 9, 4.5, -12 + Math.random() * 22);
                    bolt.rotation.y = Math.random() * 0.8 - 0.4;
                    if (soundOn && audioCtx) thunder(0.4 + Math.random() * 1.6);
                }
                const fl = Math.max(0, 1 - (t - lhFlashT) / 0.30);
                const flash = fl * fl * (0.7 + storm * 0.5);
                bolt.material.opacity = fl > 0.55 ? (fl - 0.55) * 2.2 : 0;
                bolt.lookAt(camera.position.x, bolt.position.y, camera.position.z);

                lhSkyCol.copy(lhSkyCalm).lerp(lhSkyStorm, storm);
                lhSkyCol.lerp(new THREE.Color(0xaab8d0), flash * 0.55);
                scene.background.copy(lhSkyCol);
                scene.fog.color.copy(lhSkyCol).multiplyScalar(0.9);
                scene.fog.density = 0.020 + storm * 0.016 - flash * 0.012;

                hemiLight.intensity = (1.7 - storm * 0.5 + flash * 5.5) * b;
                hemiLight.color.set(0x5a6a84).lerp(lhSkyCol, 0.5);
                hemiLight.groundColor.copy(lhGrCalm).lerp(lhGrStorm, storm);
                fillLight.intensity = (0.75 + flash * 3.5) * b;
                fillLight.color.set(0x6a7890);

                // Beacon sweeps; brightness rides the beacon slider
                const beacon = params.lampBrightness;
                beaconGrp.rotation.y = t * 0.55;
                beamMat.opacity = 0.022 + beacon * 0.04 + storm * 0.01;
                beaconSpot.intensity = beacon * 9;
                lanternLight.intensity = 2.0 + beacon * 3.0 + Math.sin(t * 0.55 * 4) * 0.3;
                buoyLamp.material.emissiveIntensity = (Math.sin(t * 2.4) > 0.55 ? 2.4 : 0.15);

                // Sea swell rolls in; the whole surface heaves
                const sp3 = seaGeo.attributes.position;
                for (let i = 0; i < sp3.count; i++) {
                    const wx = sp3.getX(i) + seaMesh.position.x;
                    const wz = -sp3.getY(i);
                    sp3.setZ(i, swellH(wx, wz, t, storm));
                }
                sp3.needsUpdate = true;
                seaGeo.computeVertexNormals();
                seaTex.offset.x += dt * (0.02 + storm * 0.03);
                buoyGrp.position.y = SEA.level + swellH(-12.5, 3.5, t, storm);
                buoyGrp.rotation.z = Math.sin(t * 1.1) * 0.16 * (0.4 + storm);
                buoyGrp.rotation.x = Math.sin(t * 0.8 + 1) * 0.13 * (0.4 + storm);

                // Breakers surge and retreat at the cliff base
                for (let i = 0; i < breakers.length; i++) {
                    const ph = Math.sin(t * 0.85 + i * 2.1) * 0.5 + 0.5;
                    breakers[i].material.opacity = (0.08 + ph * 0.32) * (0.4 + storm * 0.6);
                    breakers[i].position.x = SEA.cliffX - 0.9 - i * 0.85 - ph * 0.5;
                }
                lhFoamTex.offset.y += dt * 0.12;

                // Rain drives sideways in the gusts
                const rp3 = rainPoints.geometry.attributes.position.array;
                for (let i = 0; i < RAIN_N; i++) {
                    rp3[i * 3]     += dt * (2.2 + storm * 2.6);
                    rp3[i * 3 + 1] -= dt * (6.5 + storm * 4);
                    if (rp3[i * 3 + 1] < 0) rp3[i * 3 + 1] = 9;
                    if (rp3[i * 3] > 11) rp3[i * 3] = -11;
                }
                rainPoints.geometry.attributes.position.needsUpdate = true;
                rainMat.opacity = storm * 0.42;

                // Cottage window flickers warmly against the dark
                cottageWin.material.emissiveIntensity = 1.35 + Math.sin(t * 6.2) * 0.1 + Math.sin(t * 13.7) * 0.06;
                cottageLight.intensity = 1.4 + Math.sin(t * 6.2) * 0.15;

                // Gulls wheel over the break, blown ragged as the storm builds
                for (let i = 0; i < gulls.length; i++) {
                    const gl = gulls[i];
                    const a = (t * gl.sp * (0.6 + storm * 0.9) + gl.ph) * gl.dir;
                    gl.g.position.set(
                        gl.cx + Math.cos(a) * gl.r,
                        gl.h + Math.sin(t * 0.9 + gl.ph) * (0.15 + storm * 0.4) + Math.sin(t * 3.1 + gl.ph * 2) * storm * 0.1,
                        gl.cz + Math.sin(a) * gl.r * 0.7);
                    gl.g.rotation.y = -(a + Math.PI / 2 * gl.dir);
                    gl.g.rotation.z = gl.dir * 0.16 + Math.sin(t * 2 + gl.ph) * (0.08 + storm * 0.12);
                    const flap = Math.sin(t * (5.5 + storm * 5) + gl.ph * 3) * (0.45 + storm * 0.25);
                    gl.wl.rotation.z = flap;
                    gl.wr.rotation.z = -flap;
                }

                // The freighter plods across the horizon, riding the swell
                shipGrp.position.z = ((t * 0.10 + 10) % 34) - 17;
                shipGrp.position.y = SEA.level + swellH(-21, shipGrp.position.z, t, storm) * 0.6;
                shipGrp.rotation.x = Math.sin(t * 0.5) * 0.02 * (1 + storm);
                shipGrp.rotation.z = Math.sin(t * 0.7 + 2) * 0.03 * (1 + storm);

                // Foghorn sounds through the murk on a long interval
                if (soundOn && audioCtx && t > lhNextHorn) {
                    lhNextHorn = t + 24 + Math.random() * 12;
                    foghorn();
                }
            }

            // Spillway rush fades in only while the river is on screen
            if (rushGain) {
                const target = (soundOn && theme === 'river') ? 0.55 : 0;
                rushGain.gain.value += (target - rushGain.gain.value) * Math.min(1, dt * 2.5);
            }
            // Storm wind gusts at the lighthouse, swelling with the slider
            if (windGain) {
                const gust = 0.75 + Math.sin(t * 0.6) * 0.15 + Math.sin(t * 1.7) * 0.10;
                const wt = (soundOn && theme === 'lighthouse') ? (0.06 + params.time * 0.30) * gust : 0;
                windGain.gain.value += (wt - windGain.gain.value) * Math.min(1, dt * 2);
            }

            // Monitor flicker × brightness
            const flicker = Math.sin(t * 1.1) * 0.18 + Math.sin(t * 13.3) * 0.06;
            monLight.intensity = (BASE.mon + flicker) * b;
            monLight.color.copy(tintColor);

            mbLight.intensity = BASE.mb * b;
            mbLight.color.copy(tintColor).multiplyScalar(0.65);

            rimLight.intensity = BASE.rim * b;
            rimLight.color.copy(tintColor).multiplyScalar(0.4);

            // Screen emissive tracks tint
            M.monScreen.emissive.copy(tintColor).multiplyScalar(0.45);
            M.macScreen.emissive.copy(tintColor).multiplyScalar(0.3);

            // Floor lamp
            lampTint.copy(lampWarm).lerp(lampCool, params.lampColor);
            lampLight.intensity = BASE.lamp * params.lampBrightness;
            lampLight.color.copy(lampTint);
            lampSpot.intensity = BASE.lampSpot * params.lampBrightness;
            lampSpot.color.copy(lampTint);
            lampShadeMat.emissive.copy(lampTint).multiplyScalar(0.25 * params.lampBrightness);

            // Moonlight follows overall brightness
            moonLight.intensity = BASE.moon * Math.min(b, 1.4);

            // Steam animation — layer 1: tight rising wisps
            const mugTopY = mugBase + mugH;
            const sp = steamPoints.geometry.attributes.position.array;
            for (let i = 0; i < STEAM_N; i++) {
                const phase = (steamPhases[i] + t * 0.33) % 1;
                const spread = 0.008 + phase * 0.028;
                sp[i*3]   = CFX + steamXZ[i*2]   + Math.sin(t * 0.60 + i * 0.92) * spread;
                sp[i*3+1] = mugTopY + phase * 0.26;
                sp[i*3+2] = CFZ + steamXZ[i*2+1] + Math.cos(t * 0.50 + i * 1.15) * spread * 0.7;
            }
            steamPoints.geometry.attributes.position.needsUpdate = true;

            // Steam animation — layer 2: high diffuse fade
            const sp2 = steamPoints2.geometry.attributes.position.array;
            for (let i = 0; i < STEAM_N2; i++) {
                const phase = (steamPhases2[i] + t * 0.27) % 1;
                const spread = 0.020 + phase * 0.038;
                sp2[i*3]   = CFX + steamXZ2[i*2]   + Math.sin(t * 0.42 + i * 1.30) * spread;
                sp2[i*3+1] = mugTopY + 0.13 + phase * 0.22;
                sp2[i*3+2] = CFZ + steamXZ2[i*2+1] + Math.cos(t * 0.37 + i * 0.78) * spread * 0.8;
            }
            steamPoints2.geometry.attributes.position.needsUpdate = true;

            // Keyboard RGB — slow hue cycle
            const kbHue = (t * 0.04) % 1;
            kbKeyMat.emissive.setHSL(kbHue, 0.90, 0.32);
            kbLight.color.setHSL(kbHue, 0.90, 0.50);
            kbLight.intensity = BASE.kb * b;

            // ── Person idle animation ──
            const breath = (Math.sin(t * 1.25) + 1) * 0.5;
            torso.scale.y = 1 + 0.012 * breath;
            torso.scale.z = 1 + 0.035 * breath;
            // Glances between the monitor, the MacBook, and back
            headGroup.rotation.y = Math.sin(t * 0.16) * 0.20 + Math.sin(t * 0.047) * 0.11;
            headGroup.rotation.x = 0.16 + Math.sin(t * 0.30) * 0.018 + 0.010 * breath;
            if (theme === 'spaceship') {
                // Zero-g: head drifts with a slight roll, body bobs off the seat
                headGroup.rotation.z = Math.sin(t * 0.19) * 0.055;
                headGroup.rotation.x += Math.sin(t * 0.13) * 0.030;
                torso.position.y = torso.userData.baseY + Math.sin(t * 0.28) * 0.018;
                torso.rotation.z = Math.sin(t * 0.22) * 0.022;
            } else {
                headGroup.rotation.z = 0;
                torso.position.y = torso.userData.baseY;
                torso.rotation.z = 0;
            }
            // Fingers pecking at the keys
            for (let i = 0; i < fingerMeshes.length; i++) {
                const f = fingerMeshes[i];
                f.position.y = f.userData.baseY - Math.max(0, Math.sin(t * 12.5 + i * 1.93)) * 0.0075;
            }

            // ── Monitor: fly-in zoom, about page when close, code otherwise ──
            if (monZoom) {
                camera.position.lerp(zoomCamTo, Math.min(1, dt * 4));
                controls.target.lerp(zoomTgtTo, Math.min(1, dt * 4));
            } else if (zoomSaved) {
                camera.position.lerp(zoomSaved.cam, Math.min(1, dt * 4));
                controls.target.lerp(zoomSaved.tgt, Math.min(1, dt * 4));
                if (camera.position.distanceTo(zoomSaved.cam) < 0.04) {
                    controls.enabled = true;
                    controls.autoRotate = zoomSaved.auto;
                    zoomSaved = null;
                }
            }
            if (t - monLastDraw > (monZoom ? 0.2 : 0.5)) {
                monLastDraw = t;
                if (monZoom || zoomSaved) drawAbout(t - monZoomStart);
                else drawMonitor(t);
                monTex.needsUpdate = true;
            }
            monScrMat.color.copy(scrCool).lerp(scrWarm, c);

            // ── Dust motes — slow rise with lateral drift ──
            const dp = dustPoints.geometry.attributes.position.array;
            for (let i = 0; i < DUST_N; i++) {
                const ph = (dustPhase[i] + t * 0.009) % 1;
                dp[i*3]   = dustBase[i*2]   + Math.sin(t * 0.10 + i * 1.37) * 0.09;
                dp[i*3+1] = 0.05 + ph * 3.0;
                dp[i*3+2] = dustBase[i*2+1] + Math.cos(t * 0.085 + i * 0.71) * 0.09;
            }
            dustPoints.geometry.attributes.position.needsUpdate = true;

            // Bloom sits heavier on glowing night worlds; in the daylight
            // worlds it follows the sun — glowy at dawn, nearly off at noon
            bloomPass.strength =
                theme === 'room' ? 0.55 :
                theme === 'northPole' ? 0.5 :
                theme === 'spaceship' ? 0.32 :
                theme === 'lighthouse' ? 0.45 :
                0.08 + (1 - params.time) * 0.3;

            controls.update();
            composer.render();
        }

        animate();
    </script>
</body>
</html>
