<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alandeboer.computer</title>
    <meta name="description" content="A tiny 3D universe where Alan is always at his desk — ten worlds to wander, from a neon room to a storm lighthouse to a Halloween street in Romeo, Michigan. One beagle named Clark.">
    <meta name="theme-color" content="#0a0e1e">
    <meta property="og:title" content="alandeboer.computer">
    <meta property="og:description" content="A tiny 3D universe where Alan is always at his desk — ten worlds to wander, one beagle named Clark.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alandeboer.computer/">
    <meta property="og:image" content="https://alandeboer.computer/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://alandeboer.computer/og.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
        }
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            user-select: none;
            font-family: 'Quicksand', sans-serif;
        }
        #site-name {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(80, 110, 220, 0.45);
            font-weight: 300;
            font-size: 12px;
            letter-spacing: 7px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        #hint {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(80, 110, 220, 0.2);
            font-weight: 300;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        /* Cinematic vignette */
        #ui::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(0,0,0,0.42) 100%);
            pointer-events: none;
        }

        /* ── Lighting panel: frosted glass, one quiet instrument ── */
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: all;
            padding: 14px 18px 16px;
            background: rgba(7, 9, 20, 0.82);
            border: 1px solid rgba(125, 150, 255, 0.22);
            border-radius: 12px;
            backdrop-filter: blur(14px) saturate(1.25);
            -webkit-backdrop-filter: blur(14px) saturate(1.25);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }
        .panel-title {
            color: rgba(150, 175, 255, 0.42);
            font-weight: 300;
            font-size: 9px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            margin-bottom: 1px;
            cursor: default;
        }
        .ctrl-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ctrl-row label {
            color: rgba(155, 180, 255, 0.72);
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            width: 76px;
            text-align: left;
            flex-shrink: 0;
            cursor: default;
        }
        .ctrl-row input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 116px;
            height: 3px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .ctrl-row input[type="range"]:focus-visible {
            outline: 1px solid rgba(160, 185, 255, 0.7);
            outline-offset: 5px;
        }
        #brightness-slider {
            background: linear-gradient(to right, rgba(80,110,220,0.08), rgba(80,110,220,0.5));
        }
        #color-slider {
            background: linear-gradient(to right, #0e1e55, #1a3aaa, #aac0ff, #ee8833);
        }
        #lamp-slider {
            background: linear-gradient(to right, rgba(180,90,20,0.1), rgba(255,150,50,0.6));
        }
        #lamp-color-slider {
            background: linear-gradient(to right, #2a0e00, #cc5500, #ffeedd, #aabbff);
        }
        #time-slider {
            background: linear-gradient(to right, #0a1230, #28406e, #d08a4a, #aee0ff);
        }
        .ctrl-row.hidden { display: none; }

        /* ── World picker: one chip per world, lit in that world's color ── */
        #worlds {
            position: absolute;
            top: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 648px;
            gap: 3px;
            pointer-events: all;
            padding: 5px;
            background: rgba(7, 9, 20, 0.82);
            border: 1px solid rgba(125, 150, 255, 0.22);
            border-radius: 12px;
            backdrop-filter: blur(14px) saturate(1.25);
            -webkit-backdrop-filter: blur(14px) saturate(1.25);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
        }
        .world {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: rgba(150, 170, 230, 0.5);
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.2s, background 0.2s, border-color 0.2s;
        }
        .world .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--wc);
            box-shadow: 0 0 6px var(--wc);
            opacity: 0.45;
            transition: opacity 0.2s, box-shadow 0.2s;
        }
        .world:hover {
            color: rgba(205, 220, 255, 0.92);
            background: rgba(95, 120, 210, 0.10);
        }
        .world:focus-visible {
            outline: 1px solid rgba(160, 185, 255, 0.7);
            outline-offset: 2px;
        }
        .world.active {
            color: rgba(228, 236, 255, 0.95);
            background: color-mix(in srgb, var(--wc) 11%, transparent);
            border-color: color-mix(in srgb, var(--wc) 40%, transparent);
        }
        .world.active .dot {
            opacity: 1;
            box-shadow: 0 0 10px var(--wc), 0 0 2px rgba(255, 255, 255, 0.9);
        }
        .world[data-world="room"]      { --wc: #7d9bff; }
        .world[data-world="forest"]    { --wc: #6fd07a; }
        .world[data-world="northPole"] { --wc: #7ce8ff; }
        .world[data-world="spaceship"] { --wc: #ff8d5c; }
        .world[data-world="river"]     { --wc: #5fc0d8; }
        .world[data-world="lighthouse"] { --wc: #ffd27a; }
        .world[data-world="apiary"]    { --wc: #f0b428; }
        .world[data-world="tavern"]    { --wc: #d85c28; }
        .world[data-world="video"]     { --wc: #ffec3d; }
        .world[data-world="tillson"]   { --wc: #ff7418; }

        .ctrl-sep {
            height: 1px;
            background: rgba(110, 140, 255, 0.12);
            margin: 2px 0;
        }

        /* ── Sound toggle: appears only at the river ── */
        #sound-btn {
            position: absolute;
            top: 136px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 7px;
            pointer-events: all;
            padding: 8px 13px;
            background: rgba(7, 9, 20, 0.82);
            border: 1px solid rgba(125, 150, 255, 0.22);
            border-radius: 10px;
            backdrop-filter: blur(14px) saturate(1.25);
            -webkit-backdrop-filter: blur(14px) saturate(1.25);
            color: rgba(150, 170, 230, 0.5);
            font-family: 'Quicksand', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        #sound-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #5fc0d8;
            box-shadow: 0 0 6px #5fc0d8;
            opacity: 0.35;
            transition: opacity 0.2s;
        }
        #sound-btn:hover { color: rgba(205, 220, 255, 0.92); }
        #sound-btn:focus-visible {
            outline: 1px solid rgba(160, 185, 255, 0.7);
            outline-offset: 2px;
        }
        #sound-btn.on {
            color: rgba(228, 236, 255, 0.95);
            border-color: rgba(95, 192, 216, 0.4);
        }
        #sound-btn.on .dot { opacity: 1; }
        #sound-btn.hidden { display: none; }

        /* narrow desktops: the picker grid would overlap the centered
           site name, so the name joins the hint at the bottom */
        @media (max-width: 1500px) and (min-width: 861px) {
            #site-name {
                top: auto;
                bottom: 46px;
                font-size: 10px;
                letter-spacing: 5px;
            }
        }
        @media (max-width: 860px) {
            #worlds {
                left: 12px;
                right: 12px;
                top: 12px;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
                gap: 3px;
            }
            .world { padding: 7px 6px; font-size: 9px; letter-spacing: 1px; gap: 5px; justify-content: center; }
            #controls {
                top: auto;
                bottom: 16px;
                left: 12px;
                padding: 11px 14px 13px;
                gap: 10px;
            }
            .ctrl-row input[type="range"] { width: 90px; }
            #site-name {
                top: auto;
                bottom: 20px;
                left: auto;
                right: 14px;
                transform: none;
                font-size: 9px;
                letter-spacing: 3px;
            }
            #sound-btn {
                top: auto;
                bottom: 48px;
                right: 12px;
            }
            #hint { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            #ui * { transition: none !important; }
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(205, 220, 255, 0.92);
            box-shadow: 0 0 7px rgba(140, 170, 255, 0.75), 0 0 0 3px rgba(140, 170, 255, 0.14);
            cursor: pointer;
            transition: box-shadow 0.15s, background 0.15s;
        }
        input[type="range"]:hover::-webkit-slider-thumb {
            background: #ffffff;
            box-shadow: 0 0 10px rgba(160, 190, 255, 0.95), 0 0 0 4px rgba(140, 170, 255, 0.22);
        }
        input[type="range"]::-moz-range-thumb {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(205, 220, 255, 0.92);
            box-shadow: 0 0 7px rgba(140, 170, 255, 0.75), 0 0 0 3px rgba(140, 170, 255, 0.14);
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="site-name">alandeboer.computer</div>
        <div id="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; pet clark &nbsp;·&nbsp; click the monitor</div>
        <div id="controls">
            <div class="panel-title">lighting</div>
            <div class="ctrl-row">
                <label for="brightness-slider">brightness</label>
                <input type="range" id="brightness-slider" min="0.1" max="2.2" step="0.01" value="1.0">
            </div>
            <div class="ctrl-row" id="color-row">
                <label for="color-slider">color</label>
                <input type="range" id="color-slider" min="0" max="1" step="0.01" value="0.1">
            </div>
            <div class="ctrl-row hidden" id="time-row">
                <label for="time-slider" id="time-label">time</label>
                <input type="range" id="time-slider" min="0" max="1" step="0.01" value="1.0">
            </div>
            <div class="ctrl-sep"></div>
            <div class="ctrl-row" id="lamp-row">
                <label for="lamp-slider" id="lamp-label">lamp</label>
                <input type="range" id="lamp-slider" min="0" max="2.5" step="0.01" value="1.0">
            </div>
            <div class="ctrl-row" id="lamp-tint-row">
                <label for="lamp-color-slider">lamp tint</label>
                <input type="range" id="lamp-color-slider" min="0" max="1" step="0.01" value="0.0">
            </div>
        </div>
        <nav id="worlds" aria-label="Choose a world">
            <button class="world active" data-world="room"><span class="dot"></span>the room</button>
            <button class="world" data-world="forest"><span class="dot"></span>the woods</button>
            <button class="world" data-world="northPole"><span class="dot"></span>north pole</button>
            <button class="world" data-world="spaceship"><span class="dot"></span>spaceship</button>
            <button class="world" data-world="river"><span class="dot"></span>the river</button>
            <button class="world" data-world="lighthouse"><span class="dot"></span>lighthouse</button>
            <button class="world" data-world="apiary"><span class="dot"></span>the apiary</button>
            <button class="world" data-world="tavern"><span class="dot"></span>the tavern</button>
            <button class="world" data-world="video"><span class="dot"></span>video store</button>
            <button class="world" data-world="tillson"><span class="dot"></span>tillson st</button>
        </nav>
        <button id="sound-btn" class="hidden"><span class="dot"></span>sound</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ── Renderer ──
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        document.body.appendChild(renderer.domElement);
        const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

        // ── Bloom pipeline: bright/emissive surfaces radiate ──
        // Bloom runs on linear HDR values; OutputPass applies tone mapping after.
        const composer = new EffectComposer(renderer);
        composer.setPixelRatio(renderer.getPixelRatio());

        // ── Scene ──
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030306);
        scene.fog = new THREE.FogExp2(0x030306, 0.07);

        // ── Theme groups: scenery is split so the button can swap worlds.
        //    Desk, person and dog live directly in the scene (shared).
        let theme = 'room';
        const roomGroup = new THREE.Group();
        const forestGroup = new THREE.Group();
        forestGroup.visible = false;
        const northPoleGroup = new THREE.Group();
        northPoleGroup.visible = false;
        const spaceshipGroup = new THREE.Group();
        spaceshipGroup.visible = false;
        const riverGroup = new THREE.Group();
        riverGroup.visible = false;
        const lighthouseGroup = new THREE.Group();
        lighthouseGroup.visible = false;
        scene.add(lighthouseGroup);
        const apiaryGroup = new THREE.Group();
        apiaryGroup.visible = false;
        scene.add(apiaryGroup);
        const tavernGroup = new THREE.Group();
        tavernGroup.visible = false;
        scene.add(tavernGroup);
        const videoGroup = new THREE.Group();
        videoGroup.visible = false;
        scene.add(videoGroup);
        const tillsonGroup = new THREE.Group();
        tillsonGroup.visible = false;
        scene.add(tillsonGroup);
        scene.add(roomGroup);
        scene.add(forestGroup);
        scene.add(northPoleGroup);
        scene.add(spaceshipGroup);
        scene.add(riverGroup);
        let addTarget = scene; // construction target; switched per section below

        // ── Camera ──
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 30);
        camera.position.set(3.5, 2.6, 5.0);

        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 0.45, 0.6, 1.0);
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());

        // ── Performance watchdog: steps render resolution down when frames
        //    drop, back up when there's headroom. Hysteresis + cooldowns
        //    keep it from oscillating on the boundary.
        const BASE_PR = Math.min(window.devicePixelRatio, 2);
        const PR_STEPS = [1, 0.85, 0.7, 0.55];
        let prIdx = 0, perfEma = 1 / 60, perfCooldown = 3;
        const applyPR = () => {
            const pr = BASE_PR * PR_STEPS[prIdx];
            renderer.setPixelRatio(pr);
            composer.setPixelRatio(pr);
            composer.setSize(window.innerWidth, window.innerHeight);
        };
        const perfWatch = dt => {
            if (dt > 0.25) return;   // tab switch / hitch — not signal
            perfEma += (dt - perfEma) * 0.05;
            perfCooldown -= dt;
            if (perfCooldown > 0) return;
            if (perfEma > 1 / 42 && prIdx < PR_STEPS.length - 1) {
                prIdx++;
                applyPR();
                perfCooldown = 2.5;
            } else if (perfEma < 1 / 56 && prIdx > 0) {
                prIdx--;
                applyPR();
                perfCooldown = 5;
            }
        };

        // ── Orbit controls ──
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.05, 0.2);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.4;
        controls.maxDistance = 22;
        controls.zoomSpeed = 3.0;
        controls.maxPolarAngle = Math.PI * 0.8;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.28;
        controls.update();

        let resumeTimer;
        controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimer); });
        controls.addEventListener('end',  () => { resumeTimer = setTimeout(() => (controls.autoRotate = true), 3500); });

        // ── Helpers ──
        // Physically-based default: diffuse-heavy but reacts to light direction
        // with proper specular falloff, so surfaces read as real materials.
        const lm = (hex, emHex = 0, ei = 0, rough = 0.88, metal = 0.0) => {
            const m = new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal });
            if (emHex) { m.emissive.setHex(emHex); m.emissiveIntensity = ei; }
            return m;
        };
        const box = (w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) => {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            addTarget.add(mesh);
            return mesh;
        };

        // ── Procedural surface textures ──
        const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
        const asTex = (cv, rx = 1, ry = 1, srgb = true) => {
            const t = new THREE.CanvasTexture(cv);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(rx, ry);
            t.anisotropy = MAX_ANISO;
            if (srgb) t.colorSpace = THREE.SRGBColorSpace;
            return t;
        };
        const speckle = (g, w, h, n, aMax, light, dark) => {
            for (let i = 0; i < n; i++) {
                g.globalAlpha = Math.random() * aMax;
                g.fillStyle = Math.random() < 0.5 ? light : dark;
                g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 1.6, 1 + Math.random() * 1.6);
            }
            g.globalAlpha = 1;
        };

        // Wood grain: wavering streaks, knots, pore noise → { map, bump }
        const woodTex = (base, streak, dark, knots = 3) => {
            const cv = mkCanvas(512, 512), g = cv.getContext('2d');
            const bcv = mkCanvas(512, 512), bg = bcv.getContext('2d');
            g.fillStyle = base; g.fillRect(0, 0, 512, 512);
            bg.fillStyle = '#808080'; bg.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 110; i++) {
                const y0 = Math.random() * 512, amp = 2 + Math.random() * 7, per = 90 + Math.random() * 220;
                const lw = 0.5 + Math.random() * 1.8, a = 0.05 + Math.random() * 0.15, ph = Math.random() * 7;
                g.strokeStyle = Math.random() < 0.6 ? streak : dark;
                g.globalAlpha = a; g.lineWidth = lw;
                bg.strokeStyle = Math.random() < 0.5 ? '#6a6a6a' : '#959595';
                bg.globalAlpha = Math.min(1, a * 1.7); bg.lineWidth = lw;
                g.beginPath(); bg.beginPath();
                for (let x = 0; x <= 512; x += 8) {
                    const y = y0 + Math.sin((x / per) * Math.PI * 2 + ph) * amp;
                    if (x === 0) { g.moveTo(x, y); bg.moveTo(x, y); }
                    else { g.lineTo(x, y); bg.lineTo(x, y); }
                }
                g.stroke(); bg.stroke();
            }
            g.globalAlpha = 1; bg.globalAlpha = 1;
            for (let i = 0; i < knots; i++) {
                const kx = 60 + Math.random() * 392, ky = 60 + Math.random() * 392;
                for (let r = 16; r > 1.5; r -= 2.2) {
                    g.strokeStyle = dark; g.globalAlpha = 0.15; g.lineWidth = 1.4;
                    g.beginPath(); g.ellipse(kx, ky, r * 2.1, r, 0.15, 0, Math.PI * 2); g.stroke();
                    bg.strokeStyle = '#606060'; bg.globalAlpha = 0.2; bg.lineWidth = 1.4;
                    bg.beginPath(); bg.ellipse(kx, ky, r * 2.1, r, 0.15, 0, Math.PI * 2); bg.stroke();
                }
                g.globalAlpha = 1; bg.globalAlpha = 1;
            }
            speckle(g, 512, 512, 2600, 0.10, streak, dark);
            speckle(bg, 512, 512, 2600, 0.14, '#9a9a9a', '#666666');
            return { map: cv, bump: bcv };
        };

        // Hardwood planks: staggered boards, per-board tint, seams → { map, bump, rough }
        const plankTex = () => {
            const cv = mkCanvas(1024, 1024), g = cv.getContext('2d');
            const bcv = mkCanvas(1024, 1024), bg = bcv.getContext('2d');
            const rcv = mkCanvas(1024, 1024), rg = rcv.getContext('2d');
            const ROWS = 8, PH = 1024 / ROWS;
            for (let r = 0; r < ROWS; r++) {
                let x = -Math.random() * 300;
                while (x < 1024) {
                    const pw = 260 + Math.random() * 260;
                    const tint = 0.82 + Math.random() * 0.36;
                    const br = (68 * tint) | 0, bgr = (51 * tint) | 0, bb = (34 * tint) | 0;
                    g.fillStyle = `rgb(${br},${bgr},${bb})`;
                    g.fillRect(x, r * PH, pw, PH);
                    // grain streaks inside the board
                    for (let i = 0; i < 26; i++) {
                        const gy = r * PH + Math.random() * PH;
                        const ga = 0.05 + Math.random() * 0.14;
                        g.strokeStyle = Math.random() < 0.55 ? 'rgb(46,34,20)' : 'rgb(12,8,5)';
                        g.globalAlpha = ga; g.lineWidth = 0.6 + Math.random() * 1.6;
                        g.beginPath();
                        const amp = 1 + Math.random() * 3, per = 80 + Math.random() * 160, ph2 = Math.random() * 7;
                        for (let gx = x; gx <= Math.min(x + pw, 1024); gx += 10) {
                            const yy = gy + Math.sin((gx / per) * Math.PI * 2 + ph2) * amp;
                            gx === x ? g.moveTo(gx, yy) : g.lineTo(gx, yy);
                        }
                        g.stroke();
                    }
                    g.globalAlpha = 1;
                    // sheen variation per board (rougher = lighter in roughness map)
                    rg.fillStyle = `rgb(${150 + Math.random() * 60 | 0},0,0)`;
                    rg.fillRect(x, r * PH, pw, PH);
                    // board field on bump
                    bg.fillStyle = `rgb(${118 + Math.random() * 22 | 0},0,0)`;
                    bg.fillRect(x, r * PH, pw, PH);
                    // vertical end-seam
                    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(x + pw - 2, r * PH, 3, PH);
                    bg.fillStyle = 'rgb(30,0,0)'; bg.fillRect(x + pw - 2, r * PH, 3, PH);
                    x += pw;
                }
                // horizontal seam between rows
                g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, r * PH - 1.5, 1024, 3);
                bg.fillStyle = 'rgb(26,0,0)'; bg.fillRect(0, r * PH - 1.5, 1024, 3);
            }
            speckle(g, 1024, 1024, 5200, 0.08, 'rgb(52,40,26)', 'rgb(8,6,4)');

            return { map: cv, bump: bcv, rough: rcv };

            vine:   lm(0x3a5a2c, 0, 0, 0.95),
            hay:    lm(0xc9a45a, 0, 0, 0.95),
            pump:   lm(0xe07818, 0, 0, 0.75),
            stem:   lm(0x4a5a2a, 0, 0, 0.9),
            bark:   lm(0x3a2e26, 0, 0, 0.98),
        };

        // flicker registries, driven in the animate loop
        const tlFlames = [];   // jack-o'-lanterns + candles
        const tlWindows = [];  // lit house windows
        const tlOrange = [];   // orange string lights

        // ── Ground: lawn, road, curbs, sidewalks, center line ──
        const tlGround = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), tlM.lawn);
        tlGround.rotation.x = -Math.PI / 2;
        tlGround.receiveShadow = true;
        addTarget.add(tlGround);
        const road = new THREE.Mesh(new THREE.PlaneGeometry(TL.half * 2, 46),
            new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.92 }));
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01;
        road.receiveShadow = true;
        addTarget.add(road);
        for (let dz = -21; dz < 21; dz += 3.2) {   // dashed center line
            box(0.14, 0.005, 1.7, lm(0xc8c090, 0, 0, 0.9), 0, 0.018, dz);
        }
        [-1, 1].forEach(sd => {
            box(0.22, 0.16, 46, tlM.curbC, sd * (TL.half + 0.11), 0.08, 0);          // curb
            const walk = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 46), tlM.walk);
            walk.rotation.x = -Math.PI / 2;
            walk.position.set(sd * (TL.curb - 0.05), 0.155, 0);
            walk.receiveShadow = true;
            addTarget.add(walk);
            for (let dz = -21; dz < 22; dz += 1.6) {   // sidewalk joints
                box(0.95, 0.004, 0.03, lm(0x76736c, 0, 0, 0.95), sd * (TL.curb - 0.05), 0.158, dz);
            }
        });

        // ── Decoration kit ──
        const tlPumpkin = (px, py, pz, s, carved) => {
            const p = new THREE.Mesh(new THREE.SphereGeometry(s, 10, 8), tlM.pump);
            p.scale.y = 0.78;
            p.position.set(px, py + s * 0.75, pz);
            p.castShadow = true;
            addTarget.add(p);
            const st = new THREE.Mesh(new THREE.BoxGeometry(0.02, s * 0.5, 0.02), tlM.stem);
            st.position.set(px, py + s * 1.5, pz);
            st.rotation.z = 0.22;
            addTarget.add(st);
            if (carved) {
                const fm = lm(0x3a1400, 0xffb838, 1.8);
                tlFlames.push({ m: fm, ph: Math.random() * 9, base: 1.7 });
                const fz = s * 0.88;
                [[-0.36, 0.16], [0.36, 0.16]].forEach(([ex, ey]) => {
                    const eye = new THREE.Mesh(new THREE.ConeGeometry(s * 0.18, s * 0.3, 3), fm);
                    eye.position.set(px + ex * s, py + s * (0.75 + ey), pz + fz);
                    addTarget.add(eye);
                });
                const mo = new THREE.Mesh(new THREE.BoxGeometry(s * 0.78, s * 0.14, 0.012), fm);
                mo.position.set(px, py + s * 0.5, pz + fz);
                addTarget.add(mo);
                [[-0.26, 1], [0.02, -1], [0.28, 1]].forEach(([tx, dr]) => {
                    const th = new THREE.Mesh(new THREE.BoxGeometry(s * 0.12, s * 0.12, 0.012), fm);
                    th.position.set(px + tx * s, py + s * (0.5 + dr * 0.11), pz + fz);
                    addTarget.add(th);
                });
            }
            return p;
        };
        const tlGrave = (gx, gz, ry) => {
            const lean = (Math.random() - 0.5) * 0.22;
            const round = Math.random() < 0.5;
            const slab = round
                ? new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.07, 10, 1, false, 0, Math.PI), tlM.stone)
                : new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.5, 0.07), tlM.stone);
            if (round) { slab.rotation.z = Math.PI / 2; slab.rotation.y = Math.PI / 2; }
            slab.position.set(gx, round ? 0.42 : 0.3, gz);
            slab.rotation.x = lean;
            slab.castShadow = slab.receiveShadow = true;
            addTarget.add(slab);
            if (round) box(0.38, 0.34, 0.07, tlM.stone, gx, 0.19, gz, lean, 0, 0);
            box(0.46, 0.06, 0.16, tlM.stone, gx, 0.03, gz);          // base
            box(0.2, 0.03, 0.012, lm(0x5c5c58, 0, 0, 0.95), gx, 0.36, gz + 0.04, lean, 0, 0);  // "RIP"
            box(0.13, 0.03, 0.012, lm(0x5c5c58, 0, 0, 0.95), gx, 0.29, gz + 0.04, lean, 0, 0);
        };
        const tlSkeleton = (sx, sz, ry, pose) => {
            const g = new THREE.Group();
            g.position.set(sx, 0, sz);
            g.rotation.y = ry;
            addTarget.add(g);
            const sb = (w, h, d, x, y, z, rz = 0) => {
                const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), tlM.bone);
                m.position.set(x, y, z);
                m.rotation.z = rz;
                m.castShadow = true;
                g.add(m);
                return m;
            };
            const lift = pose === 'wave' ? 1 : 0;
            sb(0.24, 0.34, 0.14, 0, 1.06, 0);                   // ribcage
            for (let i = 0; i < 4; i++) {                        // rib shadow lines
                const rib = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.018, 0.005), tlM.dark);
                rib.position.set(0, 1.18 - i * 0.08, -0.072);
                g.add(rib);
            }
            sb(0.1, 0.16, 0.1, 0, 0.84, 0);                     // pelvis
            sb(0.07, 0.4, 0.07, -0.06, 0.6, 0);                 // legs
            sb(0.07, 0.4, 0.07, 0.06, 0.6, 0);
            sb(0.09, 0.06, 0.16, -0.06, 0.37, 0.03);            // feet
            sb(0.09, 0.06, 0.16, 0.06, 0.37, 0.03);
            sb(0.06, 0.34, 0.06, -0.17, 1.02, 0, lift ? -0.9 : -0.12);   // arms
            sb(0.06, 0.34, 0.06, 0.17, 1.02, 0, 0.12);
            const skull = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.2, 0.18), tlM.bone);
            skull.position.set(0, 1.36, 0);
            skull.castShadow = true;
            g.add(skull);
            [-0.045, 0.045].forEach(ex => {
                const socket = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.05, 0.02), tlM.dark);
                socket.position.set(ex, 1.38, -0.09);
                g.add(socket);
            });
            const jaw2 = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.03, 0.02), tlM.dark);
            jaw2.position.set(0, 1.28, -0.09);
            g.add(jaw2);
            return g;
        };
        const tlWeb = (wx, wy, wz, s, ry) => {
            const g = new THREE.Group();
            g.position.set(wx, wy, wz);
            g.rotation.y = ry;
            addTarget.add(g);
            for (let i = 0; i < 7; i++) {
                const a = (i / 7) * Math.PI * 0.5 + Math.PI;
                const sp = new THREE.Mesh(new THREE.BoxGeometry(s, 0.012, 0.012), tlM.web);
                sp.position.set(Math.cos(a) * s / 2, Math.sin(a) * s / 2, 0);
                sp.rotation.z = a;
                g.add(sp);
            }
            for (let r = 1; r <= 4; r++) {
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(s * 0.12 * r, 0.008, 4, 14, Math.PI * 0.5), tlM.web);
                ring.rotation.z = Math.PI;
                g.add(ring);
            }
            return g;
        };
        const tlSpider = (sx, sy, sz, s) => {
            const g = new THREE.Group();
            g.position.set(sx, sy, sz);
            addTarget.add(g);
            const body = new THREE.Mesh(new THREE.SphereGeometry(s, 9, 7), tlM.dark);
            body.scale.set(1, 0.8, 1.3);
            body.castShadow = true;
            g.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(s * 0.55, 8, 6), tlM.dark);
            head.position.z = -s * 1.3;
            g.add(head);
            [[-1, 0.5], [-1, 0], [-1, -0.5], [-1, -1], [1, 0.5], [1, 0], [1, -0.5], [1, -1]].forEach(([sd2, off]) => {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(s * 1.7, 0.035, 0.035), tlM.dark);
                leg.position.set(sd2 * s * 0.9, s * 0.1, off * s * 0.7);
                leg.rotation.z = sd2 * -0.5;
                leg.rotation.y = off * 0.35;
                g.add(leg);
            });
            [[-0.22], [0.22]].forEach(([ex]) => {
                const eye = new THREE.Mesh(new THREE.SphereGeometry(s * 0.16, 6, 5), lm(0xd82020, 0xd82020, 1.6));
                eye.position.set(ex * s, s * 0.3, -s * 1.6);
                g.add(eye);
            });
            return g;
        };
        const tlGhost = (gx, gy, gz, s) => {
            const g = new THREE.Group();
            g.position.set(gx, gy, gz);
            addTarget.add(g);
            const hood = new THREE.Mesh(new THREE.SphereGeometry(s, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.6), tlM.sheet);
            hood.castShadow = true;
            g.add(hood);
            const drape = new THREE.Mesh(new THREE.ConeGeometry(s * 1.05, s * 2.1, 10, 1, true), tlM.sheet);
            drape.position.y = -s * 0.95;
            drape.rotation.x = Math.PI;
            drape.castShadow = true;
            g.add(drape);
            [[-0.35], [0.35]].forEach(([ex]) => {
                const eye = new THREE.Mesh(new THREE.BoxGeometry(s * 0.22, s * 0.3, 0.02), tlM.dark);
                eye.position.set(ex * s, -s * 0.1, -s * 0.85);
                g.add(eye);
            });
            return g;
        };
        const tlHayBale = (hx, hz, ry) => {
            const b = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.42, 10), tlM.hay);
            b.rotation.z = Math.PI / 2;
            b.rotation.y = ry;
            b.position.set(hx, 0.26, hz);
            b.castShadow = b.receiveShadow = true;
            addTarget.add(b);
            [-0.1, 0.1].forEach(o => box(0.44, 0.5, 0.03, lm(0x8a6a2a, 0, 0, 0.95), hx, 0.26, hz + o, 0, ry, 0));
        };
        const tlCornStalk = (cx, cz) => {
            const h = 1.1 + Math.random() * 0.4;
            box(0.05, h, 0.05, lm(0xa89050, 0, 0, 0.98), cx, h / 2, cz, 0, 0, (Math.random() - 0.5) * 0.12);
            for (let i = 0; i < 5; i++) {
                const lf = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.02, 0.09), lm(0x9a8a48, 0, 0, 0.98));
                lf.position.set(cx + (i % 2 ? 0.18 : -0.18), h * (0.35 + i * 0.13), cz);
                lf.rotation.z = (i % 2 ? -1 : 1) * 0.5;
                lf.rotation.y = i * 1.1;
                addTarget.add(lf);
            }
        };

        // ── The houses ──
        const tlHouse = (side, z, cfg) => {
            const x = side * TL.houseX;
            const g = new THREE.Group();
            g.position.set(x, 0, z);
            g.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;   // face the street
            addTarget.add(g);
            const W = cfg.w, D = 4.2, H = cfg.stories * 1.5;
            const sideMat = new THREE.MeshStandardMaterial({ map: sidingTex, color: cfg.siding, roughness: 0.9 });
            const hb = (w, h, d, m, px, py, pz, rx = 0, ry = 0, rz = 0) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
                mesh.position.set(px, py, pz);
                mesh.rotation.set(rx, ry, rz);
                mesh.castShadow = mesh.receiveShadow = true;
                g.add(mesh);
                return mesh;
            };
            // body + foundation
            hb(W, H, D, sideMat, 0, H / 2, 0);
            hb(W + 0.12, 0.34, D + 0.12, tlM.stone, 0, 0.17, 0);
            // gabled roof (two slabs + end triangles)
            const rp = Math.atan2(cfg.roofH, W / 2);
            const slope = Math.hypot(W / 2, cfg.roofH);
            [-1, 1].forEach(sd2 => {
                hb(slope, 0.11, D + 0.5, tlM.roof, sd2 * W / 4, H + cfg.roofH / 2, 0, 0, 0, -sd2 * rp);
            });
            [-1, 1].forEach(sd2 => {
                const tri = new THREE.Shape();
                tri.moveTo(-W / 2, 0); tri.lineTo(W / 2, 0); tri.lineTo(0, cfg.roofH);
                const gable = new THREE.Mesh(new THREE.ShapeGeometry(tri), sideMat);
                gable.position.set(0, H, sd2 * D / 2);
                if (sd2 < 0) gable.rotation.y = Math.PI;
                g.add(gable);
            });
            // porch: deck, posts, rail, shed roof
            const pD = 1.5;
            hb(W - 0.3, 0.14, pD, tlM.porch, 0, 0.4, D / 2 + pD / 2);
            for (let i = 0; i < 4; i++) {
                const px2 = -W / 2 + 0.3 + i * ((W - 0.6) / 3);
                hb(0.11, 1.85, 0.11, tlM.trim, px2, 1.4, D / 2 + pD - 0.12);
            }
            hb(W - 0.3, 0.1, pD + 0.24, tlM.roof, 0, 2.36, D / 2 + pD / 2, -0.12, 0, 0);
            hb(W - 0.5, 0.07, 0.06, tlM.trim, 0, 0.86, D / 2 + pD - 0.12);
            for (let i = 0; i < 9; i++)
                hb(0.035, 0.42, 0.035, tlM.trim, -W / 2 + 0.4 + i * ((W - 0.8) / 8), 0.65, D / 2 + pD - 0.12);
            [0, 1, 2].forEach(i => hb(1.0, 0.08, 0.3, tlM.stone, 0, 0.32 - i * 0.12, D / 2 + pD + 0.16 + i * 0.28));
            // door + porch light
            hb(0.72, 1.24, 0.09, lm(cfg.door, 0, 0, 0.7), 0, 1.09, D / 2 + 0.02);
            hb(0.08, 0.08, 0.05, lm(0xd8c088, 0, 0, 0.5), 0.24, 1.05, D / 2 + 0.07);
            const pl = lm(0x443320, 0xffc070, 1.6);
            hb(0.12, 0.16, 0.12, pl, 0.62, 1.7, D / 2 + 0.06);
            tlFlames.push({ m: pl, ph: Math.random() * 9, base: 1.5 });
            // windows, lit warm on both floors
            const winMat = () => {
                const m = lm(0x2a2418, 0xffcf7a, 1.35);
                tlWindows.push({ m, ph: Math.random() * 9, base: 1.25 + Math.random() * 0.4 });
                return m;
            };
            const winAt = (wx, wy, front) => {
                const m = winMat();
                hb(0.62, 0.86, 0.06, tlM.trim, wx, wy, front ? D / 2 + 0.01 : -D / 2 - 0.01);
                hb(0.5, 0.74, 0.05, m, wx, wy, front ? D / 2 + 0.04 : -D / 2 - 0.04);
                hb(0.05, 0.74, 0.06, tlM.trim, wx, wy, front ? D / 2 + 0.06 : -D / 2 - 0.06);
                hb(0.5, 0.05, 0.06, tlM.trim, wx, wy, front ? D / 2 + 0.06 : -D / 2 - 0.06);
            };
            winAt(-W / 2 + 0.75, 1.15, true);
            winAt(W / 2 - 0.75, 1.15, true);
            for (let i = 0; i < 3; i++) winAt(-W / 2 + 0.8 + i * ((W - 1.6) / 2), H - 0.7, true);
            // side windows
            [-1, 1].forEach(sd2 => {
                const m = winMat();
                hb(0.05, 0.74, 0.5, m, sd2 * (W / 2 + 0.03), 1.2, -0.8);
                hb(0.06, 0.86, 0.62, tlM.trim, sd2 * (W / 2 + 0.01), 1.2, -0.8);
            });
            // chimney + optional dormer
            hb(0.5, cfg.roofH + 1.1, 0.5, tlM.brick, W / 2 - 0.7, H + (cfg.roofH + 1.1) / 2 - 0.2, -0.9);
            if (cfg.dormer) {
                hb(0.9, 0.7, 0.9, sideMat, 0, H + cfg.roofH * 0.42, D / 2 - 0.75);
                hb(1.05, 0.09, 1.0, tlM.roof, 0, H + cfg.roofH * 0.42 + 0.38, D / 2 - 0.75);
                const dm = winMat();
                hb(0.42, 0.42, 0.05, dm, 0, H + cfg.roofH * 0.42, D / 2 - 0.31);
            }
            // orange string lights along the porch roof edge
            for (let i = 0; i < 11; i++) {
                const om = lm(0x3a1a00, 0xff7418, 1.6);
                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 5), om);
                bulb.position.set(-W / 2 + 0.25 + i * ((W - 0.5) / 10),
                    2.3 - Math.sin((i / 10) * Math.PI) * 0.12, D / 2 + pD + 0.1);
                g.add(bulb);
                tlOrange.push({ m: om, ph: i * 0.6 });
            }
            return { g, W, D, pD };
        };

        // ── Ten houses, five a side ──
        const tlPalette = [
            { siding: 0xb8ada0, door: 0x7a2418, roofH: 1.5, w: 5.0, stories: 2, dormer: true },
            { siding: 0x8fa4a8, door: 0x2a3a5a, roofH: 1.3, w: 4.4, stories: 2, dormer: false },
            { siding: 0xc9bda6, door: 0x3a5a3a, roofH: 1.6, w: 5.4, stories: 2, dormer: true },
            { siding: 0x9a8f9c, door: 0x5a2a4a, roofH: 1.35, w: 4.6, stories: 2, dormer: false },
            { siding: 0xa8b09a, door: 0x6a4418, roofH: 1.45, w: 4.8, stories: 2, dormer: true },
        ];
        const tlStyles = ['graveyard', 'spiders', 'witch', 'classic', 'inflatable'];
        const tlSway = [];      // inflatables that breathe
        const tlHang = [];      // ghosts hanging from trees
        const tlCauldrons = [];

        [-1, 1].forEach((side, si) => {
            for (let i = 0; i < 5; i++) {
                const z = -TL.span * 2 + i * TL.span;
                const cfg = tlPalette[(i + si * 2) % 5];
                const h = tlHouse(side, z, cfg);
                const style = tlStyles[(i + si * 3) % 5];
                // yard coordinate helpers (world space)
                const yx = (t2) => side * (TL.lawn - t2);        // t2: distance in from lawn edge
                const front = side * (TL.houseX - (4.2 / 2 + 1.5));  // porch front edge

                // walkway from sidewalk to porch
                for (let k = 0; k < 6; k++) {
                    const wxp = side * (TL.curb + 0.4 + k * 0.72);
                    box(0.62, 0.02, 0.62, tlM.walk, wxp, 0.02, z);
                }
                // a tree on most lawns
                if (i !== 2) {
                    const tx2 = yx(3.4), tz2 = z + (i % 2 ? 2.1 : -2.2);
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 3.0, 7), tlM.bark);
                    trunk.position.set(tx2, 1.5, tz2);
                    trunk.castShadow = trunk.receiveShadow = true;
                    addTarget.add(trunk);
                    for (let b2 = 0; b2 < 5; b2++) {
                        const a2 = (b2 / 5) * Math.PI * 2;
                        const br = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 1.5, 5), tlM.bark);
                        br.position.set(tx2 + Math.sin(a2) * 0.5, 2.9 + (b2 % 2) * 0.35, tz2 + Math.cos(a2) * 0.5);
                        br.rotation.set(Math.cos(a2) * 0.75, 0, -Math.sin(a2) * 0.75);
                        br.castShadow = true;
                        addTarget.add(br);
                    }
                    if (Math.random() < 0.6) {   // a ghost swinging from a branch
                        const gh = tlGhost(tx2 + 0.6, 2.5, tz2 + 0.4, 0.24);
                        tlHang.push({ g: gh, y0: 2.5, ph: Math.random() * 9 });
                    }
                }
                // mailbox + a pumpkin or two on the steps
                box(0.07, 0.9, 0.07, tlM.bark, side * (TL.curb + 0.55), 0.45, z - 1.5);
                box(0.16, 0.2, 0.34, tlM.dark, side * (TL.curb + 0.55), 1.0, z - 1.5);
                tlPumpkin(front + side * 0.3, 0.42, z - 0.55, 0.17, true);
                tlPumpkin(front + side * 0.3, 0.42, z + 0.55, 0.14, Math.random() < 0.6);

                // ── per-house decoration style ──
                if (style === 'graveyard') {
                    for (let k = 0; k < 7; k++) {
                        tlGrave(yx(0.6 + Math.random() * 3.0), z - 2.2 + Math.random() * 4.4, Math.random());
                    }
                    tlSkeleton(yx(1.6), z - 1.4, side > 0 ? -1.4 : 1.4, 'wave');
                    tlSkeleton(yx(2.8), z + 1.6, side > 0 ? -1.9 : 1.9, 'stand');
                    for (let k = 0; k < 9; k++) {   // wrought-iron fence
                        box(0.05, 0.62, 0.05, tlM.dark, yx(3.6), 0.31, z - 2.6 + k * 0.65);
                    }
                    box(0.05, 0.05, 5.4, tlM.dark, yx(3.6), 0.58, z);
                } else if (style === 'spiders') {
                    tlWeb(front + side * 0.05, 2.05, z - 1.7, 1.5, side > 0 ? -Math.PI / 2 : Math.PI / 2);
                    tlWeb(front + side * 0.05, 2.05, z + 1.7, 1.5, side > 0 ? -Math.PI / 2 : Math.PI / 2);
                    const sp2 = tlSpider(yx(2.4), 1.5, z, 0.42);
                    tlSway.push({ g: sp2, y0: 1.5, ph: Math.random() * 9, amp: 0.18 });
                    for (let k = 0; k < 5; k++) {
                        const sm = tlSpider(yx(0.9 + Math.random() * 2.7), 0.14, z - 2 + Math.random() * 4, 0.12);
                        sm.rotation.y = Math.random() * 3;
                    }
                } else if (style === 'witch') {
                    const cx9 = yx(2.2), cz9 = z + 0.4;
                    const pot = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 9), tlM.dark);
                    pot.scale.y = 0.8;
                    pot.position.set(cx9, 0.4, cz9);
