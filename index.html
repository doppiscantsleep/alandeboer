                hemiLight.intensity = (1.5 + hearth * 0.75) * b;
                hemiLight.color.setHex(0x9a6a3e);
                hemiLight.groundColor.setHex(0x2c1a0a);
                fillLight.intensity = 0.7 * b;

                // flames lick and sway; logs shift and pop under them
                for (let i = 0; i < tvFlames.length; i++) {

                    f2.scale.set(s4, s4 * (1 + Math.sin(t * 13 + i) * 0.15), s4);
                    f2.position.y = f2.userData.baseY + f2.scale.y * 0.16;
                    f2.rotation.y = t * (1.1 + i * 0.4);

                for (let i = 0; i < tvLogs.length; i++) {

                for (let i = 0; i < TV_EMB; i++) {

                    eb[i * 3]     = FPX2 + ox + Math.sin(t * 0.9 + i) * 0.08;

                // the copper kettle sways very slightly on its crane
                tvKettle.rotation.z = Math.sin(t * 0.6) * 0.03;

                // candles gutter independently of the fire; the doorway lantern flickers slower
                for (const c2 of candleLights) {

                    } else {

                // the chandelier settles after a push, candlelight swaying with it

                // the cauldron simmers: brew pulses, bubbles climb and pop
                brewLight.intensity = (2.2 + Math.sin(t * 2.7) * 0.6 + Math.sin(t * 6.1) * 0.3) * b;

                const bub = bubPoints.geometry.attributes.position.array;

                for (const j of jacks) {
                    j.l.intensity = (0.45 + Math.sin(t * 9 + j.ph) * 0.15 + Math.sin(t * 27 + j.ph * 3) * 0.10) * b;

                // the bar cat breathes; one ear twitches now and then
                catBody.scale.y = 0.62 + Math.sin(t * 1.6) * 0.025;

                // rain slides down both panes
                for (const rs of rainStreaks) {

            } else if (theme === 'video') {

            } else if (theme === 'tillson') {

                tlMoonLight.intensity = (1.9 - td * 0.5) * b;

                    f4.m.emissiveIntensity = deco * f4.base *
                        (0.75 + Math.sin(t * 11 + f4.ph) * 0.16 + Math.sin(t * 27 + f4.ph * 2) * 0.09) *
                        (f4.boostUntil && f4.boostUntil > t ? 1.7 : 1);
                }
                for (const w4 of tlWindows) {
                    // most windows hold steady; a few flicker like a TV is on
                    w4.m.emissiveIntensity = w4.base * (0.9 + Math.sin(t * 0.7 + w4.ph) * 0.06)
                        + (Math.sin(w4.ph * 5) > 0.8 ? Math.sin(t * 14 + w4.ph) * 0.25 : 0);
                }
                for (const o3 of tlOrange) {
                    o3.m.emissiveIntensity = deco * (1.2 + Math.sin(t * 2.2 - o3.ph) * 0.5);
                }
                for (const lp2 of tlLampLights) lp2.intensity = 2.2 * b;
                for (const c7 of tlCauldrons) {
                    const pulse2 = 0.75 + Math.sin(t * 2.6 + c7.ph) * 0.22 + Math.sin(t * 6.3) * 0.1;
                    c7.l.intensity = deco * 2.2 * pulse2 * b;
                    c7.m.emissiveIntensity = deco * 1.2 * pulse2;
                }
                // inflatables breathe, hung ghosts swing
                for (const sw of tlSway) {
                    sw.g.position.y = sw.y0 + Math.sin(t * 0.9 + sw.ph) * sw.amp;
                    if (sw.rot) {
                        sw.g.rotation.z = Math.sin(t * 0.7 + sw.ph) * 0.045;
                        sw.g.scale.set(1 + Math.sin(t * 1.3 + sw.ph) * 0.02, 1 + Math.sin(t * 1.1 + sw.ph) * 0.03, 1);
                    }
                }
                for (const hg3 of tlHang) {
                    hg3.g.position.y = hg3.y0 + Math.sin(t * 1.2 + hg3.ph) * 0.14;
                    hg3.g.rotation.z = Math.sin(t * 0.8 + hg3.ph) * 0.2;
                    hg3.g.rotation.y = Math.sin(t * 0.5 + hg3.ph) * 0.5;
                }
                // fog rolls slowly down the street
                const fp2 = tlFog.geometry.attributes.position.array;
                for (let i = 0; i < FOG_N; i++) {
                    const dr2 = tlFogBase[i * 3 + 2];
                    fp2[i * 3] = tlFogBase[i * 3] + Math.sin(t * 0.15 + dr2 * 9) * 1.4;
                    fp2[i * 3 + 1] = 0.3 + Math.sin(t * 0.5 + dr2 * 6) * 0.07;
                    fp2[i * 3 + 2] = ((tlFogBase[i * 3 + 1] + t * (0.25 + dr2 * 0.3) + 22) % 44) - 22;
                }
                tlFog.geometry.attributes.position.needsUpdate = true;
                // bats wheel over the rooftops
                for (const bt4 of tlBats) {
                    const a7 = t * bt4.sp + bt4.ph;
                    bt4.g.position.set(Math.cos(a7) * bt4.r, bt4.h + Math.sin(t * 1.6 + bt4.ph) * 0.5,
                        bt4.cz + Math.sin(a7) * bt4.r * 0.8);
                    bt4.g.rotation.y = -a7 + Math.PI / 2;
                    const fl4 = Math.sin(t * 15 + bt4.ph) * 0.9;
                    bt4.wl.rotation.z = fl4;
                    bt4.wr.rotation.z = -fl4;
                }
                // trick-or-treaters work their way along the sidewalks
                for (const kd of tlKids) {
                    const waving = kd.waveUntil > t;
                    if (!waving) kd.z += kd.sp * kd.dir * dt;
                    if (kd.z > 22) kd.z = -22;
                    if (kd.z < -22) kd.z = 22;
                    const bounce = waving ? Math.abs(Math.sin(t * 9 + kd.ph)) * 0.07 : Math.abs(Math.sin(t * 5 + kd.ph)) * 0.035;
                    kd.g.position.set(kd.side * (TL.curb - 0.05), 0.155 + bounce, kd.z);
                    kd.g.rotation.y = waving ? (kd.side > 0 ? Math.PI / 2 : -Math.PI / 2) : (kd.dir > 0 ? 0 : Math.PI);
                    kd.g.rotation.z = waving ? Math.sin(t * 9 + kd.ph) * 0.22 : Math.sin(t * 5 + kd.ph) * 0.05;
                }
                // an owl somewhere up in the maples
                if (soundOn && audioCtx && t > tlNextOwl) {
                    tlNextOwl = t + 14 + Math.random() * 16;
                    owl();
                }
            } else if (theme === 'recall') {
                // ── Total Recall: a red dust storm, or — once the reactor is
                //    running — the first blue break in the Martian sky ──
                const atmo = params.time;                              // 0 storm → 1 terraformed
                const rx = Math.min(1, params.lampBrightness / 2.0);   // reactor output
                const dusty = 1 - atmo;

                // The sky shells and everything hung in them ride with the camera,
                // so the horizon stays out of reach however far you orbit
                rcSkyDust.position.copy(camera.position);
                rcSkyClear.position.copy(camera.position);
                rcSkyRig.position.copy(camera.position);
                rcSkyClear.material.opacity = atmo;
                rcSkyCol.copy(rcHorizonDusty).lerp(rcHorizonClear, atmo);
                scene.background.copy(rcSkyCol);
                scene.fog.color.copy(rcSkyCol).multiplyScalar(0.96);
                scene.fog.density = 0.030 - atmo * 0.022;

                // Sun burns through as the dust settles out of the air
                rcSun.intensity = (1.7 + atmo * 1.8) * b;
                rcSun.color.copy(rcSunDusty).lerp(rcSunClear, atmo);
                rcSunDisc.material.opacity = 0.45 + atmo * 0.5;
                rcSunHalo.material.opacity = 0.85 - atmo * 0.45;
                hemiLight.intensity = (0.55 + atmo * 0.75) * b;
                hemiLight.color.copy(rcSkyCol);
                hemiLight.groundColor.copy(rcGrCold).lerp(rcGrWarm, atmo);
                fillLight.intensity = (0.22 + atmo * 0.22) * b;
                fillLight.color.copy(rcSkyCol);
                rcClouds.forEach((cl, i) => {
                    cl.material.opacity = Math.max(0, (atmo - 0.35) / 0.65) * 0.5;
                    cl.position.x += dt * (0.12 + i * 0.03);
                    if (cl.position.x > 26) cl.position.x = -26;
                });

                // Dome glass picks up whatever colour the sky is
                rcGlassMat.color.copy(rcGlassCold).lerp(rcGlassWarm, atmo);
                rcGlassInnerMat.color.copy(rcGlassInCold).lerp(rcGlassInWarm, atmo);

                // Reactor: dead basalt at rest, a climbing column once it spins up.
                // It runs furnace-orange under the red sky and goes cold blue-white
                // as the atmosphere takes hold
                const pulse = 0.82 + Math.sin(t * 1.15) * 0.12 + Math.sin(t * 3.3) * 0.06;
                rcBeamCol.copy(rcBeamHot).lerp(rcBeamCold, atmo);
                rcSeamMat.emissiveIntensity = (0.05 + rx * 1.3) * pulse;
                rcCoreMat.emissiveIntensity = (0.1 + rx * 2.4) * pulse;
                rcCoreMat.emissive.copy(rcBeamCol);
                rcSeamMat.emissive.copy(rcBeamCol);
                rcPyrCore.rotation.y += dt * (0.15 + rx * 0.55);
                rcPyrCore.rotation.x = Math.sin(t * 0.4) * 0.16;
                rcReactorLight.intensity = (0.4 + rx * 7) * pulse * b;
                rcReactorLight.color.copy(rcBeamCol);
                rcBeamMat.color.copy(rcBeamCol);
                rcBeamGlowMat.color.copy(rcBeamCol);
                rcBeamMat.opacity = (0.025 + rx * 0.24) * pulse;
                rcBeamGlowMat.opacity = (0.015 + rx * 0.22) * pulse;
                rcBeam.scale.set(1 + rx * 0.3, 1, 1 + rx * 0.3);
                rcBeamHalo.scale.copy(rcBeam.scale);
                rcBeamCap.scale.set(1 + rx * 0.5, 0.42 + rx * 0.2, 1 + rx * 0.5);
                rcBeam.rotation.y += dt * 0.25;

                // Blowing dust, and two devils walking the plain
                rcDustMat.opacity = 0.05 + dusty * 0.4;
                const dp = rcDustGeo.attributes.position.array;
                const drift = dt * (0.8 + dusty * 2.6);
                for (let i = 0; i < RC_DUST_N; i++) {
                    dp[i * 3] += drift;
                    dp[i * 3 + 1] += Math.sin(t * 0.8 + i) * dt * 0.12;
                    if (dp[i * 3] > 23) { dp[i * 3] = -23; dp[i * 3 + 1] = Math.random() * 5.5; }
                }
                rcDustGeo.attributes.position.needsUpdate = true;
                rcDevils.forEach((d, i) => {
                    d.pts.rotation.y += dt * (2.6 + i * 0.7) * d.dir;
                    const a = t * 0.06 * d.dir + d.ph;
                    d.pts.position.set(d.cx + Math.cos(a) * 4.5, 0, d.cz + Math.sin(a) * 4.5);
                    d.pts.visible = dusty > 0.12;
                    d.pts.scale.setScalar(0.5 + dusty * 0.8);
                });

                // Processor stacks vent harder the more work the reactor is doing
                const vent = 0.25 + rx * 0.55;
                rcVentMat.opacity = vent * 0.4;
                const vp = rcVentGeo.attributes.position.array;
                for (let i = 0; i < RC_VENT_N; i++) {
                    const ph = (rcVentSeed[i] + t * 0.19) % 1;
                    const src = rcStacks[i % 2];
                    rcProc.localToWorld(rcVentWorld.copy(src.position));
                    vp[i * 3]     = rcVentWorld.x + Math.sin(t * 0.7 + i) * 0.1 + ph * 0.5;
                    vp[i * 3 + 1] = rcVentWorld.y + 0.5 + ph * (1.4 + vent * 1.6);
                    vp[i * 3 + 2] = rcVentWorld.z + Math.cos(t * 0.6 + i) * 0.1 + ph * 0.3;
                }
                rcVentGeo.attributes.position.needsUpdate = true;

                // The flag only has air to move it once the reactor has made some
                const fp = rcFlagGeo.attributes.position;
                const wind = 0.1 + atmo * 0.9;
                for (let i = 0; i < fp.count; i++) {
                    const bx = rcFlagBase[i * 3], by = rcFlagBase[i * 3 + 1];
                    const u = (bx + 0.46) / 0.92;
                    fp.setZ(i, Math.sin(t * 3.4 - u * 5.5) * 0.1 * u * wind);
                    fp.setY(i, by - u * u * 0.05 * (1 - wind));
                }
                fp.needsUpdate = true;

                // The dish sweeps for Earth; the rover looks over when prodded
                rcDishHead.rotation.y = Math.sin(t * 0.12) * 0.8;
                const roverLook = t < rcRoverLookUntil;
                rcRovHead.rotation.y += ((roverLook ? -1.15 : Math.sin(t * 0.2) * 0.25) - rcRovHead.rotation.y) * Math.min(1, dt * 3);

                // Rack and console telltales
                for (const l of rcRackLeds) l.m.emissiveIntensity = Math.sin(t * l.rate + l.ph) > 0 ? 1.4 : 0.1;
                rcAlBeaconMat.emissiveIntensity = 0.15 + Math.pow(Math.max(0, Math.sin(t * 2.1)), 6) * 2.2;
                rcAlBeaconLight.intensity = 0.1 + Math.pow(Math.max(0, Math.sin(t * 2.1)), 6) * 1.6;
                rcPodLedMat.emissiveIntensity = 0.7 + Math.sin(t * 0.9) * 0.08;

                // Halo emitters chase around the ring, and run hot mid-implant
                const implanting = t < rcImplantUntil;
                for (let i = 0; i < rcEmitters.length; i++) {
                    const chase = Math.pow(Math.max(0, Math.sin(t * (implanting ? 7 : 2) - i * 0.8)), 4);
                    rcEmitters[i].emissiveIntensity = 0.5 + chase * (implanting ? 4.5 : 1.6);
                }
                rcHaloLight.intensity = implanting ? 2.4 + Math.sin(t * 22) * 0.8 : 0.6;

                // Console readout — cheap redraw, and only while you're in this world
                if (t - rcConLast > 0.08) {
                    rcConLast = t;
                    const g = rcConCtx;
                    g.fillStyle = '#060a12'; g.fillRect(0, 0, 256, 160);
                    g.fillStyle = implanting ? '#4a1018' : '#141c2c'; g.fillRect(0, 0, 256, 18);
                    g.fillStyle = implanting ? '#ff6a7a' : '#7aa8ff';
                    g.font = 'bold 11px monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
                    g.fillText('REKALL  MEMORY IMPLANT', 7, 9);
                    g.textAlign = 'right';
                    g.fillText(implanting ? 'WRITING' : 'STANDBY', 249, 9);
                    g.textAlign = 'left';
                    // live trace
                    g.strokeStyle = implanting ? '#ff8a5a' : '#3ad0a0';
                    g.lineWidth = 1.6;
                    g.beginPath();
                    for (let x = 0; x < 240; x++) {
                        const amp = implanting ? 22 : 7;
                        const yy = 56 + Math.sin(x * 0.14 + t * 7) * amp * Math.sin(x * 0.031 + t * 1.7)
                                 + Math.sin(x * 0.4 + t * 15) * (implanting ? 6 : 1.6);
                        x === 0 ? g.moveTo(8 + x, yy) : g.lineTo(8 + x, yy);
                    }
                    g.stroke();
                    // channel bars
                    for (let i = 0; i < 8; i++) {
                        const lv = (Math.sin(t * (1.6 + i * 0.4) + i) * 0.5 + 0.5) * (implanting ? 1 : 0.4);
                        g.fillStyle = '#16202e'; g.fillRect(10 + i * 30, 92, 22, 34);
                        g.fillStyle = implanting ? '#ff7a4a' : '#2f9ad0';
                        g.fillRect(10 + i * 30, 126 - lv * 34, 22, lv * 34);
                    }
                    g.fillStyle = '#5d7590'; g.font = '9px monospace';
                    g.fillText(implanting ? 'SUBJECT: QUAID   PKG: BLUE SKIES / MARS' : 'SUBJECT: —       PKG: SELECT PACKAGE', 9, 143);
                    rcConTex.needsUpdate = true;
                }

                // REKALL neon: a steady hum, the odd dropout, and a hard cut-out
                // for a beat after you knock it
                const signOut = t < rcSignOutUntil;
                const signLv = signOut ? (Math.random() < 0.25 ? 0.35 : 0.03)
                    : 1 + Math.sin(t * 23) * 0.06 + (Math.random() < 0.015 ? -0.55 : 0);
                rcSignMat.emissiveIntensity = Math.max(0, signLv) * 1.25;
                rcSignLight.intensity = Math.max(0, signLv) * 1.3;
            }

            // Spillway rush fades in only while the river is on screen
            if (rushGain) {
                const target = (soundOn && theme === 'river') ? 0.55 : 0;
                rushGain.gain.value += (target - rushGain.gain.value) * Math.min(1, dt * 2.5);
            }
            // Storm wind gusts at the lighthouse, swelling with the slider —
            // the same bed doubles as a leaf-rustle breeze in the woods and
            // a colder arctic gust at the pole
            if (windGain) {
                const gust = 0.75 + Math.sin(t * 0.6) * 0.15 + Math.sin(t * 1.7) * 0.10;
                const wt = soundOn
                    ? (theme === 'lighthouse' ? (0.06 + params.time * 0.30) * gust
                        : theme === 'tillson' ? 0.055 * gust
                        : theme === 'forest' ? 0.03 * gust
                        : theme === 'northPole' ? 0.075 * gust
                        : theme === 'recall' ? (0.11 - params.time * 0.08) * gust : 0)
                    : 0;
                windGain.gain.value += (wt - windGain.gain.value) * Math.min(1, dt * 2);
            }
            // The apiary hums — swells slightly as bees pass near
            if (buzzGain) {
                const swell = 0.8 + Math.sin(t * 0.9) * 0.12 + Math.sin(t * 2.3) * 0.08;
                const bt2 = (soundOn && theme === 'apiary') ? 0.055 * swell : 0;
                buzzGain.gain.value += (bt2 - buzzGain.gain.value) * Math.min(1, dt * 2);
            }
            // Hearth crackle — random flutter over a soft bed, pops and all
            if (crackleGain) {
                const ct2 = (soundOn && theme === 'tavern')
                    ? params.lampBrightness * (0.015 + Math.random() * 0.05 + (Math.random() < 0.02 ? 0.10 : 0))
                    : 0;
                crackleGain.gain.value += (ct2 - crackleGain.gain.value) * Math.min(1, dt * 9);
            }
            // Fluorescent ballast hum in the video store
            if (humGain) {
                const ht2 = (soundOn && theme === 'video') ? 0.012 : 0;
                humGain.gain.value += (ht2 - humGain.gain.value) * Math.min(1, dt * 2);
            }
            // Distant city traffic hums through the room's window at night
            if (cityGain) {
                const ct3 = (soundOn && theme === 'room') ? 0.05 : 0;
                cityGain.gain.value += (ct3 - cityGain.gain.value) * Math.min(1, dt * 1.5);
            }
            // Spaceship engine drone — swells slightly with the thruster slider
            if (engineGain) {
                const et3 = (soundOn && theme === 'spaceship') ? 0.028 + params.lampBrightness * 0.02 : 0;
                engineGain.gain.value += (et3 - engineGain.gain.value) * Math.min(1, dt * 2);
            }

            // Monitor flicker × brightness
            const flicker = Math.sin(t * 1.1) * 0.18 + Math.sin(t * 13.3) * 0.06;
            monLight.intensity = (BASE.mon + flicker) * b;
            monLight.color.copy(tintColor);

            mbLight.intensity = BASE.mb * b;
            mbLight.color.copy(tintColor).multiplyScalar(0.65);

            rimLight.intensity = BASE.rim * b;
            rimLight.color.copy(tintColor).multiplyScalar(0.4);

            // Screen emissive tracks tint
            M.monScreen.emissive.copy(tintColor).multiplyScalar(0.45);
            M.macScreen.emissive.copy(tintColor).multiplyScalar(0.3);

            // Floor lamp
            lampTint.copy(lampWarm).lerp(lampCool, params.lampColor);
            lampLight.intensity = BASE.lamp * params.lampBrightness;
            lampLight.color.copy(lampTint);
            lampSpot.intensity = BASE.lampSpot * params.lampBrightness;
            lampSpot.color.copy(lampTint);
            lampShadeMat.emissive.copy(lampTint).multiplyScalar(0.25 * params.lampBrightness);

            // Moonlight follows overall brightness
            moonLight.intensity = BASE.moon * Math.min(b, 1.4);

            // Steam animation — layer 1: tight rising wisps
            const mugTopY = mugBase + mugH;
            const sp = steamPoints.geometry.attributes.position.array;
            for (let i = 0; i < STEAM_N; i++) {
                const phase = (steamPhases[i] + t * 0.33) % 1;
                const spread = 0.008 + phase * 0.028;
                sp[i*3]   = CFX + steamXZ[i*2]   + Math.sin(t * 0.60 + i * 0.92) * spread;
                sp[i*3+1] = mugTopY + phase * 0.26;
                sp[i*3+2] = CFZ + steamXZ[i*2+1] + Math.cos(t * 0.50 + i * 1.15) * spread * 0.7;
            }
            steamPoints.geometry.attributes.position.needsUpdate = true;

            // Steam animation — layer 2: high diffuse fade
            const sp2 = steamPoints2.geometry.attributes.position.array;
            for (let i = 0; i < STEAM_N2; i++) {
                const phase = (steamPhases2[i] + t * 0.27) % 1;
                const spread = 0.020 + phase * 0.038;
                sp2[i*3]   = CFX + steamXZ2[i*2]   + Math.sin(t * 0.42 + i * 1.30) * spread;
                sp2[i*3+1] = mugTopY + 0.13 + phase * 0.22;
                sp2[i*3+2] = CFZ + steamXZ2[i*2+1] + Math.cos(t * 0.37 + i * 0.78) * spread * 0.8;
            }
            steamPoints2.geometry.attributes.position.needsUpdate = true;

            // Keyboard RGB — slow hue cycle
            const kbHue = (t * 0.04) % 1;
            kbKeyMat.emissive.setHSL(kbHue, 0.90, 0.32);
            kbLight.color.setHSL(kbHue, 0.90, 0.50);
            kbLight.intensity = BASE.kb * b;

            // ── Person idle animation ──
            const breath = (Math.sin(t * 1.25) + 1) * 0.5;
            torso.scale.y = 1 + 0.012 * breath;
            torso.scale.z = 1 + 0.035 * breath;
            // Glances between the monitor, the MacBook, and back
            headGroup.rotation.y = Math.sin(t * 0.16) * 0.20 + Math.sin(t * 0.047) * 0.11;
            headGroup.rotation.x = 0.16 + Math.sin(t * 0.30) * 0.018 + 0.010 * breath;
            if (theme === 'spaceship') {
                // Zero-g: head drifts with a slight roll, body bobs off the seat
                headGroup.rotation.z = Math.sin(t * 0.19) * 0.055;
                headGroup.rotation.x += Math.sin(t * 0.13) * 0.030;
                torso.position.y = torso.userData.baseY + Math.sin(t * 0.28) * 0.018;
                torso.rotation.z = Math.sin(t * 0.22) * 0.022;
            } else {
                headGroup.rotation.z = 0;
                torso.position.y = torso.userData.baseY;
                torso.rotation.z = 0;
            }
            // Fingers pecking at the keys
            for (let i = 0; i < fingerMeshes.length; i++) {
                const f = fingerMeshes[i];
                f.position.y = f.userData.baseY - Math.max(0, Math.sin(t * 12.5 + i * 1.93)) * 0.0075;
            }

            // ── Monitor / MacBook: fly-in zoom, app view when close, idle otherwise ──
            if (monZoom) {
                camera.position.lerp(zoomCamTo, Math.min(1, dt * 4));
                controls.target.lerp(zoomTgtTo, Math.min(1, dt * 4));
            } else if (lapZoom) {
                camera.position.lerp(mbZoomCamPos(), Math.min(1, dt * 4));
                controls.target.lerp(zoomTgtToMB, Math.min(1, dt * 4));
            } else if (zoomSaved) {
                camera.position.lerp(zoomSaved.cam, Math.min(1, dt * 4));
                controls.target.lerp(zoomSaved.tgt, Math.min(1, dt * 4));
                if (camera.position.distanceTo(zoomSaved.cam) < 0.04) {
                    controls.enabled = true;
                    controls.autoRotate = zoomSaved.auto;
                    zoomSaved = null;
                    if (zoomSavedFrom === 'lap') { drawMBIdle(); mbTex.needsUpdate = true; }
                    zoomSavedFrom = null;
                }
            }
            if (monZoom && snakeActive) stepSnake(t);
            if (monZoom && invActive) { stepInvaders(t); stepInvBullets(t, dt); }
            if (t - monLastDraw > ((snakeActive || invActive) ? 0.05 : monZoom ? 0.2 : 0.5)) {
                monLastDraw = t;
                if (monZoom || (zoomSaved && zoomSavedFrom === 'mon')) drawAbout(t - monZoomStart);
                else if (!monZoom) drawMonitor(t);
                monTex.needsUpdate = true;
            }
            if (lapZoom || (zoomSaved && zoomSavedFrom === 'lap')) {
                if (t - lapLastDraw > (lapZoom ? 0.2 : 0.5)) {
                    lapLastDraw = t;
                    drawSlack(t - lapZoomStart);
                    mbTex.needsUpdate = true;
                }
            }
            monScrMat.color.copy(scrCool).lerp(scrWarm, c);

            // Show the on-screen keyboard bar only on touch devices, only while typing matters
            const wantMobileBar = isTouchDevice && (monZoom || lapZoom);
            if (wantMobileBar !== mobileBarShown) {
                mobileBarShown = wantMobileBar;
                mobileBar.classList.toggle('hidden', !wantMobileBar);
                if (wantMobileBar) { mobileInputEl.value = ''; mobileInputEl.focus(); }
                else { mobileInputEl.blur(); }
            }
            const mobileBarGameMode = snakeActive ? 'snake' : invActive ? 'invaders' : 'none';
            if (mobileBarShown && mobileBarGameMode !== mobileBarSnakeMode) {
                mobileBarSnakeMode = mobileBarGameMode;
                mobileInputEl.placeholder = mobileBarGameMode === 'snake' ? 'w/a/s/d to steer, q to quit'
                    : mobileBarGameMode === 'invaders' ? 'a/d to move, f to fire, q to quit'
                    : 'type a command…';
            }

            // ── Dust motes — slow rise with lateral drift ──
            const dp = dustPoints.geometry.attributes.position.array;
            for (let i = 0; i < DUST_N; i++) {
                const ph = (dustPhase[i] + t * 0.009) % 1;
                dp[i*3]   = dustBase[i*2]   + Math.sin(t * 0.10 + i * 1.37) * 0.09;
                dp[i*3+1] = 0.05 + ph * 3.0;
                dp[i*3+2] = dustBase[i*2+1] + Math.cos(t * 0.085 + i * 0.71) * 0.09;
            }
            dustPoints.geometry.attributes.position.needsUpdate = true;

            // Bloom sits heavier on glowing night worlds; in the daylight
            // worlds it follows the sun — glowy at dawn, nearly off at noon
            bloomPass.strength =
                theme === 'room' ? 0.55 :
                theme === 'northPole' ? 0.5 :
                theme === 'spaceship' ? 0.32 :
                theme === 'lighthouse' ? 0.45 :
                theme === 'tavern' ? 0.5 :
                theme === 'video' ? 0.35 :
                theme === 'tillson' ? 0.6 :
                theme === 'recall' ? 0.5 :
                0.08 + (1 - params.time) * 0.3;
            // The laptop screen fills nearly the whole frame up close — bloom
            // smears its fine UI text into blown-out streaks, so ease off while zoomed
            if (lapZoom || (zoomSaved && zoomSavedFrom === 'lap')) bloomPass.strength = 0;

            // ── One-off click reactions ──
            for (let i = activeEffects.length - 1; i >= 0; i--) {
                if (activeEffects[i](t, dt) === false) activeEffects.splice(i, 1);
            }

            controls.update();
            composer.render();
        }

        animate();
    </script>
</body>
</html>
